# Static checks and the fast test suites: everything that needs no built image.
# Runs on pushes to main and on pull requests.
#
# The steps are `make` calls on purpose. What they run — which trees shellcheck
# sweeps, which CiviCRM release the catalog drift gates test against, which
# phpunit phar and which checksum — is defined once, in the Makefile and
# versions.env, and scaffold/ck runs it in the same toolchain container here and
# on a laptop. Before that split these suites could be run in exactly one
# place: this file. Anything that belongs to "how a check runs" goes in the
# Makefile; what stays here is when it runs and with what permissions.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Reads the repo and nothing else; do not inherit the org default token.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck (style level, fails on any finding) + actionlint + zizmor
      # + php -l + the profile/scenario schemas and their fixtures. actionlint's installer is piped
      # into bash, so the Makefile pins its content hash as well as its tag.
      - name: Static checks
        run: scaffold/ck make lint

      # ckconform's fixtures, the phpstan extension's rule tests, and ckinit's
      # integration checks. `make test` fetches the CiviCRM source tree the
      # catalog drift gates need — without it those gates SKIP, and the suites
      # would go green while the thing they guard never ran.
      - name: Test suites
        run: scaffold/ck make test
