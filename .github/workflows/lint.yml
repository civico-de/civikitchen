# Static checks and the fast test suites: everything that needs no built image.
# Runs on pushes to main and on pull requests.
#
# How a check runs belongs in the Makefile (scaffold/ck runs it the same way
# locally); this file only says when and with what permissions.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Reads the repo and nothing else; do not inherit the org default token.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck (style level, fails on any finding) + actionlint + zizmor
      # + php -l + the profile/scenario schemas and their fixtures. actionlint's installer is piped
      # into bash, so the Makefile pins its content hash as well as its tag.
      - name: Static checks
        run: scaffold/ck make lint

      # `make test` fetches the CiviCRM source the catalog drift gates need;
      # without it they skip.
      - name: Test suites
        run: scaffold/ck make test
