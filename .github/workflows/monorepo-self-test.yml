# extension-ci.yml and extension-release.yml against a repository that holds
# two extensions, one requiring the other: the self-test for
# `working_directory`. One static job per extension, the shape ckinit stamps
# into a monorepo's root callers. The release jobs are dry runs: both archives
# are built, verified and smoke-tested, the addon's with the base's archive from
# this run, and the publish job lists what it would attach.
#
# `uses: ./…` resolves against the CALLING repository, which here is this one,
# so the workflow under test is the one in the branch that triggered the run.
#
# Not on every push: each job boots its own CiviCRM stack. The ck* tools come
# from the image, so Build Dev Images calls this after promoting :standalone;
# the push paths are what the image lacks.
# A newer promote landing first means the run tests newer tools, never older.
#
# The ROOT pass of the template drift check is not exercised here: the example
# tree sits below examples/, while ckinit manages a root whose direct
# subdirectories are the extensions. tests/ckinit/test-ckinit.sh covers it.
name: Monorepo Self-Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/monorepo/**'
      - '.github/workflows/extension-ci.yml'
      - '.github/workflows/extension-release.yml'
      - '.github/workflows/monorepo-self-test.yml'
      - '.github/actions/private-deps/**'
  workflow_call:

permissions:
  contents: read

jobs:
  base:
    if: ${{ github.repository == 'civico-de/civikitchen' }}
    uses: ./.github/workflows/extension-ci.yml
    with:
      working_directory: examples/monorepo/ckmonobase
      image: ghcr.io/civico-de/civikitchen:standalone
      # The browser job against the starter suite of examples/extension-with-playwright.
      playwright: true

  addon:
    if: ${{ github.repository == 'civico-de/civikitchen' }}
    uses: ./.github/workflows/extension-ci.yml
    with:
      working_directory: examples/monorepo/ckmonoaddon
      image: ghcr.io/civico-de/civikitchen:standalone

  release-base:
    if: ${{ github.repository == 'civico-de/civikitchen' }}
    permissions:
      contents: write  # declared by the called publish job; a dry run writes nothing
    uses: ./.github/workflows/extension-release.yml
    with:
      working_directory: examples/monorepo/ckmonobase
      stage: build
      dry_run: true
      image: ghcr.io/civico-de/civikitchen:standalone

  release-addon:
    needs: [release-base]
    permissions:
      contents: write  # declared by the called publish job; a dry run writes nothing
    uses: ./.github/workflows/extension-release.yml
    with:
      working_directory: examples/monorepo/ckmonoaddon
      stage: build
      dry_run: true
      image: ghcr.io/civico-de/civikitchen:standalone

  release-publish:
    needs: [release-base, release-addon]
    permissions:
      contents: write  # declared by the called publish job; a dry run writes nothing
    uses: ./.github/workflows/extension-release.yml
    with:
      stage: publish
      dry_run: true
