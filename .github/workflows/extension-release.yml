# The one release definition every conforming extension repo calls, so a
# release is the same act everywhere: check the version, build the installable
# zip, install it into a real CiviCRM, publish.
#
#   name: Release
#   on:
#     push:
#       tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
#   permissions:
#     contents: read
#   jobs:
#     release:
#       permissions:
#         contents: write        # the called workflow can only narrow this
#       uses: civico-de/civikitchen/.github/workflows/extension-release.yml@v1
#
# Pin the major (@v1), not @main — same versioned contract as extension-ci.yml
# (docs/releases.md). A vX.Y.Z-<pre> tag publishes a pre-release, which never
# takes Latest; a plain tag takes Latest only as the highest plain version.
#
# A repository of several extensions releases them in lockstep: one tag, one
# GitHub release carrying every archive. Its caller has one `stage: build` job
# per extension (`working_directory: <dir>`, `needs:` on the jobs of the
# same-repository extensions it requires, whose archives its smoke test
# installs) and one `stage: publish` job that `needs:` all of them. ckinit
# stamps that caller at the repository root.
#
# NOT a version bumper: the bump is a commit an author writes and reviews, the
# tag is the statement that it is ready (docs/adr/0002-*). What the archive
# contents promise: docs/extension-releases.md, and `ck release --help`.
name: Extension Release

on:
  workflow_call:
    inputs:
      working_directory:
        description: >-
          The extension's directory inside the repository, for a repository
          that holds several extensions. The build, the archive and the smoke
          test are resolved against it. The default is the repository root.
        type: string
        default: '.'
      stage:
        description: >-
          `release` builds this extension and publishes its release. `build`
          builds, verifies and smoke-tests the archive and uploads it for a
          later `publish` job; `publish` builds nothing and publishes one
          release carrying every archive this run's `build` jobs uploaded.
        type: string
        default: 'release'
      dry_run:
        description: >-
          Build and verify the version info.xml carries, without a tag, and
          publish nothing: the publish job computes the release it would make
          and lists the archives it would attach.
        type: boolean
        default: false
      image:
        description: >-
          CiviKitchen image the install smoke test runs in. Empty (the
          default): the :standalone-<minor> image of the repo's policy.civicrm,
          else the released contract image the CI compose stack pins. Setting
          both this and policy.civicrm is an error.
        type: string
        default: ''
      smoke_test:
        description: >-
          Install the built archive into a fresh CiviCRM before publishing.
          Turn off only for an extension whose install cannot be reached this
          way (and say so in the caller).
        type: boolean
        default: true
      require_changelog:
        description: 'Fail when the repo has no CHANGELOG.md at all'
        type: boolean
        default: false
      draft:
        description: 'Publish the GitHub release as a draft'
        type: boolean
        default: false
      runs_on:
        description: Runner label override for all release jobs
        type: string
        default: ''
      composer_install:
        description: >-
          Install locked production dependencies and include the generated
          vendor/ tree in the archive. Use when vendor/ is not committed but
          the extension requires vendor/autoload.php at runtime.
        type: boolean
        default: false
      composer_app_repositories:
        description: >-
          Comma- or newline-separated repository names within the caller's
          owner that the GitHub App token may read: private Composer packages,
          and the repositories a `policy.extension_sources` release pin names.
          Required whenever the app secrets are supplied.
        type: string
        default: ''
      node_version:
        description: >-
          Node the declared release build (policy.dist.build) runs its binaries
          on: Bun replaces the package manager, not Node. Same default as the
          extension CI's node_version, so CI tests what the release builds.
        type: string
        default: '24'

    secrets:
      composer_app_id:
        description: >-
          App ID of a GitHub App with `contents: read`, installed on the
          private dependency repos — Composer packages, and any repository a
          release pin downloads a dependency archive from. Optional — without
          it only what is public resolves.
        required: false
      composer_app_private_key:
        description: >-
          Private key (PEM) of that app. Used on the runner only to mint a
          short-lived token; neither key nor token is ever copied into the
          archive or the smoke container — the container gets the fetched
          bytes, never the credential that fetched them.
        required: false

permissions:
  contents: read

jobs:
  dist:
    if: ${{ inputs.stage != 'publish' }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      # Inputs reach the shell through the environment, never through expression
      # interpolation inside `run:` — an interpolated input IS the script text.
      CK_REQUIRE_CHANGELOG: ${{ inputs.require_changelog }}
      CK_RELEASE_REF: HEAD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the SHA this workflow was resolved from, so the ckrelease that
      # builds the artifact is the one belonging to the pinned contract — same
      # mechanism the drift job in extension-ci.yml uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          path: .civikitchen-ci

      - name: Install the locked CiviKitchen configuration parser
        working-directory: .
        run: |
          composer install --no-dev --no-interaction --no-progress --classmap-authoritative \
            --working-dir=.civikitchen-ci/packages/civikitchen-scenario-schema

      # From the checkout root, so a working_directory that does not exist gets
      # this message rather than a runner error. A tag that is no release
      # version fails here, before any build work.
      - name: Validate the inputs and read the extension key
        id: key
        working-directory: .
        env:
          CK_STAGE: ${{ inputs.stage }}
          CK_DRY_RUN: ${{ inputs.dry_run }}
          CK_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          case "$CK_STAGE" in
            release|build) ;;
            *) echo "stage must be release, build or publish (got: '$CK_STAGE')" >&2; exit 1 ;;
          esac
          case "$CK_WORKING_DIRECTORY" in
            '') echo "working_directory is empty — '.' is the repository root" >&2; exit 1 ;;
            /*) echo "working_directory must be relative to the repository root (got: '$CK_WORKING_DIRECTORY')" >&2; exit 1 ;;
          esac
          wd=${CK_WORKING_DIRECTORY#./}
          wd=${wd%/}
          wd=${wd:-.}
          case "$wd" in
            ..|../*|*/..|*/../*) echo "working_directory must stay inside the repository (got: '$CK_WORKING_DIRECTORY')" >&2; exit 1 ;;
            *//*|*/./*) echo "working_directory must be a plain relative path (got: '$CK_WORKING_DIRECTORY')" >&2; exit 1 ;;
          esac
          [ -f "$wd/info.xml" ] \
            || { echo "no info.xml in '$CK_WORKING_DIRECTORY' — this is not a CiviCRM extension" >&2; exit 1; }
          if [ "$CK_DRY_RUN" = true ]; then
            echo "dry run: building the version info.xml carries, publishing nothing"
            version=
          else
            case "$GITHUB_REF" in
              refs/tags/*) echo "releasing $GITHUB_REF_NAME" ;;
              # The archive is built from the tag; a branch push would publish a
              # release named after the branch.
              *) echo "extension-release only runs on a tag push (got $GITHUB_REF)" >&2; exit 1 ;;
            esac
            .civikitchen-ci/.github/scripts/release-publish-flags.sh "$GITHUB_REF_NAME" < /dev/null > /dev/null
            version=$GITHUB_REF_NAME
          fi
          key=$(cd "$wd" && php "$GITHUB_WORKSPACE/.civikitchen-ci/toolbelt/bin/ckrelease" info key)
          file=$(cd "$wd" && php "$GITHUB_WORKSPACE/.civikitchen-ci/toolbelt/bin/ckrelease" info file)
          {
            echo "key=$key"
            echo "version=$version"
            echo "wd=$wd"
          } >> "$GITHUB_OUTPUT"
          # Per extension: two build jobs of one run can share a Docker daemon,
          # and Compose accepts only lower-case letters, digits, '-' and '_'.
          slug=${file,,}
          echo "COMPOSE_PROJECT_NAME=ck-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${slug//[^a-z0-9_-]/-}-release" >> "$GITHUB_ENV"

      # A same-repository <requires> is released by this tag, so no pin names it: the
      # smoke test installs its archive from this run. Writes "key dir archive" lines.
      - name: Find the same-repository extensions this one requires
        id: siblings
        working-directory: .
        env:
          CK_EXT_KEY: ${{ steps.key.outputs.key }}
          CK_WD: ${{ steps.key.outputs.wd }}
        run: |
          set -euo pipefail
          ck="$GITHUB_WORKSPACE/.civikitchen-ci/toolbelt/bin/ck"
          ckrelease="$GITHUB_WORKSPACE/.civikitchen-ci/toolbelt/bin/ckrelease"
          list="$RUNNER_TEMP/release-siblings.txt"
          : > "$list"
          declare -A dirs=() seen=(["$CK_EXT_KEY"]=1)
          # Siblings are the directories next to this one; in ckinit's layout, the root's subdirectories.
          if [ "$CK_WD" != . ]; then
            parent=$(dirname "$CK_WD")
            if [ "$parent" = . ]; then infos=(*/info.xml); else infos=("$parent"/*/info.xml); fi
            for info in "${infos[@]}"; do
              [ -f "$info" ] || continue
              key=$(php "$ck" internal extension-key "$info")
              [ -n "$key" ] || { echo "$info carries no key attribute" >&2; exit 1; }
              dirs[$key]=${info%/info.xml}
            done
          fi
          queue=("$CK_WD")
          while [ "${#queue[@]}" -gt 0 ]; do
            requires=$(php "$ck" internal extension-requires "${queue[0]}/info.xml")
            queue=("${queue[@]:1}")
            while IFS= read -r required; do
              if [ -z "$required" ] || [ -z "${dirs[$required]:-}" ] || [ -n "${seen[$required]:-}" ]; then
                continue
              fi
              seen[$required]=1
              dir=${dirs[$required]}
              queue+=("$dir")
              archive=$(cd "$dir" && php "$ckrelease" info dist-name)
              echo "$required $dir $archive" >> "$list"
              echo "requires $required from $dir"
            done <<< "$requires"
          done
          if [ -s "$list" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      # Read once, here, so the token gate, the staging step and the smoke
      # stack all agree on whether this release has a dependency that only a
      # credential can reach. ckconform is the one parser for civikitchen.yaml.
      - name: Read the staged-release dependency pins
        id: pins
        run: |
          set -euo pipefail
          # The same-repository extensions' pins too: the smoke test resolves their requires.
          ckconform="$GITHUB_WORKSPACE/.civikitchen-ci/toolbelt/bin/ckconform"
          php "$ckconform" --policy extension_release > "$RUNNER_TEMP/release-pins-all.txt"
          while read -r _ dir _; do
            (cd "$GITHUB_WORKSPACE/$dir" && php "$ckconform" --policy extension_release) \
              >> "$RUNNER_TEMP/release-pins-all.txt"
          done < "$RUNNER_TEMP/release-siblings.txt"
          # One staged archive per key: two extensions pinning it differently cannot both install.
          sed 's/ -- .*$//' "$RUNNER_TEMP/release-pins-all.txt" | sort -u > "$RUNNER_TEMP/release-pins.txt"
          conflicts=$(cut -d' ' -f1 "$RUNNER_TEMP/release-pins.txt" | uniq -d)
          if [ -n "$conflicts" ]; then
            echo "these dependencies are pinned to different releases by extensions of this repository: ${conflicts//$'\n'/, } — pin one release in every civikitchen.yaml" >&2
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/release-pins.txt" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      # policy.dist.build: output the repo builds instead of committing. Built before
      # any credential reaches the runner, because the build runs dependency code.
      - name: Read the declared release build
        id: dist-build
        run: |
          set -euo pipefail
          # Refuses an unsafe output path, an unpinned Bun or a missing bun.lock up front.
          php "$GITHUB_WORKSPACE"/.civikitchen-ci/toolbelt/bin/ckconform --dist-paths > /dev/null
          tool=$(php "$GITHUB_WORKSPACE"/.civikitchen-ci/toolbelt/bin/ckconform --policy dist_build_tool)
          echo "tool=$tool" >> "$GITHUB_OUTPUT"

      # Read by the smoke stack's ${CIVIKITCHEN_IMAGE} on every compose call,
      # not just `up` — an unset variable there resolves to an empty image.
      - name: Resolve the smoke-test image
        env:
          CK_IMAGE_INPUT: ${{ inputs.image }}
        run: |
          set -euo pipefail
          minor=$(php "$GITHUB_WORKSPACE"/.civikitchen-ci/toolbelt/bin/ckconform --policy civicrm)
          image=$("$GITHUB_WORKSPACE"/.civikitchen-ci/.github/scripts/stack-image.sh "$minor" "$CK_IMAGE_INPUT" ghcr.io/civico-de/civikitchen:v1)
          echo "smoke-test image: $image"
          echo "CIVIKITCHEN_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Set up Node for the declared release build
        if: ${{ steps.dist-build.outputs.tool == 'bun' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Bun for the declared release build
        if: ${{ steps.dist-build.outputs.tool == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ inputs.working_directory }}/package.json

      # `ckrelease dist` stages exactly the declared outputs and fails on a missing one.
      - name: Build the declared release output
        if: ${{ steps.dist-build.outputs.tool == 'bun' }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      # Branching on the secret in bash — the `secrets` context is not
      # available in `if:`. No app means every required package is public.
      - name: Decide whether a private-dependency token is needed
        id: need-token
        if: ${{ inputs.composer_install || steps.pins.outputs.any == 'true' }}
        env:
          CK_COMPOSER_APP_ID: ${{ secrets.composer_app_id }}
          CK_COMPOSER_APP_PRIVATE_KEY: ${{ secrets.composer_app_private_key }}
          CK_COMPOSER_APP_REPOSITORIES: ${{ inputs.composer_app_repositories }}
        run: |
          set -euo pipefail
          if [ -n "${CK_COMPOSER_APP_ID:-}" ] && [ -n "${CK_COMPOSER_APP_PRIVATE_KEY:-}" ]; then
            if [ -z "${CK_COMPOSER_APP_REPOSITORIES//[[:space:],]/}" ]; then
              echo "composer_app_repositories must list the repositories readable by the app token" >&2
              exit 1
            fi
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${CK_COMPOSER_APP_ID:-}" ] || [ -n "${CK_COMPOSER_APP_PRIVATE_KEY:-}" ]; then
            # Half a credential is a configuration mistake, and it would
            # surface much later as an unexplained 404 on a private read.
            echo "composer_app_id and composer_app_private_key go together — one without the other is not an app" >&2
            exit 1
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a read token for private dependencies
        id: app
        if: ${{ steps.need-token.outputs.app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.composer_app_id }}
          private-key: ${{ secrets.composer_app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.composer_app_repositories }}
          # The token only ever reads: composer's private packages and the
          # pinned dependency releases. Nothing here writes with it.
          permission-contents: read

      # The credential stays on the runner. The smoke container is handed the
      # verified bytes and never the token that fetched them — the same rule
      # the sibling checkout follows in extension-ci.yml. Resolving by tag and
      # asset name rather than by asset id matters: `gh release upload
      # --clobber` in the publish job replaces an asset, and a replaced asset
      # has a new id while tag, name and digest are unchanged.
      - name: Stage the pinned dependency releases
        if: ${{ steps.pins.outputs.any == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          CK_DEPS: ${{ runner.temp }}/ckrelease-deps
        run: |
          set -euo pipefail
          mkdir -p "$CK_DEPS"
          while read -r key repo tag asset digest _; do
            [ -n "$key" ] || continue
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$CK_DEPS" \
              || { echo "could not download $asset from $repo $tag — for a private repository the app has to be installed on it and listed in composer_app_repositories" >&2; exit 1; }
            printf '%s  %s\n' "$digest" "$CK_DEPS/$asset" | sha256sum --check --status \
              || { echo "checksum mismatch for the pinned $key release $tag" >&2; exit 1; }
            echo "staged $key from $repo $tag"
          done < "$RUNNER_TEMP/release-pins.txt"

      - name: Bundle locked production dependencies
        if: ${{ inputs.composer_install }}
        env:
          # The app token for private packages, else the run's own token: an
          # unauthenticated runner hits GitHub's API rate limit on dist
          # downloads and composer silently falls back to source clones.
          CK_COMPOSER_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          # Private packages are declared by https://github.com/... URL; the
          # token goes in as Composer's github-oauth credential.
          composer config -g github-oauth.github.com "$CK_COMPOSER_TOKEN"

          # The lockfile is the dependency input; do not update it and do not
          # bypass its PHP requirements. Repositories whose runtime PHP is newer
          # than the runner declare config.platform.php, as in extension CI.
          composer install --no-dev --no-interaction --no-progress
          test -f vendor/autoload.php \
            || { echo 'composer_install produced no vendor/autoload.php' >&2; exit 1; }

          # Apply ckrelease's one authoritative exclusion policy to development
          # directories and config files nested inside Composer packages.
          while IFS=' ' read -r kind relpath; do
            case "$kind" in
              dir)
                find vendor -type d -path "*/$relpath" -prune -exec rm -rf -- {} +
                ;;
              file)
                find vendor -type f -path "*/$relpath" -delete
                ;;
            esac
          done < <(php "$GITHUB_WORKSPACE"/.civikitchen-ci/toolbelt/bin/ckconform --dist-paths)

          # A package composer installed from source carries its own .git;
          # `git add` would record that as a gitlink (an empty entry in the
          # archive) instead of the package's files. Strip them first.
          find vendor -name .git -prune -exec rm -rf -- {} +

          # ckrelease archives Git objects, never a mutable working tree. Add
          # vendor/ only to the disposable Actions index and archive that tree;
          # the pushed tag itself remains untouched.
          git add -f vendor
          echo "CK_RELEASE_REF=$(git write-tree)" >> "$GITHUB_ENV"

      - name: Build the distribution archive
        env:
          # Outside the checkout on purpose: an extension repo may well track its
          # own dist/ (a committed frontend build), and the release artifact must
          # not land in the tree the archive is built from.
          CK_DIST: ${{ runner.temp }}/ckrelease
          CK_RELEASE_VERSION: ${{ steps.key.outputs.version }}
        run: |
          set -euo pipefail
          args=()
          if [ "$CK_REQUIRE_CHANGELOG" = 'true' ]; then
            args+=(--require-changelog)
          fi
          # dist runs the consistency check itself and refuses to build without
          # it, so there is no way to publish an archive that skipped it.
          # An empty version (dry run) builds whatever info.xml carries.
          php "$GITHUB_WORKSPACE"/.civikitchen-ci/toolbelt/bin/ckrelease dist \
            --version "$CK_RELEASE_VERSION" --ref "$CK_RELEASE_REF" --output "$CK_DIST" "${args[@]}"

      # Merged: an artifact is extracted flat or into a subdirectory depending
      # on how many match, so each sibling is picked by its exact archive name.
      - name: Download this run's archives
        if: ${{ inputs.smoke_test && steps.siblings.outputs.any == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ckrelease-dist-*
          merge-multiple: true
          path: ${{ runner.temp }}/ckrelease-run

      - name: Stage the required same-repository archives
        if: ${{ inputs.smoke_test && steps.siblings.outputs.any == 'true' }}
        working-directory: .
        env:
          CK_RUN_ARCHIVES: ${{ runner.temp }}/ckrelease-run
          CK_SIBLINGS: ${{ runner.temp }}/ckrelease-siblings
        run: |
          set -euo pipefail
          mkdir -p "$CK_SIBLINGS"
          while read -r key _ archive; do
            if [ ! -f "$CK_RUN_ARCHIVES/$archive" ] || [ ! -f "$CK_RUN_ARCHIVES/$archive.sha256" ]; then
              echo "no $archive in this run — list the job that builds $key under this job's needs:" >&2
              exit 1
            fi
            (cd "$CK_RUN_ARCHIVES" && sha256sum --check --strict --status "$archive.sha256") \
              || { echo "the archive of $key does not match its digest" >&2; exit 1; }
            cp "$CK_RUN_ARCHIVES/$archive" "$CK_SIBLINGS/"
            echo "staged $key from this run"
          done < "$RUNNER_TEMP/release-siblings.txt"

      # A release archive that has never been installed is a guess. This is the
      # same stack extension-ci.yml runs in, minus the source mount: the site
      # only ever sees the zip, which is what a user gets.
      - name: Install smoke test
        if: ${{ inputs.smoke_test }}
        env:
          CK_EXT_KEY: ${{ steps.key.outputs.key }}
          CK_DIST: ${{ runner.temp }}/ckrelease
          CK_POLICY_DIR: ${{ runner.temp }}/ckrelease-policy
          CK_DEPS: ${{ runner.temp }}/ckrelease-deps
          CK_SIBLINGS: ${{ runner.temp }}/ckrelease-siblings
        run: |
          set -euo pipefail
          # Always directories, even with nothing staged: compose interpolates
          # the paths on every call, and an unset variable is an invalid mount.
          mkdir -p "$CK_DEPS" "$CK_SIBLINGS"
          # The archive carries no civikitchen.yaml (a dev file, excluded by the
          # central list), but the <requires> resolver reads extension_source
          # pins from it. Its own directory, not $CK_DIST: that one is uploaded
          # as the release artifact. A directory mount is fine when the file
          # does not exist; a file mount would silently create a directory.
          # One directory per extension key, the siblings' included: their
          # <requires> are resolved from their own pins.
          mkdir -p "$CK_POLICY_DIR"
          sibling_keys=()
          while read -r key dir _; do
            sibling_keys+=("$key")
            if [ -f "$GITHUB_WORKSPACE/$dir/civikitchen.yaml" ]; then
              mkdir -p "$CK_POLICY_DIR/$key"
              cp "$GITHUB_WORKSPACE/$dir/civikitchen.yaml" "$CK_POLICY_DIR/$key/"
            fi
          done < "$RUNNER_TEMP/release-siblings.txt"
          if [ -f civikitchen.yaml ]; then
            mkdir -p "$CK_POLICY_DIR/$CK_EXT_KEY"
            cp civikitchen.yaml "$CK_POLICY_DIR/$CK_EXT_KEY/"
          fi
          cat > smoke-compose.yml <<'YAML'
          name: ckrelease-smoke
          services:
            app:
              image: ${CIVIKITCHEN_IMAGE}
              pull_policy: always
              depends_on:
                db:
                  condition: service_healthy
              environment:
                CIVICRM_AUTO_INSTALL: "1"
                CIVICRM_DB_HOST: db
                CIVICRM_DB_NAME: civicrm
                CIVICRM_DB_USER: civicrm
                CIVICRM_DB_PASSWORD: civicrm
                CIVIKITCHEN_SITE_URL: "http://localhost:8080"
              volumes:
                - ${CK_DIST}:/ck-dist:ro
                - ${CK_POLICY_DIR}:/ck-policy:ro
                - ${CK_DEPS}:/ck-deps:ro
                - ${CK_SIBLINGS}:/ck-siblings:ro
            db:
              image: mariadb:11.4
              environment:
                MYSQL_ROOT_PASSWORD: root
                MYSQL_DATABASE: civicrm
                MYSQL_USER: civicrm
                MYSQL_PASSWORD: civicrm
              healthcheck:
                test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
                interval: 5s
                timeout: 5s
                retries: 10
          YAML
          docker compose -f smoke-compose.yml up -d --wait --quiet-pull

          # Unzip as the image user: the extension directory is the image's, not ours.
          # CK_EXT_DIR is where the image puts extensions (docker/runtime/provision.sh).
          docker compose -f smoke-compose.yml exec -T \
            -e "CK_EXT_KEY=$CK_EXT_KEY" app bash -c '
            set -eu
            mkdir -p "${CK_EXT_DIR:-/var/www/html/ext}"
            for sibling in /ck-siblings/*.zip; do
              if [ -f "$sibling" ]; then unzip -q -o "$sibling" -d "${CK_EXT_DIR:-/var/www/html/ext}"; fi
            done
            unzip -q -o /ck-dist/*.zip -d "${CK_EXT_DIR:-/var/www/html/ext}"
            for policy in /ck-policy/*/civikitchen.yaml; do
              if [ -f "$policy" ]; then
                key=${policy%/civikitchen.yaml}
                cp "$policy" "${CK_EXT_DIR:-/var/www/html/ext}/${key##*/}/civikitchen.yaml"
              fi
            done
            chown -R www-data:www-data "${CK_EXT_DIR:-/var/www/html/ext}"'

          # Rescan the container so the new directory is known, resolve the
          # info.xml <requires> the way the entrypoint does for a mounted
          # extension (registry download, or the extension_source pin), then
          # install for real — this is where a missing <requires>, a broken
          # upgrader or a PHP file the exclude list swallowed by mistake
          # actually shows up. provision.sh is sourced for its functions only;
          # this exec already runs as the web user, so ck_as_web is a no-op.
          # The same-repository extensions first: enabling this one installs
          # them, and by then their own requires are in place.
          docker compose -f smoke-compose.yml exec -T -u www-data \
            -e "CK_EXT_KEY=$CK_EXT_KEY" -e "CK_SIBLING_KEYS=${sibling_keys[*]}" \
            -e CK_DEP_ARCHIVE_DIR=/ck-deps app bash -c '
            set -eu
            cv ev "CRM_Extension_System::singleton()->getFullContainer()->refresh();"
            ck_as_web() { "$@"; }
            . /usr/local/share/civikitchen/provision.sh
            for sibling in $CK_SIBLING_KEYS; do
              ck_resolve_requires "$sibling"
            done
            ck_resolve_requires "$CK_EXT_KEY"
            cv ext:enable "$CK_EXT_KEY"'

          # Same status assertion the lifecycle smoke in extension-ci.yml uses:
          # `cv ext:enable` can succeed on a site where the extension still ends
          # up something other than installed.
          status=$(docker compose -f smoke-compose.yml exec -T -u www-data \
            -e "CK_EXT_KEY=$CK_EXT_KEY" app bash -c \
            'cv ev "echo CRM_Extension_System::singleton()->getManager()->getStatus(getenv(\"CK_EXT_KEY\"));"' \
            | tr -d '[:space:]')
          [ "$status" = installed ] \
            || { echo "smoke: extension ended up [$status], expected [installed]" >&2; exit 1; }

      # A failed stack is a stack trace of nothing without its logs.
      - name: App logs on failure
        if: ${{ failure() && inputs.smoke_test }}
        run: |
          [ -f smoke-compose.yml ] || exit 0
          docker compose -f smoke-compose.yml logs app | tail -200

      # On a self-hosted runner the stack outlives the job otherwise — with its
      # database — and the next job on that host inherits the memory pressure.
      # By label rather than `compose down`: the compose file may not exist yet
      # when an earlier step failed.
      - name: Tear down the smoke stack
        if: ${{ always() && inputs.smoke_test }}
        run: |
          # Unset when the job failed before the key was read, and so before any stack.
          [ -n "${COMPOSE_PROJECT_NAME:-}" ] || exit 0
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f -v
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker network rm
          docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker volume rm

      # Named by extension key: every build job of a run uploads one, and the
      # publish job collects them all by the prefix.
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckrelease-dist-${{ steps.key.outputs.key }}
          path: ${{ runner.temp }}/ckrelease/
          if-no-files-found: error

  # One release per tag: after this extension's own build (stage release), or
  # after every build job of a several-extensions caller (stage publish).
  publish:
    needs: dist
    if: ${{ !cancelled() && inputs.stage != 'build' && (needs.dist.result == 'success' || (inputs.stage == 'publish' && needs.dist.result == 'skipped')) }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    # The only job that writes anything, and the only one with a token that can.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          path: .civikitchen-ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ckrelease-dist-*
          merge-multiple: true
          path: ${{ runner.temp }}/ckrelease-dist

      # A pattern that matches nothing downloads nothing; a release without an
      # archive, or with one damaged on the way, is not published.
      - name: Check the archives
        env:
          CK_STAGE: ${{ inputs.stage }}
          CK_DIST: ${{ runner.temp }}/ckrelease-dist
        run: |
          set -euo pipefail
          case "$CK_STAGE" in
            release|publish) ;;
            *) echo "stage must be release, build or publish (got: '$CK_STAGE')" >&2; exit 1 ;;
          esac
          if ! compgen -G "$CK_DIST/*.zip" > /dev/null; then
            echo "no release archive in this run — a publish job needs: every build job" >&2
            exit 1
          fi
          (cd "$CK_DIST" && sha256sum --check --strict ./*.sha256)

      # --generate-notes is the delegation the issue asked for: GitHub already
      # writes decent notes from merged PRs, and a release that exists is
      # re-runnable (upload --clobber) instead of erroring on the second try.
      # The checkout is shallow without tags; the API lists them. Left to gh, a
      # late release of an older version or a pre-release takes Latest by date.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CK_DRAFT: ${{ inputs.draft }}
          CK_DRY_RUN: ${{ inputs.dry_run }}
          CK_DIST: ${{ runner.temp }}/ckrelease-dist
        run: |
          set -euo pipefail
          # Lockstep: every archive carries one version, and a tag names that version.
          versions=()
          for zip in "$CK_DIST"/*.zip; do
            info=$(unzip -Z1 "$zip" | grep -E '^[^/]+/info\.xml$' || true)
            [ -n "$info" ] || { echo "${zip##*/} has no <key>/info.xml at its top level — not an extension archive" >&2; exit 1; }
            unzip -p "$zip" "$info" > "$RUNNER_TEMP/release-info.xml"
            versions+=("$(php .civikitchen-ci/toolbelt/bin/ck internal xml-field "$RUNNER_TEMP/release-info.xml" version)")
          done
          distinct=$(printf '%s\n' "${versions[@]}" | sort -u)
          if [ "$(wc -l <<< "$distinct")" -ne 1 ] || [ -z "$distinct" ]; then
            echo "the archives carry different versions (${distinct//$'\n'/, }) — one release has one version" >&2
            exit 1
          fi
          tag=v$distinct
          if [ "$CK_DRY_RUN" != true ]; then
            case "$GITHUB_REF" in
              refs/tags/*) ;;
              *) echo "extension-release only runs on a tag push (got $GITHUB_REF)" >&2; exit 1 ;;
            esac
            [ "$tag" = "$GITHUB_REF_NAME" ] \
              || { echo "the archives carry $distinct, but the tag is $GITHUB_REF_NAME" >&2; exit 1; }
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref' > "$RUNNER_TEMP/release-tags.txt"
          flags=$(.civikitchen-ci/.github/scripts/release-publish-flags.sh "$tag" \
            < "$RUNNER_TEMP/release-tags.txt")
          echo "$flags"
          if [ "$CK_DRY_RUN" = true ]; then
            echo "dry run: release $tag would carry"
            ls -1 "$CK_DIST"
            exit 0
          fi
          prerelease=$(sed -n 's/^prerelease=//p' <<< "$flags")
          latest=$(sed -n 's/^latest=//p' <<< "$flags")
          # A draft cannot be Latest; publishing it later decides that in the UI.
          args=()
          if [ "$CK_DRAFT" = 'true' ]; then
            args+=(--draft)
          else
            args+=(--latest="$latest")
          fi
          if [ "$prerelease" = 'true' ]; then
            args+=(--prerelease)
          fi
          # A re-run only replaces assets: upload leaves Latest and pre-release
          # as the first run set them, even if a higher tag was released since.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — replacing its assets"
            gh release upload "$GITHUB_REF_NAME" "$CK_DIST"/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
              "${args[@]}" "$CK_DIST"/*
          fi
