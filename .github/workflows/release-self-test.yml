# extension-release.yml in its single-extension shape, as a dry run. Its own
# workflow: artifact names are unique per run, and Monorepo Self-Test uploads
# the same archive.
name: Release Self-Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/monorepo/ckmonobase/**'
      - '.github/workflows/extension-release.yml'
      - '.github/workflows/release-self-test.yml'
      - '.github/scripts/release-publish-flags.sh'
      - '.github/scripts/release-mirror.sh'
      - '.github/scripts/release-mirror-notes.sh'

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.repository == 'civico-de/civikitchen' }}
    permissions:
      contents: write  # declared by the called publish job; a dry run writes nothing
    uses: ./.github/workflows/extension-release.yml
    with:
      working_directory: examples/monorepo/ckmonobase
      dry_run: true
      image: ghcr.io/civico-de/civikitchen:standalone
