# One git-built Standalone tag: build civicrm-core `ref` on both arches, merge,
# smoke-test, then move `:standalone-<tag>`. Called once per tag by
# build-git-images.yml, so a failing ref holds back only its own tag.
name: Build git image

on:
  workflow_call:
    inputs:
      ref:
        description: civicrm-core and civicrm-packages branch to build from.
        required: true
        type: string
      tag:
        description: Published as `:standalone-<tag>`.
        required: true
        type: string

# A called workflow does not inherit the caller's env.
env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/civikitchen

# Default for every job; the ones that push to GHCR widen it within the
# caller's grant.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Candidate tag only; promote moves the moving tag after the smoke tests
      # pass.
      - name: Build and push standalone candidate image from git
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Authenticated GitHub dist downloads for composer; see the Dockerfile.
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ github.token }}"}}
          file: docker/standalone/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            CIVICRM_SOURCE=git
            CIVICRM_VERSION=${{ inputs.ref }}
          tags: |
            ${{ env.IMAGE_PREFIX }}:standalone-${{ inputs.tag }}-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-buildcache:standalone-git-${{ inputs.tag }}-${{ matrix.arch }}
          # The image is pushed before the cache export, so a failed export
          # (`error writing layer blob: not_found`) must not fail the job.
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-buildcache:standalone-git-${{ inputs.tag }}-${{ matrix.arch }},mode=max,ignore-error=true
          # The caller's daily cron rebuilds from scratch: a cached apt layer
          # would keep serving outdated packages past their security fix.
          no-cache: ${{ github.event_name == 'schedule' }}

  merge:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/merge-manifest.yml
    with:
      prefix: standalone-
      tags: ${{ format('[{0}]', toJSON(inputs.tag)) }}

  # The dev-tools and boot tests of Build Dev Images' smoke-test-standalone.
  # Not Trivy-scanned: only core's own tree differs from the scanned stable images.
  smoke-test:
    needs: merge
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm64, linux/amd64]
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/amd64
            runner: ubuntu-24.04

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (for the dev-tools test script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Functional test of bundled dev tools
        env:
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ inputs.tag }}-${{ github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/run-dev-tools-test.sh

      - name: Boot test (first boot against an external DB, mounted extension, core locale)
        env:
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ inputs.tag }}-${{ github.sha }}
        run: bash tests/images/boot-test-standalone.sh "$IMG"

  promote:
    # `imagetools create` from the candidate manifest list keeps it multi-arch.
    needs: smoke-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote tested candidate to its moving tag
        env:
          CK_TAG: standalone-${{ inputs.tag }}
        run: |
          IMG="${IMAGE_PREFIX}:${CK_TAG}"
          docker buildx imagetools create -t "$IMG" "$IMG-${GITHUB_SHA}"
