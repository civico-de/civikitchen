name: Standalone Playwright E2E

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing the Playwright project
        type: string
        default: 'tests/e2e'
      node_version:
        description: Node.js major used by the test project
        type: string
        default: '24'
      cache_dependency_path:
        description: Path to the E2E package-lock.json
        type: string
        default: 'tests/e2e/package-lock.json'
      install_command:
        description: Optional dependency installation command
        type: string
        default: ''
      browser_install_command:
        description: Optional Playwright browser installation command
        type: string
        default: ''
      prepare_command:
        description: Optional build or stack-setup command
        type: string
        default: ''
      test_command:
        description: Playwright test command
        type: string
        default: 'npx playwright test'
      failure_command:
        description: Optional diagnostic command run after a failure
        type: string
        default: ''
      cleanup_command:
        description: Optional cleanup command, always run last
        type: string
        default: ''
      base_url:
        description: Optional BASE_URL exposed to the tests
        type: string
        default: ''
      artifact_paths:
        description: Newline-separated artifact paths, relative to repository root
        type: string
        default: |-
          tests/e2e/playwright-report/
          tests/e2e/test-results/
      artifact_retention_days:
        description: Number of days to retain Playwright artifacts
        type: number
        default: 7
      timeout_minutes:
        description: Maximum runtime for the E2E job
        type: number
        default: 30
      runs_on:
        description: Runner label override
        type: string
        default: ''
      sibling_repo:
        description: >-
          Second extension repo (`owner/repo`, or `owner/repo@ref` to pin a
          tag, branch or full commit — a tag keeps old runs reproducible and a
          sibling's main from reddening every consumer) checked out to
          .civikitchen-siblings/ and mounted read-only beside this one, under
          the key from ITS info.xml — for extensions implementing a sibling's
          interfaces. The prepare/test/cleanup commands address it through
          CK_SIBLING_DIR (absolute path), CK_SIBLING_KEY (that extension key)
          and CK_SIBLING_OVERRIDE (a compose override file that bind-mounts it
          read-only). A sibling whose composer.lock carries runtime packages
          gets `composer install --no-dev` first; a private sibling or package
          needs the composer_app_* secrets. Empty mounts nothing.
        type: string
        default: ''
      composer_app_repositories:
        description: >-
          Comma- or newline-separated repository names within the caller's
          owner that the GitHub App token may read. Required whenever the app
          secrets are supplied for private Composer packages or a private
          sibling; list only the repositories actually needed by this run.
        type: string
        default: ''

    secrets:
      composer_app_id:
        description: >-
          App ID of a GitHub App with `contents: read`, installed on the
          private dependency repos (composer packages, sibling). Optional —
          without it composer resolves what is public and the sibling checkout
          uses the caller-scoped token (404 for private).
        required: false
      composer_app_private_key:
        description: >-
          Private key (PEM) of that app. Used once on the runner to mint a
          short-lived installation token; never enters a container.
        required: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One compose project per CALL, not per run: a caller that runs this
      # workflow twice in one run (two identity providers, say) lands both
      # copies on the same Docker host of a multi-slot self-hosted runner, and
      # with one shared name the first `down` kills the other job's stack.
      # The test command is what differs between the calls.
      - name: Compose project name
        env:
          CK_COMMAND: ${{ inputs.test_command }}
        run: |
          suffix=$(printf '%s' "$CK_COMMAND" | sha256sum | cut -c1-8)
          echo "COMPOSE_PROJECT_NAME=ck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pw-${suffix}" >> "$GITHUB_ENV"

      - name: Validate inputs
        if: ${{ inputs.sibling_repo != '' }}
        env:
          CK_SIBLING_REPO: ${{ inputs.sibling_repo }}
        run: |
          [[ "$CK_SIBLING_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*(@[A-Za-z0-9][A-Za-z0-9._/-]*)?$ ]] \
            || { echo "invalid sibling_repo (expected owner/repo or owner/repo@ref): $CK_SIBLING_REPO" >&2; exit 1; }

      # The private-dependency steps are shared with the extension CI jobs, so
      # they live in this repository as a composite action — and a reusable
      # workflow reaches its own repository only by checking it out at the SHA
      # it was resolved from. `uses: ./…` alone would resolve against the
      # CALLING repository. Under .civikitchen-siblings/, the one directory the
      # extension scanner skips and cklint ignores.
      - name: Check out civikitchen for the shared private-dependency steps
        if: ${{ inputs.sibling_repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/actions
          path: .civikitchen-siblings/ci

      # No ext_key: this workflow does not know the stack's own enable list, so
      # the override only mounts — CIVIKITCHEN_ENABLE_EXTENSIONS stays caller-owned.
      - name: Private dependencies
        id: deps
        if: ${{ inputs.sibling_repo != '' }}
        uses: ./.civikitchen-siblings/ci/.github/actions/private-deps
        with:
          sibling_repo: ${{ inputs.sibling_repo }}
          composer_app_repositories: ${{ inputs.composer_app_repositories }}
          app_id: ${{ secrets.composer_app_id }}
          app_private_key: ${{ secrets.composer_app_private_key }}

      # The caller's prepare/test commands address the sibling through these.
      - name: Expose the sibling to the caller's commands
        if: ${{ inputs.sibling_repo != '' }}
        env:
          CK_SIBLING_DIRS: ${{ steps.deps.outputs.sibling_paths }}
          CK_OVERRIDE: ${{ steps.deps.outputs.sibling_override }}
        run: |
          set -euo pipefail
          # sibling_repo is a single repo here, so the action returns one path.
          {
            echo "CK_SIBLING_DIR=$GITHUB_WORKSPACE/$CK_SIBLING_DIRS"
            echo "CK_SIBLING_KEY=${CK_SIBLING_DIRS##*/}"
            echo "CK_SIBLING_OVERRIDE=$CK_OVERRIDE"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        env:
          CK_COMMAND: ${{ inputs.install_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      - name: Install Playwright browsers
        if: ${{ inputs.browser_install_command != '' }}
        env:
          CK_COMMAND: ${{ inputs.browser_install_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      - name: Prepare test environment
        if: ${{ inputs.prepare_command != '' }}
        env:
          CK_COMMAND: ${{ inputs.prepare_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      - name: Run Playwright tests
        env:
          CK_COMMAND: ${{ inputs.test_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      - name: Diagnostics on failure
        if: ${{ failure() && inputs.failure_command != '' }}
        env:
          CK_COMMAND: ${{ inputs.failure_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Clean up test environment
        if: ${{ always() && inputs.cleanup_command != '' }}
        env:
          CK_COMMAND: ${{ inputs.cleanup_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      # Tests that run inside Docker leave root-owned reports and bind-mount
      # directories behind. On a self-hosted runner the next actions/checkout
      # cannot delete those and the whole job fails before it starts — hand
      # the workspace back to the runner user, with the same Docker that
      # created the files (no sudo needed).
      - name: Restore workspace ownership
        if: ${{ always() }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.22 \
            chown -R "$(id -u):$(id -g)" /workspace
