name: Repository Command Check

on:
  workflow_call:
    inputs:
      command:
        description: Repository-owned check command
        required: true
        type: string
      working_directory:
        description: Directory in which to execute the command
        type: string
        default: '.'
      runs_on:
        description: Runner label override
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      # Fork PRs run their own code in these jobs. A public caller resolving
      # runs_on or CK_RUNS_ON to a self-hosted runner stops here, before checkout.
      - name: Refuse a self-hosted runner for a public repository
        if: runner.environment == 'self-hosted' && github.event.repository.visibility == 'public'
        working-directory: .
        run: |
          echo "::error::public repository on a self-hosted runner: set runs_on and CK_RUNS_ON to a GitHub-hosted label" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run repository check
        env:
          CK_COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$CK_COMMAND"
