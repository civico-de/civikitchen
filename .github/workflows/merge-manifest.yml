# Join this run's `<tag>-<sha>-amd64` and `-arm64` candidates under
# `<tag>-<sha>`, the name the smoke, e2e and promote jobs refer to.
# Called only from workflows of this repository.
name: Merge candidate manifest

on:
  workflow_call:
    inputs:
      tags:
        description: >-
          JSON array of tag basenames to merge, one job each — e.g.
          '["drupal10", "drupal11"]', or the standalone_versions output.
        required: true
        type: string
      prefix:
        description: >-
          Prepended to every entry of `tags`. The standalone callers pass
          'standalone-', as their entries are exact CiviCRM versions
          (`6.19.0`) or the names of the git-built tags (`master`, `beta`); the
          others pass whole tag names and leave this empty.
        type: string
        default: ''
      package:
        description: The GHCR package, e.g. civikitchen-cli.
        type: string
        default: civikitchen

# A called workflow does not inherit `env`, so it is derived again.
env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ inputs.package }}

# Default for the job below; it widens it itself to push the manifest.
permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-24.04
    # Capped by the caller, which has to grant packages: write.
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        tag: ${{ fromJSON(inputs.tags) }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Through env: `prefix` is a caller's input and would expand into shell inline.
      - name: Create multi-platform candidate manifest
        env:
          CK_TAG: ${{ inputs.prefix }}${{ matrix.tag }}
        run: |
          IMG="${IMAGE_PREFIX}:${CK_TAG}-${GITHUB_SHA}"
          docker buildx imagetools create -t "$IMG" "$IMG-arm64" "$IMG-amd64"
