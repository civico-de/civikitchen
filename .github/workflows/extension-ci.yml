# The one CI definition every civico extension calls, so the pipeline lives in
# one place instead of drifting between copy-pasted extension workflows:
#
#   jobs:
#     ci:
#       uses: civico-de/civikitchen/.github/workflows/extension-ci.yml@v1
#
# Pin the major (@v1), not @main: workflow, template, ck* tools and images are
# released as one versioned contract (docs/releases.md).
#
# Everything runs inside the extension's own CiviCRM stack — the standalone
# image auto-installs, enables the mounted extension and seeds the civicrm_test
# scratch DB, and cklint / ckconform / phpstan / ckcoverage / cktaint all ship
# in it. The bare-runner exceptions have nothing to
# ask a CiviCRM about: template drift, lockfile vulnerabilities and repository
# secrets.
#
# The opt-in extras, which of them belong in a scheduled second caller, and how
# a repo with private dependencies passes GitHub App credentials: see
# docs/extension-standards.md. The inputs below document themselves.
name: Extension CI

on:
  workflow_call:
    inputs:
      key:
        description: >-
          The extension's directory name under /var/www/html/ext — info.xml
          <file>, which the `key` job reads itself. Passing it is a cross-check
          only: a value that differs from info.xml fails the run.
        type: string
        default: ''
      working_directory:
        description: >-
          The extension's directory inside the repository, for a repository
          that holds several extensions. Everything is resolved against it:
          every job's working directory, compose_file, the cache, artifact and
          scan paths, and the drift check. The default is the repository root,
          the one-extension layout.
        type: string
        default: '.'
      compose_file:
        description: >-
          Compose file that brings up the CiviCRM stack, relative to
          working_directory
        type: string
        default: '.docker/docker-compose.ci.yml'
      check_template:
        description: 'Fail when template-managed files drift from civikitchen (ckinit --check)'
        type: boolean
        default: true
      image:
        description: >-
          Override the compose stack's CiviKitchen image. Empty (the default)
          takes the :standalone-<minor> image of the repo's policy.civicrm,
          else the compose file's own ${CIVIKITCHEN_IMAGE:-...} default. Lets
          a caller float the image without editing the template-managed CI
          compose file — how the canary repo tracks :standalone while the
          fleet is on :v1. Setting both this and policy.civicrm is an error.
        type: string
        default: ''
      matrix_images:
        description: >-
          Compatibility matrix: comma-separated image tags, each listed once.
          Every tag gets a job that boots the stack and runs PHPUnit there,
          plus the lifecycle gate with `lifecycle`, and with matrix_playwright
          a browser leg of its own. Typically oldest claimed minor plus
          newest. Empty adds no jobs. Weekly caller, not the push run.
        type: string
        default: ''
      lifecycle:
        description: >-
          After the suite, exercise the extension lifecycle in the running
          stack: disable → re-enable → uninstall → install. Catches the half
          of the upgrader that inspection and green tests never reach.
        type: boolean
        default: false
      upgrade_from_last_release:
        description: >-
          Install the newest reachable git tag first, then swap the working
          tree to this commit and run the extension DB upgrade — the path
          every existing site takes, which a fresh install never exercises.
          Needs at least one reachable tag and a compose file that already
          existed at that tag; both are checked and reported, not skipped.
        type: boolean
        default: false
      schema_parity:
        description: >-
          Schema-parity job: install the last release and upgrade it to HEAD,
          then install HEAD fresh, and diff the two schemas over the
          extension's OWN tables. Answers what the upgrade job cannot — the
          upgrader ran, but did it ARRIVE where install() does. Two stack boots
          on one runner; scheduled caller, not the push run. Skips itself with
          a log line when the extension declares no tables or nothing has been
          released yet.
        type: boolean
        default: false
      core_upgrade_from:
        description: >-
          Core-upgrade persistence job: install on THIS image, seed, move the
          same DB to the run's normal image, `cv upgrade:db`. Must be the OLDER
          version — the job fails when both resolve to the same core. Optional
          fixtures tests/upgrade/seed.php|assert.php via `cv scr`. Empty skips
          the job. Slowest check: scheduled caller only. See
          docs/extension-standards.md.
        type: string
        default: ''
      npm_ci:
        description: >-
          `npm ci --ignore-scripts` on the runner before the stack boots, so
          the bind-mounted checkout has node_modules/. Needs the committed
          package-lock.json; dependency install scripts stay off on purpose.
        type: boolean
        default: false
      js_tests:
        description: >-
          Run `npm test` (implies npm_ci). Fails when package.json declares no
          test script — an opt-in that silently tests nothing is worse.
        type: boolean
        default: false
      bun:
        description: >-
          Drive all frontend steps with Bun (`bun install --frozen-lockfile`,
          `bun run test` / `test:e2e`) instead of npm — whole pipeline or
          none. Needs a committed bun.lock and a `packageManager` pin
          ("bun@x.y.z") in package.json, which is the Bun the jobs use.
          node_version still applies to the ci job: the installed binaries
          run on Node.
          See docs/extension-standards.md.
        type: boolean
        default: false
      mutation:
        description: >-
          Mutation testing (infection via `ckmutate`) as its own job: does the
          suite ASSERT on what it covers. Slow and its score moves with
          unrelated refactors, so it is a SCHEDULED signal, never a push gate.
          A no-op unless the repo sets policy.mutation.minimum_msi in civikitchen.yaml.
        type: boolean
        default: false
      playwright:
        description: >-
          Browser tests as their own job: stack with demo login, then
          `npm run test:e2e` (`bun run` under `bun`) in the repo's Playwright
          image (`ck playwright`), on `image` (matrix_playwright adds the
          matrix_images). Slow — scheduled caller only.
        type: boolean
        default: false
      matrix_playwright:
        description: >-
          With `playwright`, run the browser suite on every matrix_images
          entry too, each leg on its own stack, side by side — for
          UI that changes between CiviCRM versions. Fails without
          `playwright` or with empty matrix_images.
        type: boolean
        default: false
      extra_phpunit_config:
        description: >-
          Run one additional PHPUnit suite with this repository-relative XML
          configuration after the normal headless coverage suite. Useful for
          database-free or differently bootstrapped tests that still need the
          materialized vendor directory or sibling extension. Empty skips it.
        type: string
        default: ''
      runs_on:
        description: >-
          Runner label for all jobs. Resolution: this input, else the caller's
          CK_RUNS_ON repo/org variable, else 'ubuntu-latest' — one variable
          flips a whole fleet. NEVER attach self-hosted runners to a public
          repo (fork PRs run arbitrary code). The host tools a self-hosted
          runner needs are listed in docs/reusable-workflows.md.
        type: string
        default: ''
      node_version:
        description: >-
          Node version for every frontend step above; the Playwright job runs
          on the Node of its Playwright image. Only read when one of them is
          switched on, and still read under `bun`: Bun replaces the package
          manager, not the Node toolchain the installed binaries run on.
          Tracks the Node the dev images ship (docker/*/Dockerfile).
        type: string
        default: '24'
      composer_install:
        description: >-
          `composer install` on the runner with a read token, for private
          packages. Public ones need no input: every stack boot first installs
          vendor/ as the runner user. The token never enters a container.
        type: boolean
        default: false
      policy_defaults:
        description: >-
          Repo (`owner/repo`) whose root `civikitchen.yaml` holds the organisation's
          default policy — the keys every repo shares (license, copyright,
          vendor, ...). Checked out to .civikitchen-siblings/policy and read
          by ckconform under the repo's own file, which overrides per key. A
          private repo needs the composer_app_* secrets. Empty falls back to
          the CK_POLICY_DEFAULTS organisation variable — set once, no caller
          input in any repo; empty both ways means no defaults.
        type: string
        default: ''
      sibling_repo:
        description: >-
          Comma- or newline-separated extension repos (`owner/repo`, or
          `owner/repo@ref` to pin a tag, branch or full commit — a tag keeps
          old runs reproducible and a sibling's main from reddening every
          consumer), each checked out to .civikitchen-siblings/ and mounted
          read-only beside this one under the key from ITS info.xml — for
          extensions implementing a sibling's interfaces. Enabled LEFT TO
          RIGHT in list order before this extension, so a sibling another
          sibling requires comes first. A sibling whose composer.lock carries
          runtime packages gets `composer install --no-dev` first, and one
          declaring policy.dist.build its build (on node_version); a private
          sibling or package needs the composer_app_* secrets. Empty mounts nothing.
        type: string
        default: ''
      composer_app_repositories:
        description: >-
          Comma- or newline-separated repository names within the caller's
          owner that the GitHub App token may read. Required whenever the app
          secrets are supplied for private Composer packages or a private
          sibling; list only the repositories actually needed by this run.
        type: string
        default: ''

    secrets:
      composer_app_id:
        description: >-
          App ID of a GitHub App with `contents: read`, installed on the
          private dependency repos (composer packages, sibling). Optional —
          without it composer resolves what is public and the sibling checkout
          uses the caller-scoped token (404 for private).
        required: false
      composer_app_private_key:
        description: >-
          Private key (PEM) of that app. Used once on the runner to mint a
          short-lived installation token; never enters a container.
        required: false

permissions:
  contents: read

jobs:
  # The extension's directory name — info.xml <file>, the same value ckinit
  # stamps into the compose mount and CIVIKITCHEN_ENABLE_EXTENSIONS. Read once
  # here so the caller has nothing to restate; every stack job consumes the
  # output. Parsed as XML by the toolbelt's ck_xml_field reader, not with a
  # tag-shaped regex.
  key:
    # Cancelled only by this job in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-key
      cancel-in-progress: true
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    # No defaults.run.working-directory here, unlike every other job: a
    # working_directory that does not exist has to produce the message below
    # rather than a runner error about a missing directory.
    outputs:
      key: ${{ steps.key.outputs.key }}
      key_slug: ${{ steps.key.outputs.key_slug }}
      ext_path: ${{ steps.key.outputs.ext_path }}
      tool_path: ${{ steps.key.outputs.tool_path }}
      repo_path: ${{ steps.key.outputs.repo_path }}
      dist_build_tool: ${{ steps.dist-build.outputs.tool }}
      image: ${{ steps.image.outputs.image }}
    env:
      CK_EXT_KEY_INPUT: ${{ inputs.key }}
      CK_WORKING_DIRECTORY: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolbelt reads info.xml and civikitchen.yaml for the steps below.
      - name: Check out civikitchen for the info.xml and policy readers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            toolbelt
            packages
            .github/scripts
          path: .civikitchen-ci

      - name: Validate working_directory and read the extension key from info.xml
        id: key
        run: |
          set -euo pipefail
          wd=$(.civikitchen-ci/.github/scripts/extension-dir.sh "$CK_WORKING_DIRECTORY")
          key=$(php .civikitchen-ci/toolbelt/bin/ck internal xml-field "$wd/info.xml" file)
          [[ "$key" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "info.xml <file> is not a usable extension directory name (got: '$key')" >&2; exit 1; }
          if [ -n "$CK_EXT_KEY_INPUT" ] && [ "$CK_EXT_KEY_INPUT" != "$key" ]; then
            echo "the key input ($CK_EXT_KEY_INPUT) does not match info.xml <file> ($key) — drop the input or fix info.xml" >&2
            exit 1
          fi
          # The two container paths every stack job works from, derived once.
          # ext/<file> is what provisioning enabled and what <requires> was
          # resolved against, so everything that boots CiviCRM runs there. The
          # git-reading tools need the checkout, which for an extension below
          # the root is the second mount, /civikitchen-repo — the same host
          # directory, so their writes land in the right place.
          ext_path="/var/www/html/ext/$key"
          if [ "$wd" = . ]; then
            repo_path="$ext_path"
            tool_path="$ext_path"
          else
            repo_path=/civikitchen-repo
            tool_path="$repo_path/$wd"
          fi
          echo "extension key: $key (working directory: $wd, git tools run in $tool_path)"
          {
            echo "key=$key"
            # Compose rejects an explicit project name holding uppercase, which
            # an extension key may carry; the key itself stays as it is.
            echo "key_slug=${key,,}"
            echo "ext_path=$ext_path"
            echo "tool_path=$tool_path"
            echo "repo_path=$repo_path"
            echo "wd=$wd"
          } >> "$GITHUB_OUTPUT"

      # policy.dist.build: output the repo builds instead of committing. Every job
      # that runs the extension's tests or pages builds it the way the release does.
      - name: Read the declared release build
        id: dist-build
        env:
          CK_WD: ${{ steps.key.outputs.wd }}
          CK_USE_BUN: ${{ inputs.bun }}
        run: |
          set -euo pipefail
          if [ ! -f "$CK_WD/civikitchen.yaml" ]; then
            echo "tool=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          composer install --no-dev --no-interaction --no-progress --classmap-authoritative \
            --working-dir=.civikitchen-ci
          ckconform="$GITHUB_WORKSPACE/.civikitchen-ci/toolbelt/bin/ckconform"
          # Refuses an unsafe output path, an unpinned Bun or a missing bun.lock up front.
          (cd "$CK_WD" && php "$ckconform" --dist-paths > /dev/null)
          tool=$(cd "$CK_WD" && php "$ckconform" --policy dist_build_tool)
          if [ "$tool" = bun ] && [ "$CK_USE_BUN" != true ]; then
            echo "policy.dist.build builds with Bun, so the frontend steps must too — set the bun input" >&2
            exit 1
          fi
          echo "tool=$tool" >> "$GITHUB_OUTPUT"

      # policy.civicrm names the CiviCRM minor once for every stack job; empty
      # leaves the compose file's own default image in place.
      - name: Resolve the stack image
        id: image
        env:
          CK_WD: ${{ steps.key.outputs.wd }}
          CK_IMAGE_INPUT: ${{ inputs.image }}
        run: |
          set -euo pipefail
          minor=
          if [ -f "$CK_WD/civikitchen.yaml" ]; then
            minor=$(cd "$CK_WD" && php "$GITHUB_WORKSPACE/.civikitchen-ci/toolbelt/bin/ckconform" --policy civicrm)
          fi
          image=$(.civikitchen-ci/.github/scripts/stack-image.sh "$minor" "$CK_IMAGE_INPUT" '')
          echo "stack image: ${image:-default of the compose file}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # Template drift: the tooling files civikitchen owns (CI caller, test
  # bootstraps, CI compose stack) must match the template, or
  # eleven repos quietly diverge again — the exact state the shared workflow
  # exists to end. Deliberate deviations are declared in the repo's civikitchen.yaml
  # (template_custom=<file> -- <reason>); the fix for everything else is one
  # `scaffold/ckinit.php --update` away.
  template:
    # Cancelled only by this job in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-template
      cancel-in-progress: true
    if: ${{ inputs.check_template }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the SHA this very workflow was resolved from, so the template
      # under comparison is the one belonging to the pipeline that is running —
      # an unpinned second checkout could race a push to main in between.
      # job.workflow_sha (not github.workflow_sha, which is the CALLER's file)
      # is the official way for a reusable workflow to reach its own repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          path: .civikitchen-ci
      # ckinit stamps renovate.json from the organisation's renovate_preset,
      # so the check needs the same defaults file the ci job's ckconform sees
      # — otherwise a correctly generated file reads as drift.
      - name: Decide whether the policy checkout needs a token
        id: need-token
        if: ${{ (inputs.policy_defaults || vars.CK_POLICY_DEFAULTS) != '' }}
        env:
          CK_COMPOSER_APP_ID: ${{ secrets.composer_app_id }}
          CK_COMPOSER_APP_PRIVATE_KEY: ${{ secrets.composer_app_private_key }}
          CK_POLICY_DEFAULTS: ${{ inputs.policy_defaults || vars.CK_POLICY_DEFAULTS }}
        run: |
          set -euo pipefail
          if [ -n "${CK_COMPOSER_APP_ID:-}" ] && [ -n "${CK_COMPOSER_APP_PRIVATE_KEY:-}" ]; then
            {
              echo "app=true"
              echo "owner=${CK_POLICY_DEFAULTS%%/*}"
              echo "repository=${CK_POLICY_DEFAULTS#*/}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint a read token for the policy repo
        id: app
        if: ${{ steps.need-token.outputs.app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.composer_app_id }}
          private-key: ${{ secrets.composer_app_private_key }}
          owner: ${{ steps.need-token.outputs.owner }}
          repositories: ${{ steps.need-token.outputs.repository }}
          permission-contents: read
      - name: Check out the organisation policy defaults
        if: ${{ (inputs.policy_defaults || vars.CK_POLICY_DEFAULTS) != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.policy_defaults || vars.CK_POLICY_DEFAULTS }}
          token: ${{ steps.app.outputs.token || github.token }}
          path: .civikitchen-siblings/policy
      # The helper checkouts live at the workspace root, not in the extension
      # directory, so they are addressed absolutely.
      - name: Check template drift (ckinit --check)
        env:
          CK_POLICY_DEFAULTS: ${{ inputs.policy_defaults || vars.CK_POLICY_DEFAULTS }}
          CK_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          composer install --no-dev --no-interaction --no-progress --classmap-authoritative \
            --working-dir="$GITHUB_WORKSPACE/.civikitchen-ci"
          if [ -n "$CK_POLICY_DEFAULTS" ]; then
            export CK_DEFAULT_CONFIG="$GITHUB_WORKSPACE/.civikitchen-siblings/policy/civikitchen.yaml"
          fi
          php "$GITHUB_WORKSPACE/.civikitchen-ci/scaffold/ckinit.php" --check .
          # The root-managed files (the caller workflow, renovate.json) belong to
          # the repository, and ckinit manages a root whose DIRECT subdirectories
          # are the extensions. Every extension's job checks them: the check is
          # cheap and idempotent, and callers are independent jobs with no first
          # one to single out.
          wd=${CK_WORKING_DIRECTORY#./}
          wd=${wd%/}
          case "${wd:-.}" in
            .|*/*) ;;
            *) php "$GITHUB_WORKSPACE/.civikitchen-ci/scaffold/ckinit.php" --check "$GITHUB_WORKSPACE" ;;
          esac

  # Known vulnerabilities in the dependencies the repo actually ships. Read from
  # the committed lockfiles, not from the ranges in composer.json/package.json:
  # a range says what *could* be installed, the lock says what CI resolved and
  # what every install got — and the lockfile rule in
  # docs/extension-standards.md is what makes that file exist to be scanned.
  #
  # Its own job, and one that boots no CiviCRM stack: it has nothing to do with
  # the extension's code, so it should not queue behind a container, and a fresh
  # advisory must not hide a red PHPUnit. Same reasoning as the independent
  # gates inside `ci`.
  #
  # Deliberately not an opt-in input. An advisory published overnight can turn
  # the whole fleet red without a single commit, which is uncomfortable and also
  # the entire point; the escape hatch is per finding (osv-scanner.toml, see the
  # scan step), not per repo — a switch that turns the gate off is one nobody
  # ever turns back on.
  osv:
    # Cancelled only by this job in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-osv
      cancel-in-progress: true
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned version AND pinned checksum. Pinning the version alone still
      # trusts whatever that release tag serves on the day the job runs, and
      # this step executes on every push in eleven repos. The hashes are the
      # release's own osv-scanner_SHA256SUMS entries; a version bump moves both.
      #
      # Both Linux architectures, because runs_on can point at a self-hosted
      # arm64 host. Anything else is named and fails rather than quietly
      # scanning nothing.
      - name: Install osv-scanner
        env:
          CK_OSV_VERSION: v2.4.0
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64)
              asset=osv-scanner_linux_amd64
              sha=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
              ;;
            Linux/aarch64)
              asset=osv-scanner_linux_arm64
              sha=44e580752910f0ff36ec99aff59af20f65df1e859aa31e5605a8f0d055b496e9
              ;;
            *)
              echo "no pinned osv-scanner build for $(uname -s)/$(uname -m) — this job needs a Linux runner" >&2
              exit 1
              ;;
          esac
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$CK_OSV_VERSION/$asset"
          echo "$sha  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      # Named lockfiles in the extension directory, one -L each, instead of letting
      # the scanner walk the tree: a directory scan also finds the lockfiles
      # inside vendor/ and node_modules/ once a previous step has materialized
      # them, and a dependency's own lockfile is not what this repo ships.
      #
      # A repo with none of the three is a normal, common state (a PHP-only
      # extension with no real composer dependencies), so it passes — but it
      # says so in one line. `osv-scanner scan source` on a tree with no
      # package source exits 128 unless told otherwise, which is why the empty
      # case is answered here rather than by --allow-no-lockfiles: a step that
      # prints what it did NOT scan is the difference between an honest pass
      # and a green tick over nothing.
      #
      # Exceptions live in an osv-scanner.toml beside those lockfiles, which the
      # scanner picks up on its own because it sits beside the lockfiles — no
      # flag, no input here. It excuses a single advisory
      # ([[IgnoredVulns]] with id/reason and an ignoreUntil date that makes the
      # excuse expire) or a whole package ([[PackageOverrides]]), prints the
      # reason on every run, and reports ignores that no longer match anything.
      # docs/extension-standards.md has the shape.
      - name: Scan lockfiles for known vulnerabilities (osv-scanner)
        run: |
          set -euo pipefail
          args=()
          for lock in composer.lock package-lock.json bun.lock; do
            if [ -f "$lock" ]; then
              echo "scanning $lock"
              args+=(-L "$lock")
            fi
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "no composer.lock, package-lock.json or bun.lock in the extension directory — no dependencies to scan"
            exit 0
          fi
          # 128 is osv-scanner's "no packages found" — a lockfile that locks
          # nothing (extension with no runtime deps) is a pass, not a failure.
          rc=0
          "$RUNNER_TEMP/osv-scanner" scan source "${args[@]}" || rc=$?
          if [ "$rc" -eq 128 ]; then
            echo "osv-scanner found no packages in the scanned lockfiles — nothing to check"
            exit 0
          fi
          exit "$rc"

  # Credentials accidentally committed to an extension are independent of its
  # dependency CVEs and runtime behavior, so scan them in their own bare-runner
  # job. This is deliberately not optional: a repo-wide off switch would become
  # permanent, while a false positive can be scoped to its rule and path in an
  # expiring .trivyignore.yaml entry.
  security:
    # Cancelled only by this job in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-security
      cancel-in-progress: true
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the installer belonging to this resolved reusable workflow, not a
      # floating main checkout. The helper checkout itself is excluded from the
      # scan below: callers are responsible for their tree, CiviKitchen scans
      # its own source in its own pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          path: .civikitchen-ci
      - name: Install trivy
        run: '"$GITHUB_WORKSPACE/.civikitchen-ci/.github/scripts/install-trivy.sh"'

      # Scan repository-owned source, including tests and fixtures. Materialized
      # dependency trees and CiviKitchen's helper checkout are separate trust
      # boundaries and notorious for upstream fake-key fixtures, so exclude them
      # by role rather than teaching every extension to ignore their contents.
      - name: Scan repository source for secrets (trivy)
        run: |
          set -euo pipefail
          ignore_args=()
          if [ -f .trivyignore.yaml ]; then
            ignore_args+=(--ignorefile .trivyignore.yaml)
          fi
          "$RUNNER_TEMP/trivy" fs \
            --scanners secret \
            --exit-code 1 \
            --no-progress \
            --skip-version-check \
            --skip-dirs .git \
            --skip-dirs .civikitchen-ci \
            --skip-dirs .civikitchen-siblings \
            --skip-dirs '**/vendor' \
            --skip-dirs '**/node_modules' \
            "${ignore_args[@]}" \
            .

  ci:
    # Cancelled only by this job in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-ci
      cancel-in-progress: true
    needs: key
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    # Inputs enter shell commands through the environment, never by expression
    # interpolation inside `run:` — an interpolated input IS the script text.
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ needs.key.outputs.key }}
      # Where CiviCRM has the extension enabled, and where the git-reading
      # tools see the same directory inside the checkout — derived by `key`.
      CK_EXT_PATH: ${{ needs.key.outputs.ext_path }}
      CK_TOOL_PATH: ${{ needs.key.outputs.tool_path }}
      CK_REPO_PATH: ${{ needs.key.outputs.repo_path }}
      # Read by the compose file's ${CIVIKITCHEN_IMAGE:-<default>}; `:-` treats
      # empty as unset, so with neither `image` nor policy.civicrm nothing changes.
      CIVIKITCHEN_IMAGE: ${{ needs.key.outputs.image }}
      # One compose project PER JOB. The extension's compose file names its
      # project after the extension, so two jobs of the same run booting the
      # same stack share it — and the second one's `down -v --remove-orphans`
      # SIGKILLs the first one's containers (exit 137). Invisible on
      # ubuntu-latest, where every job gets its own VM; a self-hosted runner
      # with several job slots on one host hits it. The env var outranks the
      # file's `name:`, so consuming repos need no change.
      COMPOSE_PROJECT_NAME: ck-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.key.outputs.key_slug }}-ci
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ckconform's release checks compare HEAD with the newest reachable
          # release tag and must distinguish an empty history from no release.
          fetch-depth: 0
          fetch-tags: true

      - name: Validate inputs
        env:
          CK_SIBLING_REPO: ${{ inputs.sibling_repo }}
          CK_POLICY_DEFAULTS: ${{ inputs.policy_defaults || vars.CK_POLICY_DEFAULTS }}
          CK_EXTRA_PHPUNIT_CONFIG: ${{ inputs.extra_phpunit_config }}
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }
          # Empty is the default and means "no sibling"; every entry of the
          # list has to be owner/repo, optionally @ref — it becomes a clone
          # target and a path. Same expression as the private-deps action's
          # checkout-siblings.sh, which is where the value becomes a command.
          for repo in ${CK_SIBLING_REPO//,/ }; do
            [[ "$repo" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*(@[A-Za-z0-9][A-Za-z0-9._/-]*)?$ ]] \
              || { echo "invalid sibling_repo entry (expected owner/repo or owner/repo@ref): $repo" >&2; exit 1; }
          done
          [[ -z "$CK_POLICY_DEFAULTS" || "$CK_POLICY_DEFAULTS" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || { echo "invalid policy_defaults (expected owner/repo): $CK_POLICY_DEFAULTS" >&2; exit 1; }
          [[ -z "$CK_EXTRA_PHPUNIT_CONFIG" || \
             ( "$CK_EXTRA_PHPUNIT_CONFIG" =~ ^[A-Za-z0-9_./-]+$ &&
               "$CK_EXTRA_PHPUNIT_CONFIG" != /* &&
               "$CK_EXTRA_PHPUNIT_CONFIG" != *../* &&
               "$CK_EXTRA_PHPUNIT_CONFIG" != ../* ) ]] \
            || { echo "invalid extra_phpunit_config: $CK_EXTRA_PHPUNIT_CONFIG" >&2; exit 1; }

      # --- Frontend steps (opt-in via npm_ci / js_tests / bun) --------------
      #
      # js_tests implies npm_ci, and bun implies the install too: `npm test`
      # without an install is a red run about nothing, and a package manager
      # that installs nothing is not a choice worth making. Any of the three
      # switches these steps on. They sit BEFORE the stack boot on purpose:
      #   * the container reads node_modules/ through the bind mount, and the
      #     entrypoint enables the extension while booting — an asset bundle
      #     read during install has to find its files already there;
      #   * unit tests need no CiviCRM, so a red JS suite should cost a
      #     30-second install, not a stack boot first.
      #
      # Node is set up on BOTH paths. Bun replaces npm, not node: `bun run`
      # starts the repo's scripts, and what those scripts call — tsc, vitest,
      # playwright out of node_modules/.bin — is a `#!/usr/bin/env node`
      # shebang away from needing a Node on PATH.
      - name: Set up Node
        if: ${{ inputs.npm_ci || inputs.js_tests || inputs.bun }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          # The npm cache keys on package-lock.json and setup-node FAILS the
          # step when it finds none — which is exactly the Bun repo, where the
          # committed lockfile is bun.lock. Written `!x && 'npm' || ''` and not
          # the usual way round because a ternary whose first branch is the
          # empty string collapses into its second.
          cache: ${{ !inputs.bun && 'npm' || '' }}
          # setup-node runs at the workspace root, so the lockfiles it keys on
          # are named relative to that — the three names it searches itself.
          cache-dependency-path: |
            ${{ inputs.working_directory }}/package-lock.json
            ${{ inputs.working_directory }}/npm-shrinkwrap.json
            ${{ inputs.working_directory }}/yarn.lock

      - name: Set up Bun
        if: ${{ inputs.bun }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The repo pins its Bun in package.json ("packageManager": "bun@x.y.z"),
          # next to its lockfile; an unpinned setup would test whatever Bun
          # shipped this week.
          bun-version-file: ${{ inputs.working_directory }}/package.json

      # --ignore-scripts is deliberate and not configurable — see the input
      # description. A package that genuinely needs a build step should run it
      # as an explicit script from its `test`/`test:e2e` script, where it is
      # visible, rather than through an install hook.
      #
      # One step for both managers: what decides whether the tree is installed
      # at all is the same either way, and a second step is a second place for
      # that condition to drift.
      - name: Materialize JS dependencies (npm ci / bun install)
        if: ${{ inputs.npm_ci || inputs.js_tests || inputs.bun }}
        env:
          CK_USE_BUN: ${{ inputs.bun }}
        run: |
          set -euo pipefail
          if [ "$CK_USE_BUN" = true ]; then
            # No --ignore-scripts counterpart to add: Bun runs no dependency
            # lifecycle script at all unless it is a trustedDependency.
            bun install --frozen-lockfile
          else
            npm ci --ignore-scripts
          fi

      - name: JS unit tests (npm test / bun run test)
        if: ${{ inputs.js_tests }}
        env:
          CK_USE_BUN: ${{ inputs.bun }}
        run: |
          set -euo pipefail
          jq -e '.scripts.test // empty' package.json > /dev/null \
            || { echo "js_tests is on but package.json declares no \"test\" script — add one or turn the input off" >&2; exit 1; }
          if [ "$CK_USE_BUN" = true ]; then
            bun run test
          else
            npm test
          fi

      # Tests and pages load it, and git does not carry it. The key job made
      # sure Bun drives this job, so the install above has run.
      - name: Build the declared release output (bun run build)
        if: ${{ needs.key.outputs.dist_build_tool == 'bun' }}
        run: bun run build

      # --- Private dependencies (opt-in via composer_install / sibling_repo) --
      #
      # Both live BEFORE the stack boot for the same reason the frontend steps
      # do: the container sees the checkout through the bind mount, and the
      # entrypoint enables the extension *while booting*. Whatever enabling the
      # extension needs — its autoloader, a sibling it declares a requirement
      # on — has to be in the tree by then, not a step later.
      #
      # The private-dependency steps are shared with every other stack-booting
      # job, so they live in this repository as a composite action — and a
      # reusable workflow reaches its own repository only by checking it out at
      # the SHA it was resolved from. `uses: ./…` alone would resolve against
      # the CALLING repository. Under .civikitchen-siblings/, the one directory
      # the extension scanner skips and cklint ignores.
      - name: Check out civikitchen for the shared private-dependency steps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' || (inputs.policy_defaults || vars.CK_POLICY_DEFAULTS) != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          # toolbelt/ and packages/ hold the reader of the siblings' policy.dist.build.
          sparse-checkout: |
            .github/actions
            toolbelt/bin
            toolbelt/lib
            toolbelt/ckconform/bin
            toolbelt/ckconform/src
            packages
          path: .civikitchen-siblings/ci

      - name: Private dependencies
        id: deps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' || (inputs.policy_defaults || vars.CK_POLICY_DEFAULTS) != '' }}
        uses: ./.civikitchen-siblings/ci/.github/actions/private-deps
        with:
          node_version: ${{ inputs.node_version }}
          sibling_repo: ${{ inputs.sibling_repo }}
          composer_install: ${{ inputs.composer_install }}
          policy_defaults: ${{ inputs.policy_defaults || vars.CK_POLICY_DEFAULTS }}
          composer_app_repositories: ${{ inputs.composer_app_repositories }}
          app_id: ${{ secrets.composer_app_id }}
          app_private_key: ${{ secrets.composer_app_private_key }}
          ext_key: ${{ needs.key.outputs.key }}
          working_directory: ${{ inputs.working_directory }}

      # Seed snapshots (docs/seed-snapshots.md): a profile with a `snapshot`
      # block generates its data on the first run and restores it from this
      # cache on later ones. No `snapshot` block, nothing stored: a no-op.
      - name: Restore seed snapshots
        id: seed-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ck-seed-store
          key: ck-seed-ci-${{ inputs.working_directory }}-${{ needs.key.outputs.image }}-${{ github.run_id }}
          restore-keys: ck-seed-ci-${{ inputs.working_directory }}-${{ needs.key.outputs.image }}-

      - name: Start CiviCRM stack
        id: stack
        env:
          CK_SIBLING_OVERRIDE: ${{ steps.deps.outputs.sibling_override }}
        run: |
          set -euo pipefail
          # Unchanged command when no sibling was checked out — the override
          # output is empty then. It is needed for `up` alone: every later
          # `docker compose exec` finds the stack through the project name in
          # the base file, same as in the Playwright job.
          compose=(-f "$CK_COMPOSE_FILE")
          if [ -n "${CK_SIBLING_OVERRIDE:-}" ]; then
            compose+=(-f "$CK_SIBLING_OVERRIDE")
          fi
          # The snapshot store, writable by the image's web user.
          mkdir -p "$RUNNER_TEMP/ck-seed-store"
          chmod 0777 "$RUNNER_TEMP/ck-seed-store"
          seed_override="$RUNNER_TEMP/ck-seed-override.yml"
          printf 'services:\n  app:\n    volumes:\n      - %s:/var/lib/civikitchen/snapshots\n' "$RUNNER_TEMP/ck-seed-store" > "$seed_override"
          compose+=(-f "$seed_override")
          # Self-hosted runners keep the previous run's stack; without -v the
          # anonymous mariadb volume reattaches and the entrypoint skips install.
          docker compose "${compose[@]}" down -v --remove-orphans
          # vendor/ as the runner user, who owns the checkout; written by the stack
          # it would belong to the image's web user.
          docker compose "${compose[@]}" run --rm --no-deps -T -u "$(id -u):$(id -g)" -e HOME=/tmp \
            --entrypoint sh app -c 'exec ck internal composer-install /var/www/html/ext/*/'
          docker compose "${compose[@]}" up -d --wait --quiet-pull

      # Only a boot that generated a snapshot stores one: a restored set adds
      # nothing, and an expired one is replaced under the same key.
      - name: Name the seed snapshot
        id: seed-key
        run: |
          set -euo pipefail
          app=(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app)
          key=""
          if "${app[@]}" ck seed --help >/dev/null 2>&1; then
            key=$("${app[@]}" ck seed status --generated)
            if [ -n "$key" ]; then "${app[@]}" ck seed prune; fi
          else
            echo "::notice::The stack's image predates seed snapshots; nothing to store."
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Save seed snapshots
        if: ${{ steps.seed-key.outputs.key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ck-seed-store
          key: ck-seed-ci-${{ inputs.working_directory }}-${{ needs.key.outputs.image }}-${{ steps.seed-key.outputs.key }}-${{ github.run_id }}

      # Every in-container gate via ck ci, the gate list developers run locally.
      # It writes its summary table in the container; the step appends it here.
      - name: Extension gates (ck ci)
        id: gates
        env:
          CK_POLICY_DEFAULTS: ${{ inputs.policy_defaults || vars.CK_POLICY_DEFAULTS }}
          CK_EXTRA_PHPUNIT_CONFIG: ${{ inputs.extra_phpunit_config }}
        run: |
          compose=(docker compose -f "$CK_COMPOSE_FILE" exec -T)
          if ! "${compose[@]}" -u www-data app ck ci --help >/dev/null; then
            echo "::error::The stack's image predates \`ck ci\` — move it to a current civikitchen image."
            exit 1
          fi
          # The defaults file is read from inside the container, where the
          # checkout above sits below the extension's mount. Empty = no layer.
          defaults=""
          if [ -n "$CK_POLICY_DEFAULTS" ]; then
            defaults="$CK_REPO_PATH/.civikitchen-siblings/policy/civikitchen.yaml"
          fi
          summary=/tmp/ck-ci-summary.md
          rc=0
          "${compose[@]}" -u www-data \
            -e GITHUB_ACTIONS=true -e "GITHUB_STEP_SUMMARY=$summary" \
            -e "CK_EXT_PATH=$CK_EXT_PATH" -e "CK_TOOL_PATH=$CK_TOOL_PATH" \
            -e "CK_EXTRA_PHPUNIT_CONFIG=$CK_EXTRA_PHPUNIT_CONFIG" -e "CK_DEFAULT_CONFIG=$defaults" \
            app ck ci || rc=$?
          # ck ci stopped before its table (usage error, crash) leaves no file.
          "${compose[@]}" app cat "$summary" >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::ck ci wrote no summary table"
          exit "$rc"
      # Every gate above is one local command away, and most findings one more.
      - name: How to fix findings locally
        if: ${{ failure() && steps.gates.outcome == 'failure' }}
        run: |
          tool=""
          if [ "$CK_TOOL_PATH" != "$CK_EXT_PATH" ]; then
            tool=" -e CK_TOOL_PATH=$CK_TOOL_PATH"
          fi
          echo "::notice::docker compose -f .docker/docker-compose.yml exec -u www-data -w $CK_EXT_PATH$tool app ck ci runs these same gates in the dev stack; cklint --fix and ckfmt auto-fix most lint and formatting findings; ckcivix --update brings the civix scaffold forward."

      # Same lifecycle block as the compat job below. The substance lives in
      # `cklifecycle` in the image, which is why this is two lines instead of
      # twenty: the sequence is only the setup, and the checks it exists for
      # (post-uninstall DB invariants, and a log scan so a swallowed SQL error
      # cannot stay green) need a booted site anyway.
      - name: Lifecycle smoke + gate (cklifecycle)
        id: lifecycle
        if: ${{ inputs.lifecycle }}
        run: |
          set -o pipefail
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd \"$CK_EXT_PATH\" && cklifecycle" 2>&1 | tee "$RUNNER_TEMP/cklifecycle.md"

      # The report is the point of the step, so it is published whether the
      # gate passed or failed — a leftover table named in a job summary gets
      # fixed, one buried 300 lines into a red step log does not.
      - name: Lifecycle summary
        if: ${{ !cancelled() && steps.lifecycle.outcome != 'skipped' }}
        run: |
          sed -n '/^### Lifecycle gate/,$p' "$RUNNER_TEMP/cklifecycle.md" >> "$GITHUB_STEP_SUMMARY" || true

      # A failed stack is a stack trace of nothing without its logs.
      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -f "$CK_COMPOSE_FILE" ps -a
          docker compose -f "$CK_COMPOSE_FILE" logs --tail 200
          # A failing healthcheck's own output shows in no log.
          docker compose -f "$CK_COMPOSE_FILE" ps -aq | xargs -r docker inspect --format '{{.Name}}: {{json .State.Health}}'

      # Job-scoped project names mean no later run's `down -v` ever finds this
      # stack; leaked networks exhaust Docker's address pools on self-hosted runners.
      - name: Tear down the stack
        if: always()
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f -v
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker network rm
          docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker volume rm

  # --- Upgrade from the last release (opt-in via upgrade_from_last_release) --
  #
  # A fresh install runs install(); an existing site runs upgrade_NNNN(). CI
  # has always tested the first and never the second, so an upgrader step that
  # references a column its own install() already creates looks fine forever.
  #
  # The trick that keeps this cheap: the stack bind-mounts the checkout, so
  # "install the old version" is a `git checkout` before `docker compose up`,
  # and "move to HEAD" is a second `git checkout` afterwards. No second stack,
  # no image build, no artifact shuffling.
  upgrade:
    # Cancelled only by this job in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-upgrade
      cancel-in-progress: true
    needs: key
    if: ${{ inputs.upgrade_from_last_release }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ needs.key.outputs.key }}
      # Where CiviCRM has the extension enabled — derived by `key`.
      CK_EXT_PATH: ${{ needs.key.outputs.ext_path }}
      CIVIKITCHEN_IMAGE: ${{ needs.key.outputs.image }}
      # One compose project per job — see the note in `ci`.
      COMPOSE_PROJECT_NAME: ck-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.key.outputs.key_slug }}-upgrade
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      # Full history: the previous release tag has to be checkoutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }

      # Private dependencies — see the note on the same pair of steps in `ci`.
      - name: Check out civikitchen for the shared private-dependency steps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          # toolbelt/ and packages/ hold the reader of the siblings' policy.dist.build.
          sparse-checkout: |
            .github/actions
            toolbelt/bin
            toolbelt/lib
            toolbelt/ckconform/bin
            toolbelt/ckconform/src
            packages
          path: .civikitchen-siblings/ci

      - name: Private dependencies
        id: deps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        uses: ./.civikitchen-siblings/ci/.github/actions/private-deps
        with:
          node_version: ${{ inputs.node_version }}
          sibling_repo: ${{ inputs.sibling_repo }}
          composer_install: ${{ inputs.composer_install }}
          composer_app_repositories: ${{ inputs.composer_app_repositories }}
          app_id: ${{ secrets.composer_app_id }}
          app_private_key: ${{ secrets.composer_app_private_key }}
          ext_key: ${{ needs.key.outputs.key }}
          working_directory: ${{ inputs.working_directory }}

      # Newest tag reachable from this commit — on a PR that is the merge
      # commit, so it is the release the change would be shipped on top of.
      # Both failure modes get named instead of quietly skipping the job: a
      # repo with nothing to upgrade from should turn this input off, not
      # collect green runs that tested nothing.
      - name: Resolve the previous release
        id: prev
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          [ -n "$prev" ] \
            || { echo "no reachable tag: nothing has been released yet, so there is no upgrade path to test" >&2; exit 1; }
          git cat-file -e "$prev:./$CK_COMPOSE_FILE" 2>/dev/null \
            || { echo "$prev predates $CK_COMPOSE_FILE — the release cannot boot its own stack; test the upgrade from the next release on" >&2; exit 1; }
          echo "previous release: $prev"
          {
            echo "prev=$prev"
            # What actions/checkout actually put in the tree (on a PR: the
            # merge commit) — the thing to come back to, resolved before
            # anything moves HEAD.
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the previous release into the mount
        # vendor/ is untracked and belongs to the tree just left; the boot below reinstalls it.
        run: git checkout --force --detach "$PREV" && git clean -ffdxq -- vendor
        env:
          PREV: ${{ steps.prev.outputs.prev }}

      # The github-oauth config the step above wrote is global to the runner, so
      # no second token is minted here. Same after the move back to HEAD.
      - name: Composer install for the previous release
        if: ${{ inputs.composer_install }}
        run: composer install --no-interaction --no-progress

      # Boots and installs the OLD version — including its own CI compose file
      # and therefore the image that release was tested with, unless the
      # caller pins `image` or policy.civicrm.
      - name: Start CiviCRM stack on the previous release
        env:
          CK_SIBLING_OVERRIDE: ${{ steps.deps.outputs.sibling_override }}
        run: |
          set -euo pipefail
          # The sibling override is empty without siblings, and is needed for
          # `up` alone — every later `docker compose exec` finds the stack
          # through the project name in the base file.
          compose=(-f "$CK_COMPOSE_FILE")
          if [ -n "${CK_SIBLING_OVERRIDE:-}" ]; then
            compose+=(-f "$CK_SIBLING_OVERRIDE")
          fi
          docker compose "${compose[@]}" down -v --remove-orphans
          # vendor/ as the runner user, who owns the checkout; written by the stack
          # it would belong to the image's web user.
          docker compose "${compose[@]}" run --rm --no-deps -T -u "$(id -u):$(id -g)" -e HOME=/tmp \
            --entrypoint sh app -c 'exec ck internal composer-install /var/www/html/ext/*/'
          docker compose "${compose[@]}" up -d --wait --quiet-pull

      # The container sees the checkout through the bind mount, so this alone
      # puts the new code in front of the installed old schema.
      - name: Move the mount to this commit
        # vendor/ is untracked and belongs to the release just left.
        run: git checkout --force --detach "$HEAD_REF" && git clean -ffdxq -- vendor
        env:
          HEAD_REF: ${{ steps.prev.outputs.head }}

      - name: Composer install for this commit
        if: ${{ inputs.composer_install }}
        run: composer install --no-interaction --no-progress

      # No boot follows the move, so public packages go in here, as the runner
      # user; after the private install above this finds vendor/ complete.
      - name: Install vendor/ for this commit
        run: >-
          docker compose -f "$CK_COMPOSE_FILE" run --rm --no-deps -T -u "$(id -u):$(id -g)" -e HOME=/tmp
          --entrypoint sh app -c 'exec ck internal composer-install /var/www/html/ext/*/'

      - name: Upgrade the extension schema
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "set -e
             cd \"$CK_EXT_PATH\"
             cv flush
             cv upgrade:db --mode=ext"
          pending=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd \"$CK_EXT_PATH\" && cv ev 'echo CRM_Extension_Upgrades::hasPending() ? \"pending\" : \"clean\";'" \
            | tr -d '[:space:]')
          [ "$pending" = clean ] \
            || { echo "upgrade: extension upgrades still pending after cv upgrade:db" >&2; exit 1; }
          status=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd \"$CK_EXT_PATH\" && cv ev 'echo CRM_Extension_System::singleton()->getManager()->getStatus(\"$CK_EXT_KEY\");'" \
            | tr -d '[:space:]')
          [ "$status" = installed ] \
            || { echo "upgrade: extension ended up '$status', expected 'installed'" >&2; exit 1; }

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -f "$CK_COMPOSE_FILE" ps -a
          docker compose -f "$CK_COMPOSE_FILE" logs --tail 200
          # A failing healthcheck's own output shows in no log.
          docker compose -f "$CK_COMPOSE_FILE" ps -aq | xargs -r docker inspect --format '{{.Name}}: {{json .State.Health}}'

      # Job-scoped project names mean no later run's `down -v` ever finds this
      # stack; leaked networks exhaust Docker's address pools on self-hosted runners.
      - name: Tear down the stack
        if: always()
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f -v
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker network rm
          docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker volume rm

  # --- Schema parity (opt-in via schema_parity) -----------------------------
  #
  # The question the `upgrade` job leaves open. That one proves the upgrader
  # RUNS and leaves nothing pending. It cannot tell you whether it ARRIVES
  # where install() does — and install() and the upgrade_NNNN() chain are two
  # independent descriptions of the same schema with nothing keeping them in
  # step. NOT NULL in one and nullable in the other, an index the installer
  # creates and the upgrader forgets: every fresh install is fine, every
  # upgraded site is quietly different, and no later upgrader reconciles them.
  #
  # Two databases in one stack, in this order:
  #   B: install the last release, move the mount to HEAD, `cv upgrade:db` —
  #      literally the `upgrade` job, whose result is the upgraded schema;
  #   A: `down -v` and boot again on HEAD — a fresh install of this commit.
  # Then diff A against B over the extension's OWN tables. Core's tables are
  # not this extension's business and would drown the signal.
  #
  # mysqldump + a normalised text diff rather than Atlas — the reasoning is in
  # toolbelt/bin/ckschemadiff, short version: the CI stack publishes no database
  # port, so any tool has to run in the app container, and that container
  # already ships a mysql client.
  #
  # Two boots on one runner, so: scheduled caller, like every other opt-in job
  # here.
  schema-parity:
    # Cancelled only by this job in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-schema-parity
      cancel-in-progress: true
    needs: key
    if: ${{ inputs.schema_parity }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ needs.key.outputs.key }}
      # Where CiviCRM has the extension enabled — derived by `key`.
      CK_EXT_PATH: ${{ needs.key.outputs.ext_path }}
      CIVIKITCHEN_IMAGE: ${{ needs.key.outputs.image }}
      # One compose project per job — see the note in `ci`.
      COMPOSE_PROJECT_NAME: ck-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.key.outputs.key_slug }}-schema-parity
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      # Full history: the previous release tag has to be checkoutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }

      # Private dependencies — see the note on the same pair of steps in `ci`.
      - name: Check out civikitchen for the shared private-dependency steps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          # toolbelt/ and packages/ hold the reader of the siblings' policy.dist.build.
          sparse-checkout: |
            .github/actions
            toolbelt/bin
            toolbelt/lib
            toolbelt/ckconform/bin
            toolbelt/ckconform/src
            packages
          path: .civikitchen-siblings/ci

      - name: Private dependencies
        id: deps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        uses: ./.civikitchen-siblings/ci/.github/actions/private-deps
        with:
          node_version: ${{ inputs.node_version }}
          sibling_repo: ${{ inputs.sibling_repo }}
          composer_install: ${{ inputs.composer_install }}
          composer_app_repositories: ${{ inputs.composer_app_repositories }}
          app_id: ${{ secrets.composer_app_id }}
          app_private_key: ${{ secrets.composer_app_private_key }}
          ext_key: ${{ needs.key.outputs.key }}
          working_directory: ${{ inputs.working_directory }}

      # Two cheap questions before anything boots, because the expensive part of
      # this job is two CiviCRM installs and neither is worth paying for if the
      # answer is already known. Both are SKIPS with a log line, not failures:
      # unlike `upgrade`, where a repo with no tag has switched on a check it
      # cannot satisfy, this job's preconditions are ordinary states for a
      # perfectly healthy extension — plenty of them own no tables at all, and
      # every repo has a first commit before its first release.
      #
      # The table question is answered from the repo's schema DECLARATIONS
      # (schema/*.entityType.php, xml/schema/**), which is also what the diff
      # later scopes itself to. Done in a plain grep here rather than by running
      # ckschemadiff: no container exists yet, and this only has to be right
      # about "any" versus "none".
      - name: Decide whether there is anything to compare
        id: gate
        run: |
          set -euo pipefail
          tables=0
          if compgen -G 'schema/*.entityType.php' > /dev/null \
            || { [ -d xml/schema ] && [ -n "$(find xml/schema -name '*.xml' -print -quit)" ]; }; then
            tables=1
          fi
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "$tables" = 0 ]; then
            echo "schema parity: this extension declares no tables of its own (no schema/*.entityType.php, no xml/schema) — nothing to compare."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$prev" ]; then
            echo "schema parity: no reachable git tag — there is no released schema to upgrade from yet."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$prev:./$CK_COMPOSE_FILE" 2>/dev/null; then
            echo "schema parity: $prev predates $CK_COMPOSE_FILE — that release cannot boot its own stack."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "schema parity: comparing a fresh install of HEAD against $prev upgraded to HEAD."
          {
            echo "run=true"
            echo "prev=$prev"
            # What actions/checkout put in the tree (on a PR: the merge commit),
            # resolved before anything moves HEAD.
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # --- B: the last release, upgraded to HEAD ---------------------------
      - name: Check the previous release into the mount
        if: ${{ steps.gate.outputs.run == 'true' }}
        # vendor/ is untracked and belongs to the tree just left; the boot below reinstalls it.
        run: git checkout --force --detach "$PREV" && git clean -ffdxq -- vendor
        env:
          PREV: ${{ steps.gate.outputs.prev }}

      # No second token, here or after the move back: the github-oauth config
      # the private-dependency steps wrote is global to the runner.
      - name: Composer install for the previous release
        if: ${{ inputs.composer_install && steps.gate.outputs.run == 'true' }}
        run: composer install --no-interaction --no-progress

      - name: Start CiviCRM stack on the previous release
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          CK_SIBLING_OVERRIDE: ${{ steps.deps.outputs.sibling_override }}
        run: |
          set -euo pipefail
          # The sibling override is needed for `up` alone — every later
          # `docker compose exec` finds the stack through the project name.
          compose=(-f "$CK_COMPOSE_FILE")
          if [ -n "${CK_SIBLING_OVERRIDE:-}" ]; then
            compose+=(-f "$CK_SIBLING_OVERRIDE")
          fi
          docker compose "${compose[@]}" down -v --remove-orphans
          # vendor/ as the runner user, who owns the checkout; written by the stack
          # it would belong to the image's web user.
          docker compose "${compose[@]}" run --rm --no-deps -T -u "$(id -u):$(id -g)" -e HOME=/tmp \
            --entrypoint sh app -c 'exec ck internal composer-install /var/www/html/ext/*/'
          docker compose "${compose[@]}" up -d --wait --quiet-pull

      - name: Move the mount to this commit
        if: ${{ steps.gate.outputs.run == 'true' }}
        # vendor/ is untracked and belongs to the release just left.
        run: git checkout --force --detach "$HEAD_REF" && git clean -ffdxq -- vendor
        env:
          HEAD_REF: ${{ steps.gate.outputs.head }}

      - name: Composer install for this commit
        if: ${{ inputs.composer_install && steps.gate.outputs.run == 'true' }}
        run: composer install --no-interaction --no-progress

      # No boot follows the move, so public packages go in here, as the runner
      # user; after the private install above this finds vendor/ complete.
      - name: Install vendor/ for this commit
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: >-
          docker compose -f "$CK_COMPOSE_FILE" run --rm --no-deps -T -u "$(id -u):$(id -g)" -e HOME=/tmp
          --entrypoint sh app -c 'exec ck internal composer-install /var/www/html/ext/*/'

      # `cv flush` first for the same reason the upgrade job does it: the boot
      # cached the OLD release's class and container maps, and the upgrader
      # about to run belongs to the new code.
      #
      # The dump has to leave the container before the next step destroys it,
      # and it leaves via `docker compose cp` rather than by being written into
      # the bind mount: the workspace belongs to the runner user, and this
      # command runs as www-data, which cannot write there.
      - name: Upgrade the extension schema and dump it
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "set -e
             cd \"$CK_EXT_PATH\"
             cv flush
             cv upgrade:db --mode=ext
             ckschemadiff dump \"\${CIVICRM_DB_NAME:-civicrm}\" /tmp/ck-schema-upgraded.sql"
          docker compose -f "$CK_COMPOSE_FILE" cp \
            app:/tmp/ck-schema-upgraded.sql "$RUNNER_TEMP/ck-schema-upgraded.sql"

      # --- A: a fresh install of HEAD --------------------------------------
      #
      # `down -v` and not just `down`: the whole point is a database that has
      # never seen the old release. The CI stack gives mariadb an anonymous
      # volume, and -v is what guarantees it goes rather than being reattached.
      # The working tree is already at HEAD, so the boot installs this commit.
      - name: Reinstall from scratch on this commit
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          CK_SIBLING_OVERRIDE: ${{ steps.deps.outputs.sibling_override }}
        run: |
          set -euo pipefail
          compose=(-f "$CK_COMPOSE_FILE")
          if [ -n "${CK_SIBLING_OVERRIDE:-}" ]; then
            compose+=(-f "$CK_SIBLING_OVERRIDE")
          fi
          docker compose "${compose[@]}" down -v
          # vendor/ as the runner user, who owns the checkout; written by the stack
          # it would belong to the image's web user.
          docker compose "${compose[@]}" run --rm --no-deps -T -u "$(id -u):$(id -g)" -e HOME=/tmp \
            --entrypoint sh app -c 'exec ck internal composer-install /var/www/html/ext/*/'
          docker compose "${compose[@]}" up -d --wait --quiet-pull

      # The upgraded dump goes back INTO the new container rather than the diff
      # being run on the runner: `ckschemadiff diff` is where the explanation of
      # what a difference means lives, and duplicating that text into the
      # workflow is how the two versions of it start disagreeing.
      - name: Dump the freshly installed schema and compare
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          docker compose -f "$CK_COMPOSE_FILE" cp \
            "$RUNNER_TEMP/ck-schema-upgraded.sql" app:/tmp/ck-schema-upgraded.sql
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "set -e
             cd \"$CK_EXT_PATH\"
             ckschemadiff dump \"\${CIVICRM_DB_NAME:-civicrm}\" /tmp/ck-schema-fresh.sql
             ckschemadiff diff /tmp/ck-schema-fresh.sql /tmp/ck-schema-upgraded.sql"

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -f "$CK_COMPOSE_FILE" ps -a
          docker compose -f "$CK_COMPOSE_FILE" logs --tail 200
          # A failing healthcheck's own output shows in no log.
          docker compose -f "$CK_COMPOSE_FILE" ps -aq | xargs -r docker inspect --format '{{.Name}}: {{json .State.Health}}'

      # Job-scoped project names mean no later run's `down -v` ever finds this
      # stack; leaked networks exhaust Docker's address pools on self-hosted runners.
      - name: Tear down the stack
        if: always()
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f -v
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker network rm
          docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker volume rm

  # --- Mutation testing (opt-in via mutation) -------------------------------
  #
  # ckcoverage asks whether a line ran; this asks whether anything would have
  # noticed if the line were WRONG. Infection rewrites the code under the suite
  # and counts the mutants no test killed.
  #
  # Its own job, and off by default, for two reasons: a mutation run is a suite
  # run per mutant batch, and the score drifts with refactors that changed no
  # behaviour. As a push gate that is a slow, flappy build; as a scheduled one
  # it is a weekly reading. Belongs in the compat caller — see
  # docs/extension-standards.md.
  #
  # The floor is the repo's own (civikitchen.yaml: policy.mutation.minimum_msi), so there is
  # nothing to configure here. Without that key ckmutate exits 0 with a line
  # saying so, which is what makes switching the input on safe before the
  # number is known.
  mutation:
    # Cancelled only by this job in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-mutation
      cancel-in-progress: true
    needs: key
    if: ${{ inputs.mutation }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ needs.key.outputs.key }}
      # Where CiviCRM has the extension enabled, and the checkout's root in the
      # container that git has to trust — derived by `key`.
      CK_EXT_PATH: ${{ needs.key.outputs.ext_path }}
      CK_REPO_PATH: ${{ needs.key.outputs.repo_path }}
      CIVIKITCHEN_IMAGE: ${{ needs.key.outputs.image }}
      # One compose project per job — see the note in `ci`.
      COMPOSE_PROJECT_NAME: ck-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.key.outputs.key_slug }}-mutation
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      # Full history: without policy.mutation.paths ckmutate mutates the lines changed
      # against CK_MUTATE_BASE, and a shallow clone has no base to diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }

      # Private dependencies — see the note on the same pair of steps in `ci`.
      - name: Check out civikitchen for the shared steps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' || needs.key.outputs.dist_build_tool != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          # toolbelt/ and packages/ hold the reader of the siblings' policy.dist.build.
          sparse-checkout: |
            .github/actions
            toolbelt/bin
            toolbelt/lib
            toolbelt/ckconform/bin
            toolbelt/ckconform/src
            packages
          path: .civikitchen-siblings/ci

      # The suite loads it. Before any token is minted: the build runs dependency code.
      - name: Build the declared release output
        if: ${{ needs.key.outputs.dist_build_tool == 'bun' }}
        uses: ./.civikitchen-siblings/ci/.github/actions/release-build
        with:
          node_version: ${{ inputs.node_version }}
          working_directory: ${{ inputs.working_directory }}

      - name: Private dependencies
        id: deps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        uses: ./.civikitchen-siblings/ci/.github/actions/private-deps
        with:
          node_version: ${{ inputs.node_version }}
          sibling_repo: ${{ inputs.sibling_repo }}
          composer_install: ${{ inputs.composer_install }}
          composer_app_repositories: ${{ inputs.composer_app_repositories }}
          app_id: ${{ secrets.composer_app_id }}
          app_private_key: ${{ secrets.composer_app_private_key }}
          ext_key: ${{ needs.key.outputs.key }}
          working_directory: ${{ inputs.working_directory }}

      - name: Start CiviCRM stack
        id: stack
        env:
          CK_SIBLING_OVERRIDE: ${{ steps.deps.outputs.sibling_override }}
        run: |
          set -euo pipefail
          compose=(-f "$CK_COMPOSE_FILE")
          if [ -n "${CK_SIBLING_OVERRIDE:-}" ]; then
            compose+=(-f "$CK_SIBLING_OVERRIDE")
          fi
          docker compose "${compose[@]}" down -v --remove-orphans
          # vendor/ as the runner user, who owns the checkout; written by the stack
          # it would belong to the image's web user.
          docker compose "${compose[@]}" run --rm --no-deps -T -u "$(id -u):$(id -g)" -e HOME=/tmp \
            --entrypoint sh app -c 'exec ck internal composer-install /var/www/html/ext/*/'
          docker compose "${compose[@]}" up -d --wait --quiet-pull

      # safe.directory first: the mount belongs to the runner user, and the
      # changed-lines mode (no policy.mutation.paths) shells out to git as www-data.
      # Infection runs the suite, so this stays on the CiviCRM path — where an
      # extension below the repository root has no .git of its own, and the
      # changed-lines mode needs policy.mutation.paths in civikitchen.yaml instead.
      - name: Mutation testing (ckmutate)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "git config --global --add safe.directory $CK_REPO_PATH
             cd \"$CK_EXT_PATH\" && ckmutate"

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -f "$CK_COMPOSE_FILE" ps -a
          docker compose -f "$CK_COMPOSE_FILE" logs --tail 200
          # A failing healthcheck's own output shows in no log.
          docker compose -f "$CK_COMPOSE_FILE" ps -aq | xargs -r docker inspect --format '{{.Name}}: {{json .State.Health}}'

      # Job-scoped project names mean no later run's `down -v` ever finds this
      # stack; leaked networks exhaust Docker's address pools on self-hosted runners.
      - name: Tear down the stack
        if: always()
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f -v
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker network rm
          docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker volume rm

  # --- Core upgrade persistence (opt-in via core_upgrade_from) --------------
  #
  # The job above, one axis over: that one moves the EXTENSION across a fixed
  # core, the compat matrix below moves the CORE but installs from scratch every
  # time. What neither reaches is the state every existing site is in — records
  # and configuration created on core N, and then the core underneath them
  # moves to N+1. That is where a managed entity reconciles differently after a
  # schema change, where a saved search's stored API params stop being valid,
  # where a custom field's column survives a core migration in name only.
  #
  # Same cheapness trick as the extension-upgrade job, one level up: the stack
  # takes its image from ${CIVIKITCHEN_IMAGE:-...}, so "swap the core" is one
  # environment variable and a second `up`. No second stack, no image build.
  #
  # Skipped entirely when the input is empty — the matrix_images deal: a caller
  # that never sets it pays nothing.
  core-upgrade:
    # Cancelled only by this job in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-core-upgrade
      cancel-in-progress: true
    needs: key
    if: ${{ inputs.core_upgrade_from != '' }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ needs.key.outputs.key }}
      # Where CiviCRM has the extension enabled — derived by `key`.
      CK_EXT_PATH: ${{ needs.key.outputs.ext_path }}
      CK_CORE_FROM: ${{ inputs.core_upgrade_from }}
      # The job-level image is the upgrade TARGET: the run's normal image, or
      # empty for the compose file's own default. Only the first boot overrides
      # it — at the step — so everything after the swap already runs against the
      # image this pipeline actually tests on.
      CIVIKITCHEN_IMAGE: ${{ needs.key.outputs.image }}
      # One compose project per job — see the note in `ci`.
      COMPOSE_PROJECT_NAME: ck-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.key.outputs.key_slug }}-core-upgrade
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }
          # Same expression compat-images validates its CSV entries with: a
          # value that is not an image reference at all is a caller mistake
          # worth naming in seconds instead of ten minutes later in a pull error.
          [[ "$CK_CORE_FROM" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*(:[A-Za-z0-9._-]+)?(@sha256:[a-f0-9]{64})?$ ]] \
            || { echo "core_upgrade_from is not an image reference: $CK_CORE_FROM" >&2; exit 1; }

      # Private dependencies — see the note on the same pair of steps in `ci`.
      - name: Check out civikitchen for the shared private-dependency steps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          # toolbelt/ and packages/ hold the reader of the siblings' policy.dist.build.
          sparse-checkout: |
            .github/actions
            toolbelt/bin
            toolbelt/lib
            toolbelt/ckconform/bin
            toolbelt/ckconform/src
            packages
          path: .civikitchen-siblings/ci

      - name: Private dependencies
        id: deps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        uses: ./.civikitchen-siblings/ci/.github/actions/private-deps
        with:
          node_version: ${{ inputs.node_version }}
          sibling_repo: ${{ inputs.sibling_repo }}
          composer_install: ${{ inputs.composer_install }}
          composer_app_repositories: ${{ inputs.composer_app_repositories }}
          app_id: ${{ secrets.composer_app_id }}
          app_private_key: ${{ secrets.composer_app_private_key }}
          ext_key: ${{ needs.key.outputs.key }}
          working_directory: ${{ inputs.working_directory }}

      # The one thing that stops a naive image swap from being an upgrade.
      #
      # The entrypoint decides "is this site installed?" by looking for
      # /var/www/html/private/civicrm.settings.php, and that path lives in the
      # CONTAINER's own filesystem. Recreate the container on another image and
      # the settings file is gone, so with CIVICRM_AUTO_INSTALL=1 the entrypoint
      # runs `cv core:install -K` against a fully populated database instead of
      # upgrading it — a mess, not an upgrade.
      #
      # A named volume on that directory fixes it, and carries more than the
      # settings file: both provisioning markers (.civikitchen-configured,
      # .civikitchen-provisioned) live there too, so the new container also skips
      # the first-boot config and provisioning bundles, which would re-run their
      # cv calls against a database the new core has not upgraded yet.
      #
      # The DATABASE needs a named volume of its own, and that is not optional
      # here: the template CI stack gives mariadb no volume at all, so its data
      # lives in an ANONYMOUS volume tied to the container. `docker compose down`
      # removes the container even without -v, the next `up` creates a fresh one
      # with a fresh anonymous volume — and the "old database" this whole job is
      # about would be an empty one. Naming it states the contract instead: the
      # containers go, the two volumes stay.
      #
      # Written here rather than into the template compose file, which is
      # template-managed (ckinit checks it): no repo should take drift, or a
      # persistent volume, for a job it may never switch on.
      #
      # Both merges only ever ADD, and there are no host paths, so compose
      # resolving relative paths against the first -f file does not matter.
      - name: Compose override — carry the site and the database across the swap
        run: |
          set -euo pipefail
          override="$RUNNER_TEMP/civikitchen-core-upgrade-override.yml"
          cat > "$override" <<'YAML'
          services:
            app:
              volumes:
                - ck-core-upgrade-private:/var/www/html/private
            db:
              volumes:
                - ck-core-upgrade-db:/var/lib/mysql

          volumes:
            ck-core-upgrade-private:
            ck-core-upgrade-db:
          YAML
          echo "CK_UPGRADE_OVERRIDE=$override" >> "$GITHUB_ENV"

      # Booting IS the install on the old core: the entrypoint installs CiviCRM
      # and enables the mounted extension, on the version the site is meant to
      # have been living on.
      - name: Start the CiviCRM stack on the old core
        env:
          CIVIKITCHEN_IMAGE: ${{ inputs.core_upgrade_from }}
          # The old core's image may predate `ck internal composer-install`, and
          # the site ends on the run's image, whose PHP vendor/ has to fit.
          CK_VENDOR_IMAGE: ${{ needs.key.outputs.image }}
          CK_SIBLING_OVERRIDE: ${{ steps.deps.outputs.sibling_override }}
        run: |
          set -euo pipefail
          # The swap override carrying the site and the database, and — when
          # there are siblings — the one that mounts and enables them. Compose
          # merges any number of -f files; the two touch different keys.
          compose=(-f "$CK_COMPOSE_FILE" -f "$CK_UPGRADE_OVERRIDE")
          if [ -n "${CK_SIBLING_OVERRIDE:-}" ]; then
            compose+=(-f "$CK_SIBLING_OVERRIDE")
          fi
          docker compose "${compose[@]}" down -v --remove-orphans
          # vendor/ as the runner user, who owns the checkout; written by the stack
          # it would belong to the image's web user.
          CIVIKITCHEN_IMAGE="$CK_VENDOR_IMAGE" docker compose "${compose[@]}" run --rm --no-deps -T -u "$(id -u):$(id -g)" -e HOME=/tmp \
            --entrypoint sh app -c 'exec ck internal composer-install /var/www/html/ext/*/'
          docker compose "${compose[@]}" up -d --wait --quiet-pull

      # `cv scr`, not a PHPUnit class, and deliberately so: these assertions have
      # to run against the LIVE site database, while the headless harness points
      # CIVICRM_DSN at the isolated civicrm_test scratch DB. A phpunit-based
      # fixture would pass while testing a database the upgrade never touched.
      #
      # Both files are OPTIONAL. Without them this job still answers a real
      # question — does a site installed on the old core boot on the new one and
      # upgrade cleanly with this extension enabled — so refusing to run would
      # cost that answer for every repo that has not written fixtures yet. What
      # it cannot answer without them is what the extension's OWN data does,
      # which is why the skip says so in as many words rather than passing
      # quietly.
      - name: Seed the site on the old core (tests/upgrade/seed.php)
        run: |
          set -euo pipefail
          from_version=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cv ev 'echo CRM_Utils_System::version();'" | tr -d '[:space:]')
          echo "installed on CiviCRM $from_version ($CK_CORE_FROM)"
          # Read back after the upgrade to prove the core actually moved.
          echo "CK_CORE_FROM_VERSION=$from_version" >> "$GITHUB_ENV"
          if [ -f tests/upgrade/seed.php ]; then
            docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
              "set -e
               cd \"$CK_EXT_PATH\"
               cv scr tests/upgrade/seed.php"
          else
            echo "no tests/upgrade/seed.php: this run tests that the site boots on the new core and upgrades cleanly with $CK_EXT_KEY enabled — and nothing about the extension's own records."
            echo "Add tests/upgrade/seed.php + tests/upgrade/assert.php to test what your data does across the upgrade."
          fi

      # `down` without -v: the containers go, the two named volumes stay. That is
      # the deliberate spelling of what a second `up` would do on its own
      # (compose recreates `app` because its image changed) — written out, so the
      # scenario rests on the volumes rather than on compose's recreate
      # heuristics, and the database container genuinely restarts on the data it
      # already had.
      #
      # `--wait` is weaker on this boot than it looks: the image's health probe
      # is the `.civikitchen-provisioned` marker plus an answering Apache, and
      # the volume has just carried that marker across, so the container reports
      # healthy as soon as Apache listens rather than when the entrypoint has
      # finished. It costs nothing here — every step below talks to the stack
      # through `docker compose exec`, and the second boot's entrypoint only
      # skips through its marker-gated bundles.
      - name: Swap the core underneath the site
        env:
          CK_SIBLING_OVERRIDE: ${{ steps.deps.outputs.sibling_override }}
        run: |
          set -euo pipefail
          # The swap override carrying the site and the database, and — when
          # there are siblings — the one that mounts and enables them. Compose
          # merges any number of -f files; the two touch different keys.
          compose=(-f "$CK_COMPOSE_FILE" -f "$CK_UPGRADE_OVERRIDE")
          if [ -n "${CK_SIBLING_OVERRIDE:-}" ]; then
            compose+=(-f "$CK_SIBLING_OVERRIDE")
          fi
          docker compose "${compose[@]}" down
          docker compose "${compose[@]}" up -d --wait --quiet-pull

      # `cv upgrade:db` straight away, with no `cv flush` in front of it: a
      # normal cv bootstrap against a database the code has not upgraded yet is
      # the thing to avoid here, and upgrade:db is the one command written for
      # exactly that state (it boots with CIVICRM_UPGRADE_ACTIVE). It runs core
      # and extension upgrades in one go, which is also what a real site's
      # upgrade does.
      #
      # Then four separate questions, because only asking all of them makes a
      # green run mean anything:
      #   * the database is at the code's version — the upgrade finished rather
      #     than stopping halfway with a zero exit;
      #   * that version is not the one the site was installed on — otherwise
      #     the caller pointed core_upgrade_from at the image the run already
      #     uses, and this job would be a slow way to test nothing;
      #   * no extension upgrade stayed pending — the same check the
      #     extension-upgrade job makes, and a core upgrade is a common way for
      #     one to appear;
      #   * the extension is still installed. Cheap, and it is what carries a
      #     run with no fixtures: a core upgrade that disables the extension
      #     (an unmet requirement on the new version, a failed upgrader) would
      #     otherwise leave every other check here perfectly green.
      - name: Upgrade the site database (cv upgrade:db)
        run: |
          set -euo pipefail
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "set -e
             cd \"$CK_EXT_PATH\"
             cv upgrade:db"
          versions=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cv ev 'echo CRM_Core_BAO_Domain::version(), \"|\", CRM_Utils_System::version();'" \
            | tr -d '[:space:]')
          db_version="${versions%%|*}"
          code_version="${versions##*|}"
          echo "core upgrade: $CK_CORE_FROM_VERSION -> $code_version (database at $db_version)"
          [ "$db_version" = "$code_version" ] \
            || { echo "core upgrade: database stayed at $db_version while the code is $code_version" >&2; exit 1; }
          [ "$code_version" != "$CK_CORE_FROM_VERSION" ] \
            || { echo "core upgrade: core_upgrade_from is CiviCRM $CK_CORE_FROM_VERSION, and so is the image this run tests on — point it at an OLDER minor, or turn the input off" >&2; exit 1; }
          pending=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd \"$CK_EXT_PATH\" && cv ev 'echo CRM_Extension_Upgrades::hasPending() ? \"pending\" : \"clean\";'" \
            | tr -d '[:space:]')
          [ "$pending" = clean ] \
            || { echo "core upgrade: extension upgrades still pending after cv upgrade:db" >&2; exit 1; }
          status=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd \"$CK_EXT_PATH\" && cv ev 'echo CRM_Extension_System::singleton()->getManager()->getStatus(\"$CK_EXT_KEY\");'" \
            | tr -d '[:space:]')
          [ "$status" = installed ] \
            || { echo "core upgrade: extension ended up '$status', expected 'installed'" >&2; exit 1; }

      # Any exception or non-zero exit fails the job — that is the whole
      # contract, so an assertion is a `throw` and nothing has to be registered
      # anywhere.
      - name: Assert the seeded state survived (tests/upgrade/assert.php)
        run: |
          set -euo pipefail
          if [ -f tests/upgrade/assert.php ]; then
            docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
              "set -e
               cd \"$CK_EXT_PATH\"
               cv scr tests/upgrade/assert.php"
          else
            echo "no tests/upgrade/assert.php: the upgrade itself passed, but nothing checked what became of the extension's own records."
          fi

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -f "$CK_COMPOSE_FILE" ps -a
          docker compose -f "$CK_COMPOSE_FILE" logs --tail 200
          # A failing healthcheck's own output shows in no log.
          docker compose -f "$CK_COMPOSE_FILE" ps -aq | xargs -r docker inspect --format '{{.Name}}: {{json .State.Health}}'

      # Job-scoped project names mean no later run's `down -v` ever finds this
      # stack; leaked networks exhaust Docker's address pools on self-hosted runners.
      - name: Tear down the stack
        if: always()
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f -v
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker network rm
          docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker volume rm

  # --- Compatibility matrix (opt-in via matrix_images) ----------------------
  #
  # Runs when matrix_images, playwright or matrix_playwright is set, skipped
  # otherwise: a skipped job costs no runner minutes, so callers that set none
  # of them keep today's run.
  #
  # A matrix needs a JSON array, and workflow expressions have no split(), so
  # the CSV is parsed here and handed on as `images` (the compat legs) and
  # `playwright_images` (the browser legs). Same shape as build-dev-images.yml's
  # resolve-civicrm job.
  compat-images:
    # Cancelled only by this job in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-compat-images
      cancel-in-progress: true
    if: ${{ inputs.matrix_images != '' || inputs.playwright || inputs.matrix_playwright }}
    needs: key
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    outputs:
      images: ${{ steps.parse.outputs.images }}
      playwright_images: ${{ steps.parse.outputs.playwright_images }}
    steps:
      - name: Parse matrix_images into the compat and browser legs
        id: parse
        env:
          CK_MATRIX_IMAGES: ${{ inputs.matrix_images }}
          CK_IMAGE: ${{ needs.key.outputs.image }}
          CK_PLAYWRIGHT: ${{ inputs.playwright }}
          CK_MATRIX_PLAYWRIGHT: ${{ inputs.matrix_playwright }}
        run: |
          set -euo pipefail
          images=$(jq -Rc 'split(",") | map(sub("^ +";"") | sub(" +$";"")) | map(select(length > 0))' \
            <<< "$CK_MATRIX_IMAGES")
          # Image refs go into `docker compose` through the environment, but a
          # value that is not an image reference at all is a caller mistake
          # worth naming here instead of ten minutes later in a pull error.
          jq -e 'all(test("^[A-Za-z0-9][A-Za-z0-9._/-]*(:[A-Za-z0-9._-]+)?(@sha256:[a-f0-9]{64})?$"))' \
            <<< "$images" > /dev/null \
            || { echo "matrix_images contains something that is not an image reference: $images" >&2; exit 1; }
          # Two legs on one image would share a concurrency group and cancel each other.
          jq -e 'length == (unique | length)' <<< "$images" > /dev/null \
            || { echo "matrix_images lists an image more than once: $images" >&2; exit 1; }
          if [ "$CK_MATRIX_PLAYWRIGHT" = true ]; then
            [ "$CK_PLAYWRIGHT" = true ] \
              || { echo "matrix_playwright is on but playwright is off — there is no browser job to add legs to" >&2; exit 1; }
            [ "$images" != '[]' ] \
              || { echo "matrix_playwright is on but matrix_images is empty — there is no image to add a browser leg for" >&2; exit 1; }
          fi
          # The run's own image is always the first browser leg (empty: the compose
          # file's default); matrix_playwright appends the matrix images that differ.
          playwright_images=$(jq -c --arg image "$CK_IMAGE" --arg matrix "$CK_MATRIX_PLAYWRIGHT" \
            '[$image] + (if $matrix == "true" then . - [$image] else [] end)' <<< "$images")
          {
            echo "images=$images"
            echo "playwright_images=$playwright_images"
          } >> "$GITHUB_OUTPUT"
          echo "compat matrix: $images"
          echo "browser legs: $playwright_images"

  # One boot + suite per extra image. Deliberately NOT the full `ci` pass:
  # cklint, ckconform, phpstan and the coverage floor are enforced by the ck*
  # tools that ship *in the image*, so re-running them on a pinned older image
  # grades that image's tooling, not the extension. What is genuinely
  # version-dependent is whether the extension installs into that CiviCRM and
  # whether its tests pass there.
  compat:
    # Cancelled only by the same leg in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-${{ matrix.image }}-compat
      cancel-in-progress: true
    needs: [compat-images, key]
    # compat-images also runs for the browser legs alone, with no compat legs.
    if: ${{ inputs.matrix_images != '' }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    strategy:
      # One old CiviCRM failing must not hide the result for the new one.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.compat-images.outputs.images) }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ needs.key.outputs.key }}
      # Where CiviCRM has the extension enabled — derived by `key`.
      CK_EXT_PATH: ${{ needs.key.outputs.ext_path }}
      CIVIKITCHEN_IMAGE: ${{ matrix.image }}
      # One compose project per job — see the note in `ci`.
      COMPOSE_PROJECT_NAME: ck-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.key.outputs.key_slug }}-compat-${{ strategy.job-index }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Private dependencies — see the note on the same pair of steps in `ci`.
      - name: Check out civikitchen for the shared steps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' || needs.key.outputs.dist_build_tool != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          # toolbelt/ and packages/ hold the reader of the siblings' policy.dist.build.
          sparse-checkout: |
            .github/actions
            toolbelt/bin
            toolbelt/lib
            toolbelt/ckconform/bin
            toolbelt/ckconform/src
            packages
          path: .civikitchen-siblings/ci

      # The suite loads it. Before any token is minted: the build runs dependency code.
      - name: Build the declared release output
        if: ${{ needs.key.outputs.dist_build_tool == 'bun' }}
        uses: ./.civikitchen-siblings/ci/.github/actions/release-build
        with:
          node_version: ${{ inputs.node_version }}
          working_directory: ${{ inputs.working_directory }}

      - name: Private dependencies
        id: deps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        uses: ./.civikitchen-siblings/ci/.github/actions/private-deps
        with:
          node_version: ${{ inputs.node_version }}
          sibling_repo: ${{ inputs.sibling_repo }}
          composer_install: ${{ inputs.composer_install }}
          composer_app_repositories: ${{ inputs.composer_app_repositories }}
          app_id: ${{ secrets.composer_app_id }}
          app_private_key: ${{ secrets.composer_app_private_key }}
          ext_key: ${{ needs.key.outputs.key }}
          working_directory: ${{ inputs.working_directory }}

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }

      # Booting is itself the fresh-install test: the entrypoint installs
      # CiviCRM and enables the mounted extension, so an installer that fails
      # on this version never gets to the suite.
      - name: Start CiviCRM stack
        env:
          CK_SIBLING_OVERRIDE: ${{ steps.deps.outputs.sibling_override }}
        run: |
          set -euo pipefail
          compose=(-f "$CK_COMPOSE_FILE")
          if [ -n "${CK_SIBLING_OVERRIDE:-}" ]; then
            compose+=(-f "$CK_SIBLING_OVERRIDE")
          fi
          docker compose "${compose[@]}" down -v --remove-orphans
          # vendor/ as the runner user, who owns the checkout; written by the stack
          # it would belong to the image's web user.
          docker compose "${compose[@]}" run --rm --no-deps -T -u "$(id -u):$(id -g)" -e HOME=/tmp \
            --entrypoint sh app -c 'exec ck internal composer-install /var/www/html/ext/*/'
          docker compose "${compose[@]}" up -d --wait --quiet-pull

      - name: PHPUnit
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd \"$CK_EXT_PATH\" && CIVICRM_UF=UnitTests ckphpunit tests/phpunit"

      - name: Lifecycle smoke + gate (cklifecycle)
        id: lifecycle
        if: ${{ inputs.lifecycle }}
        run: |
          set -o pipefail
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd \"$CK_EXT_PATH\" && cklifecycle" 2>&1 | tee "$RUNNER_TEMP/cklifecycle.md"

      # The report is the point of the step, so it is published whether the
      # gate passed or failed — a leftover table named in a job summary gets
      # fixed, one buried 300 lines into a red step log does not.
      - name: Lifecycle summary
        if: ${{ !cancelled() && steps.lifecycle.outcome != 'skipped' }}
        run: |
          sed -n '/^### Lifecycle gate/,$p' "$RUNNER_TEMP/cklifecycle.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -f "$CK_COMPOSE_FILE" ps -a
          docker compose -f "$CK_COMPOSE_FILE" logs --tail 200
          # A failing healthcheck's own output shows in no log.
          docker compose -f "$CK_COMPOSE_FILE" ps -aq | xargs -r docker inspect --format '{{.Name}}: {{json .State.Health}}'

      # Job-scoped project names mean no later run's `down -v` ever finds this
      # stack; leaked networks exhaust Docker's address pools on self-hosted runners.
      - name: Tear down the stack
        if: always()
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f -v
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker network rm
          docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker volume rm

  # --- Browser tests (opt-in via playwright) --------------------------------
  #
  # examples/extension-with-playwright, promoted from a copy-paste starter to a
  # job: CiviCRM in Docker, the suite and its browser in the repo's Playwright
  # image (`ck playwright`) inside the app container's network namespace, where
  # the site is http://localhost. Skipped entirely when the input is off, so
  # callers that never set it keep exactly the run they have — same deal as the
  # compat matrix.
  #
  # Its own job rather than more steps in `ci`: browsers and an npm tree on
  # every push run is the opposite of what the standards ask of ci.yml, and a
  # browser failure that also hides the PHPUnit result is a bad trade. One leg
  # on `image`; matrix_playwright adds one per matrix_images entry, from the
  # list compat-images computes — see docs/extension-standards.md.
  playwright:
    # Cancelled only by the same leg in a newer run of the same caller workflow,
    # ref, directory and image. Literal name: github.job is the caller's job id.
    concurrency:
      group: ck-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ github.workflow }}-${{ inputs.image }}-${{ matrix.image }}-playwright
      cancel-in-progress: true
    needs: [compat-images, key]
    if: ${{ inputs.playwright }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    # Legs show as `playwright (<image>)`; a `name:` expression would show
    # verbatim on the skipped job in every run without playwright.
    strategy:
      # One image failing must not hide the result for the others.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.compat-images.outputs.playwright_images) }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ needs.key.outputs.key }}
      CIVIKITCHEN_IMAGE: ${{ matrix.image }}
      # One compose project per job — see the note in `ci`.
      COMPOSE_PROJECT_NAME: ck-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.key.outputs.key_slug }}-playwright-${{ strategy.job-index }}
      CK: ${{ github.workspace }}/.civikitchen-siblings/ci/toolbelt/bin/ck
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }

      # Private dependencies — see the note on the same pair of steps in `ci`.
      # The checkout also carries `ck playwright` and its Dockerfile.
      - name: Check out civikitchen for ck playwright and the private-dependency steps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: civico-de/civikitchen
          ref: ${{ job.workflow_sha }}
          # toolbelt/ and packages/ hold the reader of the siblings' policy.dist.build.
          sparse-checkout: |
            .github/actions
            toolbelt/bin
            toolbelt/lib
            toolbelt/ckconform/bin
            toolbelt/ckconform/src
            toolbelt/playwright
            packages
          path: .civikitchen-siblings/ci

      - name: Private dependencies
        id: deps
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        uses: ./.civikitchen-siblings/ci/.github/actions/private-deps
        with:
          node_version: ${{ inputs.node_version }}
          sibling_repo: ${{ inputs.sibling_repo }}
          composer_install: ${{ inputs.composer_install }}
          composer_app_repositories: ${{ inputs.composer_app_repositories }}
          app_id: ${{ secrets.composer_app_id }}
          app_private_key: ${{ secrets.composer_app_private_key }}
          ext_key: ${{ needs.key.outputs.key }}
          working_directory: ${{ inputs.working_directory }}

      # A login user, which the CI stack deliberately lacks: CIVIKITCHEN_DEMO_USER
      # is opt-in in the image, and the template-managed compose file should not
      # carry one for a job a repo may never switch on. The suite runs in the app
      # container's network namespace, so the site is http://localhost and nothing
      # is published: jobs on one self-hosted host share its ports. CiviCRM bakes
      # CIVIKITCHEN_SITE_URL into every asset and redirect URL.
      - name: Compose override — no published port, create the demo user
        run: |
          set -euo pipefail
          override="$RUNNER_TEMP/civikitchen-playwright-override.yml"
          # `!reset` drops ports the compose file publishes itself (a CMS one has 8080).
          cat > "$override" <<'YAML'
          services:
            app:
              ports: !reset []
              environment:
                CIVIKITCHEN_SITE_URL: http://localhost
                CIVIKITCHEN_DEMO_USER: admin
                CIVIKITCHEN_DEMO_PASS: admin
          YAML
          {
            echo "CK_PW_OVERRIDE=$override"
            # Read by the example config's `baseURL` and auth.setup.ts, and by tests/e2e/lib.sh.
            echo "CIVICRM_BASE_URL=http://localhost"
            echo "BASE_URL=http://localhost"
          } >> "$GITHUB_ENV"

      # Seed snapshots (docs/seed-snapshots.md): a profile with a `snapshot`
      # block generates its data on the first run and restores it from this
      # cache on later ones. No `snapshot` block, nothing stored: a no-op.
      - name: Restore seed snapshots
        id: seed-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ck-seed-store
          key: ck-seed-playwright-${{ inputs.working_directory }}-${{ matrix.image }}-${{ github.run_id }}
          restore-keys: ck-seed-playwright-${{ inputs.working_directory }}-${{ matrix.image }}-

      - name: Start CiviCRM stack
        env:
          CK_SIBLING_OVERRIDE: ${{ steps.deps.outputs.sibling_override }}
        run: |
          set -euo pipefail
          # The demo-user override and the sibling one touch different
          # keys; compose merges any number of -f files.
          compose=(-f "$CK_COMPOSE_FILE" -f "$CK_PW_OVERRIDE")
          if [ -n "${CK_SIBLING_OVERRIDE:-}" ]; then
            compose+=(-f "$CK_SIBLING_OVERRIDE")
          fi
          # The snapshot store, writable by the image's web user.
          mkdir -p "$RUNNER_TEMP/ck-seed-store"
          chmod 0777 "$RUNNER_TEMP/ck-seed-store"
          seed_override="$RUNNER_TEMP/ck-seed-override.yml"
          printf 'services:\n  app:\n    volumes:\n      - %s:/var/lib/civikitchen/snapshots\n' "$RUNNER_TEMP/ck-seed-store" > "$seed_override"
          compose+=(-f "$seed_override")
          docker compose "${compose[@]}" down -v --remove-orphans
          # vendor/ as the runner user, who owns the checkout; written by the stack
          # it would belong to the image's web user.
          docker compose "${compose[@]}" run --rm --no-deps -T -u "$(id -u):$(id -g)" -e HOME=/tmp \
            --entrypoint sh app -c 'exec ck internal composer-install /var/www/html/ext/*/'
          docker compose "${compose[@]}" up -d --wait --quiet-pull

      # Only a boot that generated a snapshot stores one: a restored set adds
      # nothing, and an expired one is replaced under the same key.
      - name: Name the seed snapshot
        id: seed-key
        run: |
          set -euo pipefail
          app=(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app)
          key=""
          if "${app[@]}" ck seed --help >/dev/null 2>&1; then
            key=$("${app[@]}" ck seed status --generated)
            if [ -n "$key" ]; then "${app[@]}" ck seed prune; fi
          else
            echo "::notice::The stack's image predates seed snapshots; nothing to store."
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Save seed snapshots
        if: ${{ steps.seed-key.outputs.key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ck-seed-store
          key: ck-seed-playwright-${{ inputs.working_directory }}-${{ matrix.image }}-${{ steps.seed-key.outputs.key }}-${{ github.run_id }}

      # The repo's Playwright image holds its tree, installed as the ci job installs
      # it, and the browsers of the Playwright version that tree resolves. The app
      # container serves the checkout, so pages that load from node_modules/ need
      # the same tree there.
      - name: Copy the JS dependencies into the checkout
        run: |
          set -euo pipefail
          # ck playwright hides an existing node_modules, so the copy would land in a tmpfs.
          [ ! -e node_modules ] || { echo "node_modules is already in the checkout; the image's tree cannot replace it" >&2; exit 1; }
          php "$CK" playwright cp -R /ck/node_modules .

      # The pages under test load it; the key job made sure Bun drives this job.
      - name: Build the declared release output (bun run build)
        if: ${{ needs.key.outputs.dist_build_tool == 'bun' }}
        run: php "$CK" playwright bun run build

      # Chromium aborts in-flight requests with ERR_NETWORK_CHANGED whenever an
      # interface appears in its netns, and other jobs on the same Docker host
      # add and remove bridges and veths in the host's all the time. The app
      # container's netns holds only its own; `docker compose` calls from the
      # suite reach this job's stack through the socket ck playwright mounts.
      - name: Playwright (npm run test:e2e / bun run test:e2e)
        env:
          # CIVICRM_BASE_URL comes from the override step.
          DEMO_USER: admin
          DEMO_PASS: admin
          CK_USE_BUN: ${{ inputs.bun }}
        run: |
          set -euo pipefail
          jq -e '.scripts["test:e2e"] // empty' package.json > /dev/null \
            || { echo "playwright is on but package.json declares no \"test:e2e\" script — that is the script this job runs" >&2; exit 1; }
          manager=npm
          if [ "$CK_USE_BUN" = true ]; then manager=bun; fi
          app=$(docker compose -f "$CK_COMPOSE_FILE" ps -q app)
          php "$CK" playwright --network "container:$app" "$manager" run test:e2e

      # A browser failure without its trace is a screenshot of nothing. Both
      # directories are Playwright defaults; `ignore` keeps a config that
      # writes elsewhere from turning a red suite into a red upload too.
      - name: Playwright report + traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One name per leg: playwright-<key> on `image`, -1, -2, … on the matrix legs.
          name: playwright-${{ needs.key.outputs.key }}${{ strategy.job-index != 0 && format('-{0}', strategy.job-index) || '' }}
          # Artifact paths are workspace-relative, not run-step-relative.
          path: |
            ${{ inputs.working_directory }}/playwright-report/
            ${{ inputs.working_directory }}/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # No override needed to find the stack: the project name comes from the
      # compose file, and this way the step still works when the failure was
      # the override step itself.
      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -f "$CK_COMPOSE_FILE" ps -a
          docker compose -f "$CK_COMPOSE_FILE" logs --tail 200
          # A failing healthcheck's own output shows in no log.
          docker compose -f "$CK_COMPOSE_FILE" ps -aq | xargs -r docker inspect --format '{{.Name}}: {{json .State.Health}}'

      # Job-scoped project names mean no later run's `down -v` ever finds this
      # stack; leaked networks exhaust Docker's address pools on self-hosted runners.
      - name: Tear down the stack
        if: always()
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f -v
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker network rm
          docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker volume rm
