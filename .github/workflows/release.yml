# Cut a release: the workflow, the template, the ck* tools and the images ship
# as ONE versioned contract (docs/releases.md).
#
# Trigger: pushing a v<major>.<minor>.<patch> tag. Nothing is built here — the
# release attaches its tags to the image digests the moving tags (:standalone,
# :drupal10, …) already point at, i.e. to artifacts that have been through
# test-then-promote. In exchange it insists that those artifacts actually
# belong to the release commit: a promoted digest still carries its
# `…-<sha>` candidate tag, so the build commit is recoverable, and its
# `docker/` + `toolbelt/` trees must match the ones being released.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v<major>.<minor>.<patch> tag to release (re-runnable)'
        required: true
        type: string
      allow_image_drift:
        description: >-
          Release although the live images were built from a commit whose
          docker/ or toolbelt/ tree differs from this tag. Only for changes that
          provably cannot affect the built image (comments, docs).
        type: boolean
        default: false

# One release at a time, none cancelled: the moving major tags follow the
# newest release, which a run can only tell once the previous one is done.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/civikitchen
  PKG: civikitchen

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      major: ${{ steps.tag.outputs.major }}
      sha: ${{ steps.tag.outputs.sha }}

    steps:
      # fetch-depth 0: the release has to reach both its own history and the
      # main-branch commits the live images were built from.
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve the version under release
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: .github/scripts/release-resolve-tag.sh

      # Before the login and everything after it: a tag whose version is not in
      # the changelog must fail while nothing has been pushed anywhere.
      - name: Check the changelog carries this version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: .github/scripts/changelog-check.sh --release "${TAG#v}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify the live image digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          ALLOW_DRIFT: ${{ inputs.allow_image_drift && '1' || '0' }}
        run: .github/scripts/release-verify-images.sh

      - name: Attach the release tags
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MAJOR: ${{ steps.tag.outputs.major }}
        run: .github/scripts/release-attach-tags.sh

  git-tag:
    # Only after the images carry the release tags: the moving major ref must
    # never point at a commit whose images nobody can pull.
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # The run's own token cannot move a tag onto a commit whose workflow
      # files differ from the old target; a GitHub App token with workflows
      # write can.
      - name: Require the release App credentials
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${CLIENT_ID}" ] || [ -z "${PRIVATE_KEY}" ]; then
            echo "::error::the variable RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_PRIVATE_KEY must both be set (docs/releases.md)"
            exit 1
          fi

      - name: Mint a token that can move the major tag
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.images.outputs.tag }}
          fetch-depth: 0

      - name: Move the major tag
        env:
          TAG: ${{ needs.images.outputs.tag }}
          MAJOR: ${{ needs.images.outputs.major }}
          RELEASE_SHA: ${{ needs.images.outputs.sha }}
          RELEASE_PUSH_TOKEN: ${{ steps.app.outputs.token }}
        run: .github/scripts/release-move-major-tag.sh

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 0
          fi
          .github/scripts/changelog-check.sh --section "${TAG#v}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${TAG}" --verify-tag --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
