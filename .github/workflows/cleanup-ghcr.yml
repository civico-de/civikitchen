# Weekly GHCR cleanup. Kept: every version with a stable (non-sha) tag, the newest build, and
# everything younger than 2 days; the platform and attestation manifests of a kept index stay
# with it. Pruned: superseded sha-candidate tags and the manifests nothing lists any more.
name: Cleanup GHCR

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only log what would be deleted'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: civico-de/ghcr-prune@389e65f1469e782b0a083644f871fbeae88a6701 # v1.0.0
        with:
          keep-newest: 1
          min-age-days: 2
          keep-tags: ^(?!.*-[0-9a-f]{40}(-(amd64|arm64))?$)
          apply: ${{ !inputs.dry_run }}
          max-delete: 500
