# Trivy scan of this run's candidate images, one job per image and platform.
# A promotion gate: promote publishes exactly the `digests` resolved and
# scanned here, never a re-read tag.
name: Scan candidate images

on:
  workflow_call:
    inputs:
      tags:
        description: >-
          JSON array of tag basenames to scan; each becomes
          `<prefix><tag>-<sha>`, as in merge-manifest.yml.
        required: true
        type: string
      prefix:
        description: Prepended to every entry of `tags`.
        type: string
        default: ''
      package:
        description: The GHCR package, e.g. civikitchen-cli.
        type: string
        default: civikitchen
    outputs:
      digests:
        description: JSON object tag -> the digest scanned; promote publishes these.
        value: ${{ jobs.resolve.outputs.digests }}

# A called workflow does not inherit `env`; derived again as in merge-manifest.yml.
env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ inputs.package }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      digests: ${{ steps.resolve.outputs.digests }}
    steps:
      - name: Checkout (for the resolve script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the candidate digests
        id: resolve
        env:
          TAGS: ${{ inputs.tags }}
          PREFIX: ${{ inputs.prefix }}
          SHA: ${{ github.sha }}
        run: .github/scripts/resolve-candidate-digests.sh

  scan:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    strategy:
      # One flavor's CVE must not hide the others' reports. Each arch resolves
      # its packages independently, so both are scanned.
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(inputs.tags) }}
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout (for trivyignore.yaml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install trivy
        run: .github/scripts/install-trivy.sh

      # The gate scans the digest `resolve` pinned. --scanners vuln: the secret
      # scanner would block on findings --ignore-unfixed cannot apply to.
      # trivyignore.yaml is named explicitly: trivy auto-loads only .trivyignore.
      - name: Scan the published image (gate)
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}@${{ fromJSON(needs.resolve.outputs.digests)[matrix.tag] }}
          PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/trivy-scan-gate.sh

      # Unfiltered, exit code 0, into the job summary; runs when the gate is red too.
      - name: Full report into the job summary
        if: ${{ !cancelled() }}
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}@${{ fromJSON(needs.resolve.outputs.digests)[matrix.tag] }}
          IMAGE: ${{ inputs.prefix }}${{ matrix.tag }}-${{ github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/trivy-report-summary.sh
