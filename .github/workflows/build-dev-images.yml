name: Build Dev Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'toolbelt/**'
      - 'packages/**'
      - 'composer.json'
      - 'composer.lock'
      # The image tests hold the stamped extension template to the ck* gates.
      - 'scaffold/**'
      - 'tests/images/**'
      - 'tests/scenario/**'
      - 'tests/ckcreate/e2e-ckcreate.sh'
      - 'tests/e2e/**'
      - 'examples/standalone/docker-compose.yml'
      - 'examples/scenario/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/build-dev-images.yml'
      - '.github/workflows/merge-manifest.yml'
      - '.github/workflows/build-demo-images.yml'
      - '.github/workflows/scan-images.yml'
      - '.github/scripts/**'
      # Changes the scan verdict directly, so it must re-run the scan jobs.
      - 'trivyignore.yaml'
  schedule:
    # Daily, uncached, an hour before the GHCR cleanup: picks up Debian security
    # fixes and the current upstream stable.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      extra_standalone_minors:
        description: >-
          Extra standalone minors to build alongside the current stable
          (comma-separated, e.g. "6.12"); each resolves to its newest patch
          release. Non-empty REPLACES the supported list in
          toolbelt/versions.env (CK_STANDALONE_EXTRA_MINORS) for this run —
          a one-off rebuild of an unsupported minor does not need a commit.
          The phpstan APIv4 catalog's minor is built and promoted either way.
        required: false
        default: ''
      no_cache:
        description: >-
          Build without the layer cache, as the daily run does, so a Debian
          fix published since the last uncached build lands now.
        type: boolean
        default: false

# The images that gate a release: standalone (every listed minor) and
# standalone-demo. The CMS flavors build in build-cms-images.yml.
#
# Moving tags are last-writer-wins, so a newer push cancels the running one.
# A daily run cancels nothing, so it never discards a release candidate.
concurrency:
  group: build-dev-images
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# Default for every job; the ones that push to GHCR widen it themselves.
permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/civikitchen

jobs:
  resolve-civicrm:
    # The exact CiviCRM version every image bakes.
    runs-on: ubuntu-24.04
    outputs:
      stable: ${{ steps.resolve.outputs.stable }}
      minor: ${{ steps.resolve.outputs.minor }}
      standalone_versions: ${{ steps.resolve.outputs.standalone_versions }}
    steps:
      - name: Checkout (for the resolve script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve current CiviCRM stable
        id: resolve
        env:
          # Empty on push/schedule — the script then falls back to the
          # supported list in toolbelt/versions.env.
          EXTRA_MINORS: ${{ inputs.extra_standalone_minors }}
        run: .github/scripts/resolve-civicrm-stable.sh

  build-standalone:
    needs: resolve-civicrm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        version: ${{ fromJSON(needs.resolve-civicrm.outputs.standalone_versions) }}
        arch: [arm64, amd64]
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds push only sha-suffixed candidates; promote-standalone moves the
      # stable tags after the tests pass.
      - name: Build and push standalone candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Authenticated GitHub dist downloads for composer; see the Dockerfile.
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ github.token }}"}}
          file: docker/standalone/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            CIVICRM_VERSION=${{ matrix.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}:standalone-${{ matrix.version }}-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-buildcache:standalone-${{ matrix.version }}-${{ matrix.arch }}
          # The image is pushed before the cache export, so a failed export
          # (`error writing layer blob: not_found`) must not fail the job.
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-buildcache:standalone-${{ matrix.version }}-${{ matrix.arch }},mode=max,ignore-error=true
          # The daily cron rebuilds from scratch so apt layers pick up security fixes.
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}

  # The per-arch candidates become one multi-platform tag; the matrix carries
  # bare CiviCRM versions, hence the prefix.
  merge-standalone:
    needs: [resolve-civicrm, build-standalone]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/merge-manifest.yml
    with:
      prefix: standalone-
      tags: ${{ needs.resolve-civicrm.outputs.standalone_versions }}

  smoke-test-standalone:
    needs: [resolve-civicrm, merge-standalone]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        version: ${{ fromJSON(needs.resolve-civicrm.outputs.standalone_versions) }}
        platform: [linux/arm64, linux/amd64]
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/amd64
            runner: ubuntu-24.04

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (for the dev-tools test script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Functional test of bundled dev tools
        env:
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ matrix.version }}-${{ github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/run-dev-tools-test.sh

      - name: Boot test (first boot against an external DB, mounted extension, core locale)
        env:
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ matrix.version }}-${{ github.sha }}
        run: bash tests/images/boot-test-standalone.sh "$IMG"

  e2e-test-standalone:
    # The example compose stack in Chromium: install, Apache and SITE_URL bugs.
    needs: [resolve-civicrm, smoke-test-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The example compose reads `${IMAGE}`: this run's candidate tag.
      - name: Boot the example stack
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}:standalone-${{ needs.resolve-civicrm.outputs.stable }}-${{ github.sha }}
          # A registry key, one whose core-bundled requirement must be installed
          # first (sepa → legacycustomsearches), and the key@URL form.
          CIVIKITCHEN_EXTRA_EXTENSIONS: "mjwshared,org.project60.sepa,de.systopia.xcm@https://github.com/systopia/de.systopia.xcm/releases/download/1.13.0/de.systopia.xcm-1.13.0.zip"
        run: |
          docker compose -f examples/standalone/docker-compose.yml up -d --pull always

      - name: Wait for CiviCRM to install + boot
        env:
          COMPOSE_FILE: examples/standalone/docker-compose.yml
        run: .github/scripts/wait-standalone-ready.sh

      # Every CIVIKITCHEN_EXTRA_EXTENSIONS entry must end up installed, and the
      # bundled requirement with it.
      - name: Verify CIVIKITCHEN_EXTRA_EXTENSIONS got installed
        env:
          COMPOSE_FILE: examples/standalone/docker-compose.yml
          EXT_KEYS: mjwshared org.project60.sepa legacycustomsearches de.systopia.xcm
        run: .github/scripts/verify-extra-extensions.sh

      # The browser and the npm tree come from the Playwright image (ck playwright).
      - name: Run Playwright e2e
        env:
          CIVICRM_BASE_URL: http://localhost:8080
        run: scaffold/ck playwright playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: App container logs on failure
        if: failure()
        run: docker compose -f examples/standalone/docker-compose.yml logs app

      - name: Tear down
        if: always()
        run: docker compose -f examples/standalone/docker-compose.yml down -v

  database-compat-standalone:
    # Every database policy.database offers gates promotion
    # (tests/parity/database-policy.php holds the two equal).
    needs: [resolve-civicrm, smoke-test-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: ["mariadb:11.4", "mariadb:10.11", "mariadb:12.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: First boot and headless scratch DB
        env:
          CK_DATABASE_IMAGE: ${{ matrix.database }}
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ needs.resolve-civicrm.outputs.stable }}-${{ github.sha }}
        run: bash tests/images/boot-test-standalone.sh "$IMG"

  database-compat-extended:
    # The same boot against MySQL, which policy.database does not offer. Off
    # the promotion path; a failure still turns the run red and blocks a release.
    needs: [resolve-civicrm, promote-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: ["mysql:8.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: First boot and headless scratch DB
        env:
          CK_DATABASE_IMAGE: ${{ matrix.database }}
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ needs.resolve-civicrm.outputs.stable }}-${{ github.sha }}
        run: bash tests/images/boot-test-standalone.sh "$IMG"

  scenario-test-standalone:
    needs: [resolve-civicrm, smoke-test-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install scenario YAML parser
        run: composer install --no-dev --no-interaction --no-progress

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot generated scenario with external profile
        env:
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ needs.resolve-civicrm.outputs.stable }}-${{ github.sha }}
        run: bash tests/scenario/boot-scenario.sh "$IMG"

  scaffold-test-standalone:
    # A fresh extension from real civix (ckcreate) passes every gate its own CI
    # runs (ck ci) in the template's dev stack.
    needs: [resolve-civicrm, smoke-test-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ckcreate, ckup, ck ci
        env:
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ needs.resolve-civicrm.outputs.stable }}-${{ github.sha }}
        run: |
          docker pull "$IMG"
          bash tests/ckcreate/e2e-ckcreate.sh "$IMG"

  promote-standalone:
    # Stable tags move only after the tests and the scan, onto the scanned digest.
    needs: [resolve-civicrm, smoke-test-standalone, e2e-test-standalone, database-compat-standalone, scenario-test-standalone, scaffold-test-standalone, scan-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        version: ${{ fromJSON(needs.resolve-civicrm.outputs.standalone_versions) }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (for the promote script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Consumers pin the minor tag (:standalone-6.17); the exact tag freezes a patch.
      - name: Promote the scanned candidate to stable tags
        env:
          VERSION: ${{ matrix.version }}
          DIGEST: ${{ fromJSON(needs.scan-standalone.outputs.digests)[matrix.version] }}
        run: .github/scripts/promote-digest.sh "standalone-${VERSION}" "standalone-${VERSION%.*}"

      - name: Alias :standalone and :standalone-latest onto the current stable
        if: matrix.version == needs.resolve-civicrm.outputs.stable
        env:
          DIGEST: ${{ fromJSON(needs.scan-standalone.outputs.digests)[matrix.version] }}
        run: .github/scripts/promote-digest.sh standalone standalone-latest

  standalone-demo:
    needs: resolve-civicrm
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-demo-images.yml
    with:
      variants: '[{"name": "standalone-demo", "site_type": "standalone-demo"}]'
      no_cache: ${{ inputs.no_cache == true }}
      # The combined-profile leg: a comma list applies in order; shared
      # apiUser names ("readonly") must upsert, not duplicate.
      smoke: >-
        [{"tag": "standalone-demo", "profile": ""},
         {"tag": "standalone-demo", "profile": "common"},
         {"tag": "standalone-demo", "profile": "dach"},
         {"tag": "standalone-demo", "profile": "common,dach"}]
      civicrm_version: ${{ needs.resolve-civicrm.outputs.stable }}
      civicrm_build_version: ${{ needs.resolve-civicrm.outputs.minor }}

  # Trivy over this run's standalone candidates, beside the tests; promote
  # waits for it (scan-images.yml). The demo scans inside build-demo-images.yml.
  scan-standalone:
    needs: [resolve-civicrm, merge-standalone]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/scan-images.yml
    with:
      prefix: standalone-
      tags: ${{ needs.resolve-civicrm.outputs.standalone_versions }}

  monorepo-self-test:
    # The self-test runs the ck* tools baked into :standalone, so it waits for
    # the promote that puts this commit's toolbelt there.
    needs: [promote-standalone]
    permissions:
      contents: write  # the release dry run calls a workflow whose publish job declares it
    uses: ./.github/workflows/monorepo-self-test.yml

  # The checkout-free ck image (docker/cli/Dockerfile, target cli) as
  # civikitchen-cli: built per arch, merged, scanned, smoke-tested, promoted to :latest.
  build-cli:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [arm64, amd64]
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cli candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/cli/Dockerfile
          target: cli
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-cli:latest-${{ github.sha }}-${{ matrix.arch }}
          # Small enough to build uncached; every run gets the current apk packages.
          no-cache: true

  merge-cli:
    needs: build-cli
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/merge-manifest.yml
    with:
      package: civikitchen-cli
      tags: '["latest"]'

  scan-cli:
    needs: merge-cli
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/scan-images.yml
    with:
      package: civikitchen-cli
      tags: '["latest"]'

  promote-cli:
    needs: [merge-cli, scan-cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        tag: [latest]
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/civikitchen-cli

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (for the promote script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test (ck's usage, as the runner's user)
        env:
          DIGEST: ${{ fromJSON(needs.scan-cli.outputs.digests)[matrix.tag] }}
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -e CK_USER="$(id -u):$(id -g)" "${IMAGE_PREFIX}@${DIGEST}" run --help

      - name: The host commands find every PHP function and class they use
        env:
          DIGEST: ${{ fromJSON(needs.scan-cli.outputs.digests)[matrix.tag] }}
        run: >-
          docker run --rm --entrypoint php -v "$PWD/tests/images:/check:ro" "${IMAGE_PREFIX}@${DIGEST}"
          /check/cli-extensions.php /opt/civikitchen/toolbelt/lib/php/src
          'Cli\AbCommand' 'Cli\RunCommand' 'Cli\BisectCommand' 'Cli\DemoCommand' 'Cli\PlaywrightCommand'

      - name: Promote the scanned candidate to :latest
        env:
          DIGEST: ${{ fromJSON(needs.scan-cli.outputs.digests)[matrix.tag] }}
        run: .github/scripts/promote-digest.sh latest

  # docker/civiproxy/Dockerfile as :civiproxy, the CiviProxy for extension
  # stacks: built per arch, merged, scanned, smoke-tested, promoted.
  build-civiproxy:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [arm64, amd64]
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push civiproxy candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/civiproxy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}:civiproxy-${{ github.sha }}-${{ matrix.arch }}
          # Small enough to build uncached; every run gets the current Debian packages.
          no-cache: true

  merge-civiproxy:
    needs: build-civiproxy
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/merge-manifest.yml
    with:
      tags: '["civiproxy"]'

  scan-civiproxy:
    needs: merge-civiproxy
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/scan-images.yml
    with:
      tags: '["civiproxy"]'

  promote-civiproxy:
    needs: [merge-civiproxy, scan-civiproxy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        tag: [civiproxy]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (for the smoke test and the promote script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test (config guard, page, APIv4 relay to a stub target)
        env:
          DIGEST: ${{ fromJSON(needs.scan-civiproxy.outputs.digests)[matrix.tag] }}
        run: bash tests/images/smoke-test-civiproxy.sh "${IMAGE_PREFIX}@${DIGEST}"

      - name: Promote the scanned candidate to :civiproxy
        env:
          DIGEST: ${{ fromJSON(needs.scan-civiproxy.outputs.digests)[matrix.tag] }}
        run: .github/scripts/promote-digest.sh civiproxy

  notify-scheduled-failure:
    # A failed daily run otherwise goes unseen: promote keeps the last good tags.
    # failure() is transitive over needs; the scans are listed for base-image CVEs.
    needs: [promote-standalone, database-compat-extended, standalone-demo, scan-standalone, monorepo-self-test, scan-cli, promote-cli, scan-civiproxy, promote-civiproxy]
    if: github.event_name == 'schedule' && failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write

    steps:
      - name: Checkout (for the notify script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or bump the scheduled-build-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/notify-scheduled-failure.sh
