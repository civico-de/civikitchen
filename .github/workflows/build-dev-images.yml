name: Build Dev Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'toolbelt/**'
      - 'packages/**'
      # The image tests hold the stamped extension template to the ck* gates.
      - 'scaffold/**'
      - 'tests/images/**'
      - 'tests/scenario/**'
      - 'tests/ckcreate/e2e-ckcreate.sh'
      - 'tests/e2e/**'
      - 'examples/standalone/docker-compose.yml'
      - 'examples/scenario/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/build-dev-images.yml'
      - '.github/workflows/merge-manifest.yml'
      - '.github/workflows/build-demo-images.yml'
      - '.github/workflows/scan-images.yml'
      - '.github/scripts/**'
      # Changes the scan verdict directly, so it must re-run the scan jobs.
      - 'trivyignore.yaml'
  schedule:
    # Daily (04:00 UTC, an hour before the GHCR cleanup cron): Debian security
    # updates arrive daily and the cron build runs uncached, so a fixed package
    # is in the images a day later. resolve-civicrm picks up the current
    # upstream stable each run; test-then-promote keeps the stable tags on the
    # last good image when a build or its gates fail.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      extra_standalone_minors:
        description: >-
          Extra standalone minors to build alongside the current stable
          (comma-separated, e.g. "6.12"); each resolves to its newest patch
          release. Non-empty REPLACES the supported list in
          toolbelt/versions.env (CK_STANDALONE_EXTRA_MINORS) for this run —
          a one-off rebuild of an unsupported minor does not need a commit.
          The phpstan APIv4 catalog's minor is built and promoted either way.
        required: false
        default: ''

# The images that gate a release: standalone (every listed CiviCRM minor) and
# standalone-demo. The CMS flavors build in build-cms-images.yml, with their own
# concurrency group, so neither pipeline cancels or fails the other.
#
# The moving tags (:standalone, :standalone-demo, …) are last-writer-wins, and
# the writer is whichever run finishes promote last — not whichever commit is
# newer. Two pushes in quick succession therefore leave the live images built
# from the OLDER commit, and the next release refuses with "image drift".
# A newer push or dispatch cancels the running one, so the last commit wins. A
# run cancelled mid-promote leaves split tags until the next run.
# A daily run cancels nothing, so it never discards a release candidate.
concurrency:
  group: build-dev-images
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# Default for every job; the ones that push to GHCR widen it themselves.
permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/civikitchen

jobs:
  resolve-civicrm:
    # Single source of truth for the CiviCRM version every image bakes.
    # latest.civicrm.org/stable.php returns the current stable (e.g. 6.15.1);
    # every image pins an exact version — standalone installs the matching
    # release tarball, the demo civibuilds it.
    runs-on: ubuntu-24.04
    outputs:
      stable: ${{ steps.resolve.outputs.stable }}
      minor: ${{ steps.resolve.outputs.minor }}
      standalone_versions: ${{ steps.resolve.outputs.standalone_versions }}
    steps:
      - name: Checkout (for the resolve script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve current CiviCRM stable
        id: resolve
        env:
          # Empty on push/schedule — the script then falls back to the
          # supported list in toolbelt/versions.env.
          EXTRA_MINORS: ${{ inputs.extra_standalone_minors }}
        run: .github/scripts/resolve-civicrm-stable.sh

  build-standalone:
    needs: resolve-civicrm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        version: ${{ fromJSON(needs.resolve-civicrm.outputs.standalone_versions) }}
        arch: [arm64, amd64]
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Test-then-promote: builds push only sha-suffixed candidate tags. The
      # stable tags (:standalone, :standalone-latest, ...) are created by
      # promote-standalone AFTER the smoke + e2e tests pass, so a broken image
      # never goes live under a stable tag.
      - name: Build and push standalone candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Authenticated GitHub dist downloads for composer; see the Dockerfile.
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ github.token }}"}}
          file: docker/standalone/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            CIVICRM_VERSION=${{ matrix.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}:standalone-${{ matrix.version }}-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=standalone-${{ matrix.version }}-${{ matrix.arch }}
          # The image is pushed before the cache export, so a failed export
          # (`error writing layer blob: not_found`) must not fail the job.
          cache-to: type=gha,mode=max,scope=standalone-${{ matrix.version }}-${{ matrix.arch }},ignore-error=true
          # The daily cron rebuilds from scratch: a cached apt layer would keep
          # serving the base image's outdated packages past their security fix.
          no-cache: ${{ github.event_name == 'schedule' }}

  # The per-arch candidates become one multi-platform tag. Every caller shares
  # one implementation — see .github/workflows/merge-manifest.yml. The matrix here
  # carries bare CiviCRM versions, hence the prefix.
  merge-standalone:
    needs: [resolve-civicrm, build-standalone]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/merge-manifest.yml
    with:
      prefix: standalone-
      tags: ${{ needs.resolve-civicrm.outputs.standalone_versions }}

  smoke-test-standalone:
    needs: [resolve-civicrm, merge-standalone]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        version: ${{ fromJSON(needs.resolve-civicrm.outputs.standalone_versions) }}
        platform: [linux/arm64, linux/amd64]
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/amd64
            runner: ubuntu-24.04

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (for the dev-tools test script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Functional test of bundled dev tools
        env:
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ matrix.version }}-${{ github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/run-dev-tools-test.sh

      - name: Boot test (first boot against an external DB, mounted extension, core locale)
        env:
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ matrix.version }}-${{ github.sha }}
        run: bash tests/images/boot-test-standalone.sh "$IMG"

  e2e-test-standalone:
    # Runs the example compose stack and exercises the auto-installed site
    # with Playwright (real Chromium). Catches install/Apache/SITE_URL bugs
    # the in-image functional test can't see.
    needs: [resolve-civicrm, smoke-test-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The example compose uses `image: ${IMAGE:-…default}` so we point it
      # at this run's candidate tag (stable tags don't exist yet at this point).
      - name: Boot the example stack
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}:standalone-${{ needs.resolve-civicrm.outputs.stable }}-${{ github.sha }}
          # Exercise the CIVIKITCHEN_EXTRA_EXTENSIONS entrypoint hook with both
          # supported syntaxes:
          # - bare key (mjwshared): pulled from the public registry, exercises
          #   ext:download's network + cache refresh path.
          # - bare key whose core-bundled requirement is uninstalled (org.project60.sepa →
          #   legacycustomsearches): core refuses the download until it is installed.
          # - key@URL (de.systopia.xcm): exercises the explicit-URL path. This
          #   one previously regressed because cv ext:download auto-installs
          #   and bombed with "Cannot install or enable extension"; the
          #   entrypoint now splits download (--no-install) + enable.
          CIVIKITCHEN_EXTRA_EXTENSIONS: "mjwshared,org.project60.sepa,de.systopia.xcm@https://github.com/systopia/de.systopia.xcm/releases/download/1.13.0/de.systopia.xcm-1.13.0.zip"
        run: |
          docker compose -f examples/standalone/docker-compose.yml up -d --pull always

      - name: Wait for CiviCRM to install + boot
        env:
          COMPOSE_FILE: examples/standalone/docker-compose.yml
        run: .github/scripts/wait-standalone-ready.sh

      # Every CIVIKITCHEN_EXTRA_EXTENSIONS entry must end up installed, and the
      # bundled requirement with it.
      - name: Verify CIVIKITCHEN_EXTRA_EXTENSIONS got installed
        env:
          COMPOSE_FILE: examples/standalone/docker-compose.yml
          EXT_KEYS: mjwshared org.project60.sepa legacycustomsearches de.systopia.xcm
        run: .github/scripts/verify-extra-extensions.sh

      # The browser and the npm tree come from the Playwright image (ck playwright).
      - name: Run Playwright e2e
        env:
          CIVICRM_BASE_URL: http://localhost:8080
        run: toolbelt/bin/ck playwright playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: App container logs on failure
        if: failure()
        run: docker compose -f examples/standalone/docker-compose.yml logs app

      - name: Tear down
        if: always()
        run: docker compose -f examples/standalone/docker-compose.yml down -v

  database-compat-standalone:
    # One current-stable amd64 candidate: install, provisioning, locale
    # rendering and the isolated headless DB. Every image policy.database
    # offers gates promotion (tests/parity/database-policy.php holds the two equal).
    needs: [resolve-civicrm, smoke-test-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: ["mariadb:11.4", "mariadb:10.11", "mariadb:12.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: First boot and headless scratch DB
        env:
          CK_DATABASE_IMAGE: ${{ matrix.database }}
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ needs.resolve-civicrm.outputs.stable }}-${{ github.sha }}
        run: bash tests/images/boot-test-standalone.sh "$IMG"

  database-compat-extended:
    # The same boot against MySQL, which policy.database does not offer. Off
    # the promotion path; a failure still turns the run red and blocks a release.
    needs: [resolve-civicrm, promote-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: ["mysql:8.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: First boot and headless scratch DB
        env:
          CK_DATABASE_IMAGE: ${{ matrix.database }}
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ needs.resolve-civicrm.outputs.stable }}-${{ github.sha }}
        run: bash tests/images/boot-test-standalone.sh "$IMG"

  scenario-test-standalone:
    needs: [resolve-civicrm, smoke-test-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install scenario YAML parser
        run: composer install --no-interaction --no-progress --working-dir=packages/civikitchen-scenario-schema

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot generated scenario with external profile
        env:
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ needs.resolve-civicrm.outputs.stable }}-${{ github.sha }}
        run: bash tests/scenario/boot-scenario.sh "$IMG"

  scaffold-test-standalone:
    # A fresh extension from real civix (ckcreate) passes every gate its own CI
    # runs (ck ci) in the template's dev stack.
    needs: [resolve-civicrm, smoke-test-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ckcreate, ckup, ck ci
        env:
          IMG: ${{ env.IMAGE_PREFIX }}:standalone-${{ needs.resolve-civicrm.outputs.stable }}-${{ github.sha }}
        run: |
          docker pull "$IMG"
          bash tests/ckcreate/e2e-ckcreate.sh "$IMG"

  promote-standalone:
    # Stable tags only move once the candidate passed the tests and the scan,
    # and onto the digest the scan passed. `imagetools create` from a manifest
    # list copies it intact, so the promoted tag stays multi-arch.
    needs: [resolve-civicrm, smoke-test-standalone, e2e-test-standalone, database-compat-standalone, scenario-test-standalone, scaffold-test-standalone, scan-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        version: ${{ fromJSON(needs.resolve-civicrm.outputs.standalone_versions) }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (for the promote script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The consumer contract is the MINOR tag (:standalone-6.17); the exact
      # tag (:standalone-6.17.0) is new with the tarball-based image and
      # freezes a patch release for whoever needs that.
      - name: Promote the scanned candidate to stable tags
        env:
          VERSION: ${{ matrix.version }}
          DIGEST: ${{ fromJSON(needs.scan-standalone.outputs.digests)[matrix.version] }}
        run: .github/scripts/promote-digest.sh "standalone-${VERSION}" "standalone-${VERSION%.*}"

      - name: Alias :standalone and :standalone-latest onto the current stable
        if: matrix.version == needs.resolve-civicrm.outputs.stable
        env:
          DIGEST: ${{ fromJSON(needs.scan-standalone.outputs.digests)[matrix.version] }}
        run: .github/scripts/promote-digest.sh standalone standalone-latest

  standalone-demo:
    needs: resolve-civicrm
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-demo-images.yml
    with:
      variants: '[{"name": "standalone-demo", "site_type": "standalone-demo"}]'
      # The combined-profile leg: a comma list applies in order; shared
      # apiUser names ("readonly") must upsert, not duplicate.
      smoke: >-
        [{"tag": "standalone-demo", "profile": ""},
         {"tag": "standalone-demo", "profile": "verein"},
         {"tag": "standalone-demo", "profile": "fundraising"},
         {"tag": "standalone-demo", "profile": "events"},
         {"tag": "standalone-demo", "profile": "mailing"},
         {"tag": "standalone-demo", "profile": "verein,mailing"}]
      civicrm_version: ${{ needs.resolve-civicrm.outputs.stable }}
      civicrm_build_version: ${{ needs.resolve-civicrm.outputs.minor }}

  # Trivy over this run's standalone candidates, beside the tests; promote
  # waits for it (scan-images.yml). The demo scans inside build-demo-images.yml.
  scan-standalone:
    needs: [resolve-civicrm, merge-standalone]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/scan-images.yml
    with:
      prefix: standalone-
      tags: ${{ needs.resolve-civicrm.outputs.standalone_versions }}

  monorepo-self-test:
    # The self-test runs the ck* tools baked into :standalone, so it waits for
    # the promote that puts this commit's toolbelt there.
    needs: [promote-standalone]
    permissions:
      contents: write  # the release dry run calls a workflow whose publish job declares it
    uses: ./.github/workflows/monorepo-self-test.yml

  notify-scheduled-failure:
    # The daily cron rebuild fails SILENTLY otherwise: test-then-promote
    # keeps serving the last good stable tags, so nothing user-visible breaks
    # and a broken pipeline can go unnoticed for weeks. Open (or bump) an
    # issue so the failure has a place to be seen. failure() is transitive
    # over the needs chain, so any failed job anywhere in the pipeline
    # triggers this — push-triggered runs are excluded (those failures are
    # visible on the commit/PR already).
    # The scans are listed although promote already waits for them: the daily
    # cron is the run that finds a base-image CVE nobody pushed a commit for,
    # and the edge makes that finding open an issue.
    needs: [promote-standalone, database-compat-extended, standalone-demo, scan-standalone, monorepo-self-test]
    if: github.event_name == 'schedule' && failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write

    steps:
      - name: Checkout (for the notify script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or bump the scheduled-build-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/notify-scheduled-failure.sh
