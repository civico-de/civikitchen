# Do all image families still build? Pull requests only: one CMS, one arch, no
# push, no tests. Both buildkit targets build: their COPY layers differ.
name: Image Build Gate

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'toolbelt/**'
      - 'packages/**'
      - 'composer.json'
      - 'composer.lock'
      - '.dockerignore'
      - '.github/workflows/image-build-gate.yml'
      - '.github/workflows/build-dev-images.yml'
      - '.github/workflows/build-cms-images.yml'
      - '.github/workflows/build-demo-images.yml'
      - '.github/workflows/merge-manifest.yml'

# A force-push to the PR obsoletes the running build; ~20 cold minutes are
# worth cancelling.
concurrency:
  group: image-build-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-standalone:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Own cache scope: the pipeline's scopes carry a CiviCRM version this job lacks.
      - name: Build standalone image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/standalone/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=image-build-gate
          cache-to: type=gha,mode=max,scope=image-build-gate

  build-buildkit-targets:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [final, demo]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build buildkit ${{ matrix.target }} target (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/buildkit/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: |
            DEFAULT_SITE_TYPE=drupal10-demo
          cache-from: type=gha,scope=image-build-gate-buildkit-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=image-build-gate-buildkit-${{ matrix.target }}
