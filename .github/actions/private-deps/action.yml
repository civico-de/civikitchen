name: CiviKitchen private dependencies
description: >-
  Sibling extension checkouts with their vendor/ and declared release builds,
  the organisation policy defaults and the runner composer install —
  everything a stack boot needs before it starts. Writes the compose override
  that mounts and enables the siblings (output `sibling_override`); layer it
  with a second -f on `up`.

inputs:
  sibling_repo:
    description: Comma- or newline-separated extension repos (owner/repo).
    default: ''
  composer_install:
    description: Run `composer install` on the runner.
    default: 'false'
  policy_defaults:
    description: Repo (owner/repo) holding the organisation's civikitchen.yaml.
    default: ''
  composer_app_repositories:
    description: Repositories the minted app token may read.
    default: ''
  app_id:
    description: GitHub App ID (secrets.composer_app_id).
    default: ''
  app_private_key:
    description: GitHub App private key (secrets.composer_app_private_key).
    default: ''
  working_directory:
    description: >-
      The extension's directory inside the repository. Composite steps do not
      inherit the calling job's defaults.run.working-directory.
    default: '.'
  node_version:
    description: >-
      Node a sibling's declared release build runs its binaries on. Required
      only when a sibling declares policy.dist.build.
    default: ''
  ext_key:
    description: >-
      This extension's key — the last entry of the enable list, and the
      extension whose pins precede the siblings'. Empty writes
      no enable list at all: the override then only mounts the siblings, for a
      caller that owns CIVIKITCHEN_ENABLE_EXTENSIONS itself.
    default: ''

outputs:
  sibling_paths:
    description: >-
      Space-separated workspace-relative directories of the checked-out
      siblings, each named after the extension key from its info.xml.
    value: ${{ steps.siblings.outputs.paths }}
  sibling_override:
    description: >-
      Path of the compose override that mounts and enables the siblings, or
      empty when no sibling was configured. Layer it with a second -f on `up`.
    value: ${{ steps.override.outputs.file }}

runs:
  using: composite
  steps:
    # App credentials stay on the runner: a container gets the result (vendor/,
    # a sibling checkout), never the token. No app is valid: all packages public.
    - name: Decide whether a private-dependency token is needed
      id: need-token
      shell: bash
      env:
        CK_COMPOSER_APP_ID: ${{ inputs.app_id }}
        CK_COMPOSER_APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
        CK_COMPOSER_APP_REPOSITORIES: ${{ inputs.composer_app_repositories }}
      run: |
        set -euo pipefail
        if [ -n "${CK_COMPOSER_APP_ID:-}" ] && [ -n "${CK_COMPOSER_APP_PRIVATE_KEY:-}" ]; then
          if [ -z "${CK_COMPOSER_APP_REPOSITORIES//[[:space:],]/}" ]; then
            echo "composer_app_repositories must list the repositories readable by the app token" >&2
            exit 1
          fi
          echo "app=true" >> "$GITHUB_OUTPUT"
        else
          echo "app=false" >> "$GITHUB_OUTPUT"
        fi

    # Scoped to composer_app_repositories, never the app's full install.
    - name: Mint a read token for private dependencies
      id: app
      if: ${{ steps.need-token.outputs.app == 'true' }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.composer_app_repositories }}
        permission-contents: read

    # The leading dot in `.civikitchen-siblings/` is load-bearing: CiviCRM's
    # extension scanner skips dot directories (else a sibling resolves twice,
    # via the extension's own mount), and the ck* linters ignore it.
    - name: Check out the sibling extensions
      id: siblings
      if: ${{ inputs.sibling_repo != '' }}
      shell: bash
      env:
        CK_SIBLING_REPO: ${{ inputs.sibling_repo }}
        CK_SIBLING_TOKEN: ${{ steps.app.outputs.token || github.token }}
      run: ${{ github.action_path }}/checkout-siblings.sh

    # policy.dist.build output is not in git, yet the sibling's PHP and types load it.
    # Built before any step writes the token to disk: the build runs dependency code.
    - name: Read the siblings' declared release builds
      id: sibling-builds
      if: ${{ inputs.sibling_repo != '' }}
      shell: bash
      env:
        CK_SIBLING_DIRS: ${{ steps.siblings.outputs.paths }}
        CK_NODE_VERSION: ${{ inputs.node_version }}
      run: ${{ github.action_path }}/build-siblings.sh plan

    - name: Set up Node for the sibling builds
      if: ${{ steps.sibling-builds.outputs.dirs != '' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node_version }}
        # Auto-caching keys on the workspace root's package.json, not the sibling's.
        package-manager-cache: false

    # Replaces a Bun the job set up earlier; a later Bun step sets its own pin again.
    - name: Set up Bun for the sibling builds
      if: ${{ steps.sibling-builds.outputs.dirs != '' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ steps.sibling-builds.outputs.bun_version_file }}

    - name: Build the siblings' declared release output
      if: ${{ steps.sibling-builds.outputs.dirs != '' }}
      shell: bash
      env:
        CK_SIBLING_BUILD_DIRS: ${{ steps.sibling-builds.outputs.dirs }}
      run: ${{ github.action_path }}/build-siblings.sh build

    # Built on the runner, before the read-only mount.
    - name: Composer install in the siblings that ship runtime packages
      if: ${{ inputs.sibling_repo != '' }}
      shell: bash
      env:
        CK_SIBLING_DIRS: ${{ steps.siblings.outputs.paths }}
        CK_COMPOSER_TOKEN: ${{ steps.app.outputs.token || github.token }}
      run: |
        set -euo pipefail
        if [ -n "${CK_COMPOSER_TOKEN:-}" ]; then
          composer config -g github-oauth.github.com "$CK_COMPOSER_TOKEN"
        fi
        ${{ github.action_path }}/install-sibling-vendor.sh

    # Under the dot directory too; ckconform reads it through the extension's mount.
    - name: Check out the organisation policy defaults
      if: ${{ inputs.policy_defaults != '' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: ${{ inputs.policy_defaults }}
        token: ${{ steps.app.outputs.token || github.token }}
        path: .civikitchen-siblings/policy

    # `volumes` merges by container path (appends); `environment` merges per
    # key (replaces), so the enable list is written in full, siblings first in
    # input order. Absolute paths: compose resolves relative ones against .docker/.
    - name: Compose override — mount and enable the siblings
      id: override
      if: ${{ inputs.sibling_repo != '' }}
      shell: bash
      env:
        CK_SIBLING_DIRS: ${{ steps.siblings.outputs.paths }}
        CK_EXT_KEY: ${{ inputs.ext_key }}
      run: |
        set -euo pipefail
        mounts=""
        keys=""
        set -f
        for dir in $CK_SIBLING_DIRS; do
          # The checkout step names each directory after the sibling's key.
          sibling_key="${dir##*/}"
          mounts="$mounts      - $GITHUB_WORKSPACE/$dir:/var/www/html/ext/$sibling_key:ro"$'\n'
          keys="${keys:+$keys,}$sibling_key"
        done
        override="$RUNNER_TEMP/civikitchen-sibling-override.yml"
        {
          echo "services:"
          echo "  app:"
          echo "    volumes:"
          printf '%s' "$mounts"
          # Without an ext_key the caller owns the enable list; a partial one would replace it.
          if [ -n "$CK_EXT_KEY" ]; then
            echo "    environment:"
            echo "      CIVIKITCHEN_ENABLE_EXTENSIONS: \"$keys,$CK_EXT_KEY\""
            echo "      CIVIKITCHEN_EXTENSION_UNDER_TEST: \"$CK_EXT_KEY\""
          fi
        } > "$override"
        echo "file=$override" >> "$GITHUB_OUTPUT"

    - name: Composer install (private packages over HTTPS)
      if: ${{ inputs.composer_install == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        CK_COMPOSER_TOKEN: ${{ steps.app.outputs.token || github.token }}
      run: |
        set -euo pipefail
        # Global config, so later installs in this job are authenticated too.
        # Private packages must be declared by HTTPS URL, not git@github.com:.
        if [ -n "${CK_COMPOSER_TOKEN:-}" ]; then
          composer config -g github-oauth.github.com "$CK_COMPOSER_TOKEN"
        fi
        # The lock as it stands, dev tree included, on the runner's PHP: a repo
        # whose floor is above it pins `config.platform.php`.
        composer install --no-interaction --no-progress
