name: CiviKitchen JS dependencies
description: >-
  Sets up Node (and Bun for a Bun repo) and, when asked, materializes
  node_modules/ with `npm ci --ignore-scripts` or `bun install
  --frozen-lockfile`, so the bind-mounted checkout serves it to the stack.

inputs:
  node_version:
    description: Node version. Bun replaces npm, not node.
    required: true
  bun:
    description: The repo uses Bun (bun.lock, "packageManager" in package.json).
    default: 'false'
  install:
    description: Install the dependencies after the setup.
    default: 'true'
  working_directory:
    description: >-
      The extension's directory inside the repository. Composite steps do not
      inherit the calling job's defaults.run.working-directory.
    default: '.'

runs:
  using: composite
  steps:
    # Node on both paths: `bun run` starts scripts whose tools (tsc, vitest,
    # playwright) are `#!/usr/bin/env node` executables.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node_version }}
        # The npm cache fails without package-lock.json (a Bun repo); `!x && 'npm' || ''`
        # because a ternary whose first branch is '' falls through to its second.
        cache: ${{ inputs.install == 'true' && inputs.bun != 'true' && 'npm' || '' }}
        # Relative to the workspace root, where setup-node runs.
        cache-dependency-path: |
          ${{ inputs.working_directory }}/package-lock.json
          ${{ inputs.working_directory }}/npm-shrinkwrap.json
          ${{ inputs.working_directory }}/yarn.lock

    # The Bun version pinned in package.json.
    - if: ${{ inputs.bun == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ inputs.working_directory }}/package.json

    # Build steps run from explicit scripts; Bun runs dependency lifecycle
    # scripts only for trustedDependencies.
    - name: Materialize JS dependencies (npm ci / bun install)
      if: ${{ inputs.install == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        CK_USE_BUN: ${{ inputs.bun }}
      run: |
        set -euo pipefail
        if [ "$CK_USE_BUN" = true ]; then
          bun install --frozen-lockfile
        else
          npm ci --ignore-scripts
        fi
