# actionlint does not know job.workflow_sha yet (rhysd/actionlint#707); drop
# these ignores once a release accepts it.
paths:
  .github/workflows/extension-docs.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
  .github/workflows/extension-ci.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
  .github/workflows/playwright-e2e.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
  .github/workflows/extension-release.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
