# Central exceptions for the image scan in .github/workflows/build-dev-images.yml
# (`trivy image`, gate policy: --ignore-unfixed --severity HIGH,CRITICAL).
#
# YAML format, passed explicitly with `--ignorefile trivyignore.yaml`: trivy
# loads .trivyignore by name automatically but the YAML file only when asked
# (the feature is still marked experimental upstream), which is why this file
# is not a dotfile — it is a named input to the scan step, not a magic default.
#
# Every entry needs both a `statement` (what makes this finding not apply to
# these images) and an `expired_at` — an entry without them is a review
# comment, not a merge:
#
#   - id: CVE-0000-00000
#     statement: <why this does not apply here>
#     expired_at: 2027-01-31
#
# expired_at is a MECHANISM, not a convention: trivy prunes an expired entry
# and the finding comes back, so the gate goes red on that date and the
# exception has to be renewed with a fresh reason or deleted. "It was here when
# I got here" is not a reason.
#
# `paths` scopes an entry to where the vulnerable copy actually lives (glob,
# matched against the finding's package path). Use it wherever a CVE could also
# appear in a tree this repo controls — toolbelt/oxlint, toolbelt/oxfmt —
# so that excusing upstream's vulnerable copy does not silently excuse ours.
# The compensating check for everything still suppressed image-wide is
# `npm audit` on those two lockfiles, which trivy is not the only reader of.
#
# Scope: these images are DEVELOPMENT and CI images. That is an argument for
# some exceptions (a CVE reachable only through a service nothing here runs) and
# for none at all in the direction people usually reach for — a dev image that
# eleven repos boot on every push is not an image where an unaudited exception
# is cheap.
#
# What is deliberately NOT in this file: everything under
# /usr/lib/node_modules/npm. That tree is npm's own bundled dependencies
# (tar, glob, minimatch, sigstore, cross-spawn), it was the bulk of the
# findings, and it is fixed by installing a newer npm over the one NodeSource's
# nodejs 20 package ships — see NPM_VERSION in toolbelt/install-dev-tools.sh.
# An exception there would have been an exception for a thing we could fix.

vulnerabilities:
  # -------------------------------------------------------------------------
  # npm's own bundled dependencies
  #
  # /usr/lib/node_modules/npm/node_modules. A newer npm moves this tree
  # (NPM_VERSION), but npm 12.2.1, the current npm, still bundles undici
  # 6.29.0 — confirmed by the image scan on 2026-10-27 — so no release
  # carries this fix yet.
  # -------------------------------------------------------------------------
  - id: CVE-2026-109869
    paths:
      - "usr/lib/node_modules/npm/**"
    statement: >-
      Denial of service in undici via an unhandled stream error. In npm's tree
      only node-gyp loads undici, for the fetch() of Node headers in
      lib/download.js; the worst case is a failed native-addon build in a dev
      container. On expiry re-read the bundled version
      (node -p 'require("/usr/lib/node_modules/npm/node_modules/undici/package.json").version')
      and delete this entry once an npm release ships >= 6.29.1.
    expired_at: 2027-01-31

  # -------------------------------------------------------------------------
  # Go stdlib inside the oxlint-tsgolint binary
  #
  # opt/civikitchen/toolbelt/oxlint/node_modules/@oxlint-tsgolint/*/tsgolint is a
  # prebuilt Go binary from npm; its stdlib version is whatever oxlint built
  # with (1.26.9 in 7.0.2005, the newest on 2026-10-27), and nothing here can
  # relink it. The CVE sits in certificate handling. tsgolint is the type-aware linter behind ckeslint: it reads
  # TypeScript sources the developer points it at, opens no listener and speaks
  # no TLS/HTTP, so it is not reachable. On expiry: `npm view oxlint-tsgolint
  # version` — bump toolbelt/oxlint/package.json as soon as a release built
  # with >= 1.26.10 is out and delete this entry.
  # -------------------------------------------------------------------------
  - id: CVE-2026-111943
    paths:
      - "opt/civikitchen/toolbelt/oxlint/node_modules/@oxlint-tsgolint/**"
    statement: >-
      Go stdlib crypto/x509 certificate handling in the prebuilt tsgolint binary — only reached when
      verifying certificates, which a local linter without TLS never does; see the group note above.
    expired_at: 2027-01-31

  # -------------------------------------------------------------------------
  # CiviCRM core's bundled frontend libraries
  #
  # core/bower_components/* in every flavor. These are CiviCRM's own vendored
  # assets, byte-identical to what every CiviCRM release and every production
  # site ships; the images install the official CiviCRM build and do not
  # rewrite it. Replacing them here would mean shipping a CiviCRM that behaves
  # differently from the one the extension under test runs against in
  # production — which is the one thing these images exist to avoid.
  # -------------------------------------------------------------------------
  - id: NSWG-ECO-328
    statement: >-
      jquery 1.12.4 is the jQuery CiviCRM itself serves on every page
      (CRM/Core/Resources/Common.php loads bower_components/jquery/dist/
      jquery.min.js). The advisory needs the page to make a cross-origin ajax
      request without `dataType` to a host an attacker controls, so the result
      is run through globalEval; CiviCRM's own ajax is same-origin. Not fixable
      downstream: the jQuery major bump is a CiviCRM core decision. On expiry
      recheck whether core has moved bower_components/jquery off 1.x; if it
      has, this entry goes and the images get it for free.
    expired_at: 2027-02-01

  - id: CVE-2026-59869
    statement: >-
      js-yaml 3.13.1 in core/bower_components is loaded by exactly one screen,
      the APIv4 Explorer (CRM/Api4/Page/Api4Explorer.php). The quadratic-time
      parse needs a crafted merge-key chain in the YAML being parsed — which on
      that screen is the document the logged-in developer typed into it. Same
      core-asset argument as jquery above; recheck against core's
      bower_components on expiry.
    expired_at: 2027-02-01

  - id: GHSA-5p4m-2wfm-xmqj
    statement: >-
      The follow-up to CVE-2026-59869 (CVE-2026-59870): quadratic CPU in
      js-yaml's !!omap/!!pairs resolution, same js-yaml 3.13.1 in
      core/bower_components, same single consumer — the APIv4 Explorer parsing
      the YAML the logged-in developer typed into it. Same core-asset argument
      as jquery above; recheck against core's bower_components on expiry.
    expired_at: 2027-02-01

  - id: CVE-2026-84375
    statement: >-
      Third in the js-yaml 3.13.1 merge-key series (GHSA-2883-xcg3-v3hh):
      maxTotalMergeKeys does not bound CPU for empty merge sources, so a
      crafted merge-key chain still costs quadratic time. Same copy in
      core/bower_components, same single consumer — the APIv4 Explorer parsing
      the YAML the logged-in developer typed into it. Same core-asset argument
      as jquery above; recheck against core's bower_components on expiry.
    expired_at: 2027-02-01

  # -------------------------------------------------------------------------
  # PhpSpreadsheet in CiviCRM core's vendor tree
  #
  # Core's vendor tree, reported against its composer/installed.json: in
  # standalone at var/www/html/core, in the buildkit flavors inside the CMS's
  # civicrm directory (Drupal's site-level composer already resolves 5.10.0).
  # Same argument as the bundled frontend libraries: core's composer.lock pins
  # phpoffice/phpspreadsheet 5.8.1 on every line these images build. The fixed
  # 5.x releases require PHP 8.2, which core's stable lines do not; master
  # takes 5.10.0 with civicrm-core#37744. On expiry recheck core's
  # composer.lock for each built line and delete what no longer reports.
  # -------------------------------------------------------------------------
  - id: CVE-2026-108357
    paths:
      - "var/www/html/core/vendor/composer/installed.json"
      - "home/buildkit/buildkit/build/site/**/civicrm/vendor/composer/installed.json"
    statement: >-
      XmlScanner bypass through the unentity() callback, which only the
      SpreadsheetML 2003 reader (Reader/Xml.php) registers. Core reads uploaded
      spreadsheets only in civiimport's Spreadsheet data source, with the Xlsx
      and Ods readers; nothing in core loads Reader/Xml.
    expired_at: 2027-01-31

  - id: CVE-2026-108358
    paths:
      - "var/www/html/core/vendor/composer/installed.json"
      - "home/buildkit/buildkit/build/site/**/civicrm/vendor/composer/installed.json"
    statement: >-
      XmlScanner bypass via ISO-2022 escape sequences in the Xlsx reader that
      civiimport's Spreadsheet data source uses. Reachable by a user with
      import permission uploading a file. The readers pass neither
      LIBXML_NOENT nor LIBXML_DTDLOAD, so libxml 2.9.14 in the images loads no
      external entities; what is left is a denial of service of the uploading
      request in a dev container.
    expired_at: 2027-01-31

  - id: CVE-2026-108359
    paths:
      - "var/www/html/core/vendor/composer/installed.json"
      - "home/buildkit/buildkit/build/site/**/civicrm/vendor/composer/installed.json"
    statement: >-
      Unbounded table:number-rows-repeated in the Ods reader, reached through
      the same civiimport upload. Measured: a 3 KB file exhausts a 256 MB
      memory_limit in that one request. 5.10.0 still accepts repeats up to the
      sheet's row limit, so the upgrade bounds this rather than removing it.
    expired_at: 2027-01-31

  # -------------------------------------------------------------------------
  # civicrm-buildkit's own node_modules (buildkit-based flavors only)
  #
  # /home/buildkit/buildkit/node_modules is created by upstream's
  # bin/civi-download-tools from civicrm-buildkit's committed
  # package-lock.json: jshint, jasmine-core, watch, civicrm-cv, and the
  # optional karma stack. The parent chains below are `npm ls` output from the
  # built image, not a guess.
  #
  # Nothing the images run loads any of it — the entrypoint serves the baked
  # site through Apache/PHP, and no /usr/local/bin/ck* tool references the
  # tree. It is reached only when a developer invokes buildkit's JS test
  # tooling by hand, on a source tree they mounted themselves.
  #
  # Not fixable here either: pinning our own versions over the clone would mean
  # the buildkit flavor no longer reproduces a real civicrm-buildkit install,
  # which is the only reason that flavor exists. `npm audit fix` in the clone
  # at build time was considered and rejected for the same reason, plus it
  # would resolve to whatever is current on each monthly rebuild — the drift
  # this repo pins everything else against.
  # -------------------------------------------------------------------------
  - id: CVE-2024-4068
    statement: >-
      braces 3.0.2 via karma@6.4.4 -> chokidar@3.5.2. Memory exhaustion needs
      imbalanced braces in a watch pattern, i.e. a pattern the developer
      running karma wrote. Reached only by hand-run karma, never by the served
      site. On expiry recheck after a buildkit rebuild; upstream bumping karma
      or its lockfile drops this without any change here.
    expired_at: 2027-01-31

  - id: CVE-2024-21538
    statement: >-
      cross-spawn 4.0.2 via civicrm-cv@0.1.2 -> child-process-promise@2.2.1.
      The ReDoS is in parsing the command string, and the command strings in
      that chain come from buildkit's own scripts, not from request input.
      Recheck after a buildkit rebuild.
    expired_at: 2027-01-31

  - id: CVE-2026-4800
    statement: >-
      lodash 4.17.23 via jshint@2.13.4 and karma@6.4.4. The RCE is in
      _.template with attacker-controlled options.imports KEY names; jshint and
      karma do not expose _.template to any input, and neither is on any
      request path in these images. lodash 4.18.0 is released, so this clears
      as soon as upstream's lockfile moves.
    expired_at: 2027-01-31

  - id: CVE-2026-26996
    paths:
      - "home/buildkit/buildkit/**"
    statement: >-
      minimatch 3.0.8 via jshint@2.13.4 and karma@6.4.4 (both directly and
      through glob@7.x). ReDoS on a crafted glob pattern — again the
      developer's own pattern, in tooling that never sees a request. Scoped:
      toolbelt/oxlint resolves minimatch 10.2.6 and npm 12 bundles a fixed
      one, so a regression in either surfaces instead of being hidden.
      Recheck after a buildkit rebuild.
    expired_at: 2027-01-31

  - id: CVE-2026-27903
    paths:
      - "home/buildkit/buildkit/**"
    statement: >-
      minimatch 3.0.8, same two parents. Unbounded recursive backtracking on
      non-adjacent ** segments in a developer-supplied pattern. Same scoping
      as CVE-2026-26996. Recheck after a buildkit rebuild.
    expired_at: 2027-01-31

  - id: CVE-2026-27904
    paths:
      - "home/buildkit/buildkit/**"
    statement: >-
      minimatch 3.0.8, same two parents. Catastrophic backtracking from nested
      *() extglobs in a developer-supplied pattern. Same scoping as
      CVE-2026-26996. Recheck after a buildkit rebuild.
    expired_at: 2027-01-31

  - id: CVE-2026-69246
    statement: >-
      guzzle 7.15.1 in the vendor/ trees of seven buildkit CLI tools
      (tools/civici, releaser, zipdiff, …). Host-check bypass needs an attacker
      controlling the request URL of a running HTTP client; these are hand-run
      release/maintenance scripts talking to endpoints their invoker chose, and
      nothing the image serves loads them. Same not-ours-to-pin reasoning as
      the node_modules block above. Left image-wide: extension repos lock their
      own guzzle and their osv gate still catches this ID. Recheck after a
      buildkit rebuild; upstream re-locking guzzle >= 7.15.2 drops this.
    expired_at: 2027-01-31

  - id: CVE-2026-111181
    paths:
      - "home/buildkit/buildkit/**"
    statement: >-
      body-parser 1.20.6 via karma@6.4.4, which uses it in its own dev server.
      The denial of service needs request bodies sent to that server, which
      runs only when a developer starts karma by hand; the served site never
      loads it. Scoped to buildkit's clone: the standalone flavors scan clean
      for this ID. Recheck after a buildkit rebuild.
    expired_at: 2027-01-31

  # -------------------------------------------------------------------------
  # Drupal's package_manager test FIXTURE (drupal11 flavors)
  #
  # core/modules/package_manager/tests/fixtures/fake_site/vendor/composer/
  # installed.json declares drupal/core, drupal/core-dev and
  # drupal/core-recommended at 9.8.0. There is no Drupal 9.8.0 in the image:
  # that vendor/ directory contains no PHP file other than composer's own
  # installed.php, and the Drupal the site actually runs is 11.4.4
  # (Drupal::VERSION). Trivy is reading a hand-written fixture manifest that
  # describes an imaginary site, which is exactly what package_manager's tests
  # need it for. Deleting the fixture would break Drupal core's own test suite.
  # -------------------------------------------------------------------------
  - id: CVE-2024-55637
    statement: >-
      No drupal/core 9.8.0 code exists in the image — the finding comes from a
      package_manager test fixture's installed.json, whose vendor/drupal/core
      directory is empty of code. The deserialization gadget chain has nothing
      to be in. On expiry recheck that the fixture is still code-free
      (find .../fake_site/vendor -name '*.php') rather than a vendored Drupal.
    expired_at: 2027-02-01

  - id: CVE-2024-55638
    statement: >-
      Same package_manager fixture, same empty vendor/drupal/core. No code.
      Recheck as above.
    expired_at: 2027-02-01

  - id: CVE-2026-9082
    statement: >-
      Same package_manager fixture, same empty vendor/drupal/core. The SQL
      injection is in Drupal core database code that is not present at 9.8.0 in
      this image at all; the running Drupal is 11.4.4, which trivy scans
      separately and reports clean for this ID. Recheck as above, and
      re-confirm the real web/core/composer.json version is a patched release.
    expired_at: 2027-02-01

  # -------------------------------------------------------------------------
  # Joomla's own vendor tree (joomla flavors)
  #
  # build/site/web/libraries/vendor is the CMS's composer tree, shipped by the
  # Joomla 4.4.14 release civibuild downloads — not CiviCRM's and not ours. The
  # versions are pinned in Joomla's composer.lock; raising them means shipping
  # a Joomla nobody else runs, and the point of this flavor is to test CiviCRM
  # against the Joomla people actually have.
  #
  # Separately worth knowing: Joomla 4.4 is past upstream's support window.
  # That is a question about which Joomla civibuild's site type installs, not a
  # question this file can answer.
  # -------------------------------------------------------------------------
  - id: CVE-2023-29530
    statement: >-
      laminas-diactoros 2.4.1 in Joomla's vendor tree. The multiline-header
      termination bug needs an application that builds PSR-7 messages from
      attacker-controlled header names/values; the throwaway Joomla site these
      images bake serves CiviCRM on localhost and does not. Pinned by Joomla's
      own composer.lock. Recheck after the next Joomla release civibuild picks
      up; drop the entry if the tree has moved.
    expired_at: 2027-01-31

  - id: CVE-2026-32935
    statement: >-
      phpseclib 3.0.37 in Joomla's vendor tree. The AES-CBC padding-oracle
      needs an attacker who can submit chosen ciphertexts to a decrypt endpoint
      and time the responses; this is a single-user localhost dev site with no
      such endpoint exposed. Pinned by Joomla's composer.lock. Recheck after
      the next Joomla release.
    expired_at: 2027-01-31

  - id: CVE-2026-44167
    statement: >-
      phpseclib 3.0.37, same tree. Requires loading untrusted ASN.1/X.509
      input; nothing in the baked site parses attacker-supplied certificates.
      Recheck after the next Joomla release.
    expired_at: 2027-01-31

  - id: CVE-2026-45133
    statement: >-
      symfony/yaml 5.4.23 in Joomla's vendor tree. Unbounded recursion needs
      attacker-controlled YAML; the YAML Joomla parses is its own configuration
      and language files, which ship with the release. Pinned by Joomla's
      composer.lock. Recheck after the next Joomla release.
    expired_at: 2027-01-31

  - id: CVE-2026-45304
    statement: >-
      symfony/yaml 5.4.23, same tree — alias expansion memory exhaustion, same
      "only parses its own config" argument. Recheck after the next Joomla
      release.
    expired_at: 2027-01-31

  - id: CVE-2026-45305
    statement: >-
      symfony/yaml 5.4.23, same tree — ReDoS in Parser::cleanup(), same "only
      parses its own config" argument. Recheck after the next Joomla release.
    expired_at: 2027-01-31
