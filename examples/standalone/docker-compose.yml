# CiviCRM Standalone — extension development quickstart
#
# 1. Point the volume below at your extension repo (uncomment).
# 2. docker compose up -d
#    On first start the app container runs cv core:install and creates a demo
#    login user (admin / admin) — open http://localhost:8080 and log in.
# 3. (If your extension uses composer) install vendor deps as your user:
#      docker compose run --rm --no-deps -u "$(id -u):$(id -g)" -e HOME=/tmp \
#        --entrypoint composer app install -d /var/www/html/ext/myextension
# 4. Enable + test:
#      docker compose exec app cv ext:enable myextension
#      docker compose exec app bash -c "cd /var/www/html/ext/myextension && phpunit"
#
# Tools in the image: cv, civix, composer, node/npm, phpunit, phpstan, mago,
# pcov, xdebug (opt-in via XDEBUG_MODE).
#
# URLs:
#   CiviCRM:    http://localhost:8080
#   phpMyAdmin: http://localhost:8081  (opt-in: --profile pma)
#   Maildev:    http://localhost:1080

# Distinct compose project name (rather than the CWD-derived default, e.g.
# 'standalone') so parallel civikitchen examples don't collide on container
# names / networks.
name: civikitchen-standalone

services:
  app:
    # Override via `IMAGE=... docker compose up` (used by CI to test a
    # locally-built tag). Defaults to the published GHCR tag.
    image: ${IMAGE:-ghcr.io/civico-de/civikitchen:standalone}
    # The :standalone tag is rebuilt daily and on image changes to main, to pick
    # up upstream patches. Always pull on `up` so a stale local copy doesn't
    # mask entrypoint/install fixes.
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      CIVICRM_AUTO_INSTALL: "1"
      CIVICRM_DB_HOST: db
      CIVICRM_DB_NAME: civicrm
      CIVICRM_DB_USER: civicrm
      CIVICRM_DB_PASSWORD: civicrm
      # Must match the host:port you open in the browser. CiviCRM bakes this
      # into every asset URL — a mismatch silently breaks the Angular UI.
      CIVIKITCHEN_SITE_URL: "http://localhost:8080"
      # Auto-create a login user after install. Defaults: pass=admin,
      # email=admin@example.org. Unset CIVIKITCHEN_DEMO_USER to skip.
      CIVIKITCHEN_DEMO_USER: admin
      # The image enables all standard Civi components by default
      # (CiviEvent, CiviContribute, CiviMember, CiviMail, CiviPledge, CiviCase,
      # CiviReport, CiviCampaign). Override with CIVIKITCHEN_COMPONENTS to narrow
      # the set; pass an empty string to keep only the core component.
      # Point Civi's mailer at the maildev sidecar (UI on :1080). Outbound
      # mail from Civi (mailings, notifications, password resets) lands in
      # maildev instead of being silently dropped.
      CIVIKITCHEN_SMTP_HOST: maildev
      CIVIKITCHEN_SMTP_PORT: "1025"
      # Comma-separated extension keys downloaded + enabled after install
      # (e.g. de.systopia.xcm,de.systopia.twingle). Supports key@URL for
      # pinned / forked releases. Empty by default; set the env var in your
      # shell or a .env file alongside this compose file.
      CIVIKITCHEN_EXTRA_EXTENSIONS: "${CIVIKITCHEN_EXTRA_EXTENSIONS:-}"
    # volumes:
    #   - ../path/to/your/extension:/var/www/html/ext/myextension

  db:
    image: mariadb:11.4
    # Civi\Test's schema rebuild creates triggers as the app user; with binary
    # logging the server refuses that unless it trusts non-SUPER creators.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: civicrm
      MYSQL_USER: civicrm
      MYSQL_PASSWORD: civicrm
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in: docker compose --profile pma up -d
  phpmyadmin:
    profiles: [pma]
    image: phpmyadmin/phpmyadmin:5.2.3
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "1080:1080"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Headless Chrome for browser tests (Civi\Test\MinkBase), opt-in:
  #   docker compose --profile browser up -d
  # It shares the app's network, so it opens the site URL as your browser does
  # and MinkBase reaches it at its default localhost:9222.
  browser:
    profiles: [browser]
    image: chromedp/headless-shell:152.0.7939.3
    network_mode: service:app
    # Docker's default 64 MB /dev/shm makes Chrome drop script loads on
    # asset-heavy pages (net::ERR_INSUFFICIENT_RESOURCES); the image README advises 2G.
    shm_size: 2gb

volumes:
  db-data:
