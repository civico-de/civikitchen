# GitHub Actions workflow for a CiviCRM extension repo, using civikitchen.
#
# Copy into your extension repo as .github/workflows/civicrm-tests.yml,
# together with docker-compose.ci.yml from this directory.
# Replace `myextension` with your extension key (workflow + compose file).
name: CiviCRM tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # vendor/ as the runner user, who owns the checkout, before the boot
      # enables the extension (skips an extension without composer.json).
      - name: Install vendor/
        run: >-
          docker compose -f docker-compose.ci.yml run --rm --no-deps -T
          -u "$(id -u):$(id -g)" -e HOME=/tmp --entrypoint sh app
          -c 'exec ck internal composer-install /var/www/html/ext/*/'

      # --wait blocks until the image's healthcheck passes, which needs the
      # first-boot auto-install to have finished.
      - name: Boot CiviCRM (civikitchen standalone)
        run: docker compose -f docker-compose.ci.yml up -d --pull always --wait --wait-timeout 900

      - name: Enable the extension
        run: docker compose -f docker-compose.ci.yml exec -T -u www-data app cv ext:enable myextension

      # CIVICRM_UF=UnitTests uses the isolated <db>_test database; the
      # extension's own vendor/bin/phpunit wins over the image's phpunit 9.
      - name: Run headless phpunit
        run: |
          docker compose -f docker-compose.ci.yml exec -T -u www-data -e CIVICRM_UF=UnitTests app \
            bash -c "cd /var/www/html/ext/myextension && { [ -x vendor/bin/phpunit ] && vendor/bin/phpunit || phpunit; }"

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs app

