# CiviCRM on Drupal 11 — quickstart
# docker compose up -d
# CiviCRM:    http://localhost:8080  (admin / admin)
# phpMyAdmin: http://localhost:8081  (opt-in: --profile pma)
# Maildev:    http://localhost:1080

# Own project name, so parallel examples do not collide on names and networks.
name: civikitchen-drupal11

services:
  app:
    image: ${IMAGE:-ghcr.io/civico-de/civikitchen:drupal11}
    pull_policy: always
    depends_on:
      db:
        condition: service_started
    ports:
      - "8080:80"
    environment:
      CIVICRM_DB_HOST: db
      CIVICRM_DB_ROOT_PASSWORD: root
      CIVIKITCHEN_SITE_URL: "http://localhost:8080"
      # Enable extensions you bind-mount below (comma-separated keys):
      # CIVIKITCHEN_ENABLE_EXTENSIONS: myextension
    # Mount your extension into the CMS extensionsDir (/var/www/html/ext is
    # standalone-only):
    # volumes:
    #   - ../path/to/myextension:/home/buildkit/buildkit/build/site/web/sites/default/files/civicrm/ext/myextension

  db:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opt-in: docker compose --profile pma up -d
  phpmyadmin:
    profiles: [pma]
    image: phpmyadmin/phpmyadmin:5.2.3
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "1080:1080"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  db-data:
