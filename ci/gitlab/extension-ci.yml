# GitLab counterpart of extension-ci.yml, included by ckinit's .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/civico-de/civikitchen/v1/ci/gitlab/extension-ci.yml
#
# Needs a docker executor; the e2e job needs `image:docker:user` support. Overridable:
# CK_IMAGE, CK_DB_IMAGE, CK_LIFECYCLE ("0" skips), CK_NPM_CI, CK_JS_TESTS.
# The web user writes the checkout through the default umask 0000, so
# FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR must stay off.

variables:
  CK_IMAGE: ghcr.io/civico-de/civikitchen:v1
  CK_DB_IMAGE: mariadb:11.4
  CK_LIFECYCLE: "1"
  CK_NPM_CI: "0"
  CK_JS_TESTS: "0"

.civikitchen:
  image:
    name: $CK_IMAGE
    # ckboot runs the image entrypoint itself, after the checkout exists.
    entrypoint: [""]
  services:
    - name: $CK_DB_IMAGE
      alias: db
      # Civi\Test's schema rebuild creates triggers as the app user; with binary
      # logging the server refuses that unless it trusts non-SUPER creators.
      command: ["--log-bin-trust-function-creators=1"]
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: civicrm
    MYSQL_USER: civicrm
    MYSQL_PASSWORD: civicrm
    CIVIKITCHEN_SITE_URL: http://localhost:8080
    CK_IN_IMAGE: "1"
    npm_config_cache: /tmp/npm-cache
  before_script:
    # The image runs as the web user; only the e2e job starts as root.
    - as_web() { if [ "$(id -u)" = 0 ]; then runuser -u www-data -- "$@"; else "$@"; fi; }
    # Before provisioning, as on GitHub: enabling the extension may read the
    # bundle. Install hooks never run; the web user owns the tree.
    - if [ "$CK_NPM_CI" = "1" ] || [ "$CK_JS_TESTS" = "1" ] || [ -n "${CK_E2E:-}" ]; then as_web npm ci --ignore-scripts; fi
    # vendor/ before ckboot enables the extension; the checkout is writable
    # for the web user through the umask above.
    - as_web ck internal composer-install .
    - ext_dir=$(ckboot)
    - cd "$ext_dir"

civikitchen-ci:
  extends: .civikitchen
  # A job without rules is left out of merge request pipelines, whose status
  # is the one the merge request shows.
  rules:
    - when: on_success
  script:
    - ck ci
    - if [ "$CK_JS_TESTS" = "1" ]; then npm test; fi
    - if [ "$CK_LIFECYCLE" = "1" ]; then cklifecycle; fi

civikitchen-e2e:
  extends: .civikitchen
  rules:
    - exists:
        - playwright.config.ts
        - playwright.config.js
  # Browsers and their system packages install as root; the suite then drops
  # to the web user so its cv calls leave no root-owned caches in the site.
  image:
    docker:
      user: root
  variables:
    CK_E2E: "1"
    PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    # The image creates this login only when asked; the suite reads it back.
    CIVIKITCHEN_DEMO_USER: admin
    CIVIKITCHEN_DEMO_PASS: admin
    DEMO_USER: admin
    DEMO_PASS: admin
    CIVICRM_BASE_URL: http://localhost:8080
  script:
    - npx playwright install --with-deps
    - as_web npm run test:e2e
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - playwright-report/
      - test-results/
