# The CiviKitchen mago baseline; a repo's own mago.toml replaces it (and may
# `extends` it). [linter] carries no layout rule, so [formatter] output is lint-clean.
# No [source]: ckfmt and cklint pass an explicit file list.

# Without it the formatter emits the PHP-8.4-only `new X()->m()`, which the
# PHP-8.4 container's `php -l` cannot catch.
php-version = "8.1"

[formatter]
# Drupal preset: 2-space indent, same-line braces, uppercase TRUE/FALSE/NULL —
# CiviCRM core's own layout.
preset = "drupal"
# `declare(strict_types = 1)`, as core and the extensions write it; the preset
# emits `strict_types=1`.
space-around-assignment-in-declare = true

[linter]
# mago's default only fails on error-level findings — but a rule worth
# running is worth gating on, so fail on everything it reports.
minimum-fail-level = "note"

[linter.rules]
# A disabled rule's leftover `@mago-expect lint:<rule>` lines fail as
# `unfulfilled-expect`: remove them in the same commit.
#
# Layout belongs to ckfmt; CiviCRM's mixed naming idiom fits no naming rule.
array-style = { enabled = false }
class-name = { enabled = false }
constant-name = { enabled = false }
enum-name = { enabled = false }
file-name = { enabled = false }
function-name = { enabled = false }
interface-name = { enabled = false }
invalid-open-tag = { enabled = false }
lowercase-keyword = { enabled = false }
lowercase-type-hint = { enabled = false }
no-closing-tag = { enabled = false }
no-hash-comment = { enabled = false }
no-php-tag-terminator = { enabled = false }
no-short-opening-tag = { enabled = false }
no-trailing-space = { enabled = false }
trait-name = { enabled = false }

# The test bootstrap eval()s core's boot code, which would inherit strict_types.
strict-types = { enabled = true, exclude = ["tests/phpunit/bootstrap.php", "**/tests/phpunit/bootstrap.php"] }

# Covered by other gates: name-boolean-arguments, cktaint, spaze/disallowed-calls.
literal-named-argument = { enabled = false }
tainted-data-to-sink = { enabled = false }
no-debug-symbols = { enabled = false }
disallowed-functions = { enabled = false }

# isset()/empty() on untyped, nested CiviCRM API arrays is the house idiom;
# the ??/array_key_exists rewrites these demand are not semantics-preserving.
no-empty = { enabled = false }
no-isset = { enabled = false }

# Core includes every module extension's info.xml <file>.php on each request and
# warns when it is missing, so a mixin-only extension's main file has no code.
no-redundant-file = { enabled = false }

# There is no TODO(#ticket) convention in these repos to enforce.
tagged-todo = { enabled = false }
tagged-fixme = { enabled = false }

# `$x ?: fallback()` on a call result is the deliberate falsy-fallback idiom;
# the rewrite this rule asks for evaluates the left-hand call twice.
no-shorthand-ternary = { enabled = false }

# Production classes only: test cases and upgraders grow methods by design.
too-many-methods = { enabled = true, exclude = ["tests/**", "**/tests/**", "CRM/*/Upgrader.php"] }

# A test that drives a real preProcess() has to simulate the request that
# CRM_Utils_Request::retrieve() reads; production code keeps the rule.
no-request-variable = { enabled = true, exclude = ["tests/**", "**/tests/**"] }

# CiviKitchen's own rules (toolbelt/mago-ext), codes civikitchen/<rule>. A repo
# `extends` this file and repeats this table with worker options: --disable=<code>,…
# --exclude=<code>:<glob>,… --max-lines=<n> --external-actions=<ActionClass>,…
# name-boolean-arguments starts disabled; tests may read REMOTE_ADDR.
[extension-hosts.civikitchen]
command = ["php", "/opt/civikitchen/toolbelt/mago-ext/worker.php", "--disable=civikitchen/name-boolean-arguments",
  "--exclude=civikitchen/remote-address:tests/**,civikitchen/remote-address:**/tests/**"]

[analyzer]
# Every use of a mixed value is still reported (mixed-argument, mixed-operand,
# …); assigning one before an is_*() check narrows it is the house idiom.
ignore = ["mixed-assignment"]
