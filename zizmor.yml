# zizmor workflow audit, run by `scaffold/ck make lint-actions` with
# --no-online-audits. Every entry below is an exemption and states its reason.

rules:
  unpinned-uses:
    config:
      policies:
        # This repo's reusable workflows are called at the moving @v1 ref, the
        # versioned contract (docs/adr/0001-*). Third-party actions need a hash.
        civico-de/civikitchen/*: ref-pin
        "*": hash-pin

  template-injection:
    ignore:
      # The dynamic matrix comes from resolve-civicrm, which emits only
      # validated ^[0-9]+\.[0-9]+\.[0-9]+$ versions or exits non-zero.
      - build-dev-images.yml

  cache-poisoning:
    ignore:
      # setup-node caches only when given a `cache:` input; this call does not
      # pass one, so there is no cache for a tag build to poison.
      - publish-schema.yml

  use-trusted-publishing:
    ignore:
      # Trusted publishing is an npmjs.com feature; GitHub Packages takes the
      # run-scoped GITHUB_TOKEN, so there is no long-lived secret to replace.
      - publish-schema.yml
