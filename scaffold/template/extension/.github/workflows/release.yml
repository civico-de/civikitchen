# Thin caller of civikitchen's reusable extension-release.yml at @v1, run on a
# vX.Y.Z tag. `with:` and `secrets:` go below the END marker; a repo declaring
# `release: none` in civikitchen.yaml loses this file on `ckinit --update`.
# BEGIN CIVIKITCHEN MANAGED caller
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write        # a called workflow can only narrow this
    uses: civico-de/civikitchen/.github/workflows/extension-release.yml@v1
# END CIVIKITCHEN MANAGED caller
